<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="二十四节气数字长卷 —— 单页交互式数字博物馆：数字水墨 × 博物馆展签排版">
<title>二十四节气 · 数字长卷</title>
<link rel="icon" href="data:,">
<script>if(matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.dataset.theme='dark';</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar{width:0;height:0;display:none}
:root{
  --paper:#F5F1E8; --ink:#1A1A1A; --cin:#C0392B; --ind:#2C3E50;
  --paper-2:#ECE6D9;
  --ink-60:rgba(26,26,26,.6);
  --line:rgba(26,26,26,.15);
  --panel:rgba(245,241,232,.93);
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
[data-theme="dark"]{--paper:#17181A;--ink:#F0EBDF;--paper-2:#202225;--ink-60:rgba(240,235,223,.6);--line:rgba(240,235,223,.16);--panel:rgba(23,24,26,.9)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#17181A;--ink:#F0EBDF;--paper-2:#202225;--ink-60:rgba(240,235,223,.6);--line:rgba(240,235,223,.16);--panel:rgba(23,24,26,.9)}
}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--sans);overflow-x:hidden;transition:background-color .6s ease,color .6s ease;-webkit-font-smoothing:antialiased}
::selection{background:var(--cin);color:#F5F1E8}
:focus-visible{outline:2px solid var(--cin);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
#stage{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
#ss{height:2400vh}
/* ============ 页眉 ============ */
.hdr{position:fixed;top:0;left:0;right:0;z-index:30;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;padding:24px 32px;pointer-events:none}
.brand{justify-self:start}
.brand h1{font-family:var(--serif);font-weight:900;font-size:20px;letter-spacing:.4em}
.brand p{margin-top:8px;font-size:11px;letter-spacing:.32em;color:var(--ink-60)}
.hint{justify-self:center;padding-top:12px;font-size:11px;letter-spacing:.28em;color:var(--ink-60);text-align:center}
.ctl{justify-self:end;display:flex;gap:8px;pointer-events:auto}
.btn{width:40px;height:40px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);color:var(--ink);cursor:pointer;transition:border-color .3s,color .3s,background-color .6s,transform .2s}
.btn:hover{border-color:var(--cin);color:var(--cin)}
.btn:active{transform:translateY(1px)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* ============ 展签 ============ */
.label{position:fixed;z-index:20;left:32px;bottom:120px;width:min(544px,calc(100vw - 64px));background:var(--panel);border:1px solid var(--line);padding:32px;transition:background-color .6s,border-color .6s}
.label::before{content:"";position:absolute;inset:6px;border:1px solid var(--line);pointer-events:none}
.lt-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.lt-idx{font-size:11px;letter-spacing:.26em;color:var(--ink-60);padding-top:8px}
.lt-season{display:inline-block;background:var(--cin);color:#F5F1E8;font-family:var(--serif);padding:2px 8px;margin-left:8px;font-size:12px;letter-spacing:.1em}
.seal{font-family:var(--serif);background:var(--cin);color:#F5F1E8;width:44px;height:58px;display:grid;place-items:center;font-size:19px;line-height:1.4;writing-mode:vertical-rl;letter-spacing:.12em;box-shadow:2px 3px 0 rgba(26,26,26,.14);border-radius:2px;flex:0 0 auto}
.lt-name{font-family:var(--serif);font-weight:900;font-size:clamp(44px,7vw,80px);line-height:1.1;letter-spacing:.1em}
.lt-name span{display:inline-block}
.lt-py{margin-top:8px;font-size:13px;letter-spacing:.3em;color:var(--ink-60)}
.lt-date{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;font-size:12px;letter-spacing:.14em;color:var(--ink-60)}
.lt-hou{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.lt-hou div{border-top:2px solid var(--ink);padding-top:8px;font-family:var(--serif);font-size:14px;line-height:1.7}
.lt-hou span{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.22em;color:var(--ink-60);margin-bottom:4px}
.lt-desc{margin-top:24px;font-size:14px;line-height:2;opacity:.88}
.lt-poem{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);font-family:var(--serif);font-size:15px;line-height:1.9}
.lt-poem cite{display:block;margin-top:8px;font-size:12px;font-style:normal;letter-spacing:.14em;color:var(--ink-60);text-align:right}
.label .a{opacity:0}
.label.swap .a{animation:rise .8s cubic-bezier(.22,1,.36,1) forwards;animation-delay:calc(var(--i,0)*80ms + 60ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* ============ 右侧进度轨 ============ */
.rail{position:fixed;right:28px;top:50%;transform:translateY(-50%);height:min(44vh,400px);width:24px;z-index:25;cursor:pointer;touch-action:none}
.rail-track{position:relative;width:2px;height:100%;background:var(--line);margin:0 auto}
.rail-tick{position:absolute;left:50%;width:6px;height:2px;transform:translate(-50%,-50%);background:var(--line);transition:background-color .3s,width .3s}
.rail-tick.on{background:var(--cin);width:12px}
.rail-thumb{position:absolute;left:50%;top:0;width:10px;height:34px;transform:translate(-50%,-50%);background:var(--cin);border-radius:5px;pointer-events:none}
.rail-cap{position:absolute;top:-32px;left:50%;transform:translateX(-50%);writing-mode:vertical-rl;font-size:10px;letter-spacing:.3em;color:var(--ink-60);height:72px}
.rail-num{position:absolute;bottom:-40px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.2em;color:var(--ink-60)}
/* ============ 底部横向节气带 ============ */
.strip{position:fixed;left:0;right:0;bottom:0;z-index:28;height:88px;background:var(--panel);border-top:1px solid var(--line);overflow:hidden;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;transition:background-color .6s,border-color .6s}
.strip:active{cursor:grabbing}
.track{position:absolute;left:0;top:0;bottom:0;display:flex;will-change:transform}
.chip{flex:0 0 auto;min-width:128px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-family:var(--serif);letter-spacing:.24em;font-size:17px;position:relative;padding:8px 20px 8px 28px;transition:color .3s}
.chip i{font-style:normal;font-family:var(--sans);font-size:11px;letter-spacing:.24em;color:var(--ink-60)}
.chip::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--cin);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.22,1,.36,1)}
.chip:hover{color:var(--cin)}
.chip[aria-current="true"]{color:var(--cin)}
.chip[aria-current="true"]::after{transform:scaleX(1)}
/* ============ 提示条 ============ */
.toast{position:fixed;top:88px;left:50%;transform:translate(-50%,-10px);z-index:50;background:var(--ink);color:var(--paper);font-size:12px;letter-spacing:.16em;padding:12px 24px;opacity:0;pointer-events:none;transition:opacity .4s,transform .4s;max-width:80vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* ============ 响应式 ============ */
@media (max-width:900px){.hint{display:none}}
@media (max-width:720px){
  .hdr{padding:16px}
  .label{left:16px;right:16px;width:auto;bottom:104px;padding:24px}
  .lt-name{font-size:clamp(40px,12vw,56px)}
  .rail{right:10px;width:16px}
  .rail-cap{display:none}
  .rail-num{bottom:-34px}
  .chip{min-width:104px;font-size:15px;padding:8px 14px 8px 20px}
  .strip{height:76px}
}
@media (max-width:480px){
  .lt-hou{gap:8px}
  .lt-hou div{font-size:12px}
  .lt-desc{font-size:13px}
  .brand h1{font-size:16px;letter-spacing:.3em}
  .brand p{font-size:10px}
  .btn{width:36px;height:36px}
  .lt-date{flex-direction:column;gap:4px}
}
@media (min-width:1800px){
  .hdr{padding:32px 48px}
  .label{left:48px;width:608px;padding:40px}
  .lt-name{font-size:96px}
  .rail{right:48px}
}
@media (max-height:600px){
  .label{bottom:96px;padding:16px 20px}
  .lt-name{font-size:34px}
  .lt-desc{display:none}
  .lt-hou{margin-top:8px}
  .lt-date{margin-top:8px;padding-top:8px}
}
/* ============ 减弱动效 ============ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .label .a{opacity:1}
}
/* ============ 打印海报 ============ */
.poster{display:none}
@media print{
  @page{size:A4 portrait;margin:0}
  #ss,.hdr,.rail,.strip,.toast,.label{display:none!important}
  body{background:#F5F1E8!important;color:#1A1A1A!important;height:auto!important}
  #stage{position:absolute;top:0;left:0;width:210mm;height:140mm;z-index:0}
  .poster{display:block!important;background:#F5F1E8;padding:10mm 18mm 14mm;page-break-inside:avoid}
  .poster *{color:#1A1A1A}
  .p-top{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #1A1A1A;padding-bottom:5mm}
  .p-title{font-family:var(--serif);font-weight:900;font-size:22pt;letter-spacing:.35em}
  .p-sub{font-size:8pt;letter-spacing:.3em;color:rgba(26,26,26,.6)}
  .p-mid{display:flex;justify-content:space-between;align-items:flex-start;margin-top:7mm}
  .p-name{font-family:var(--serif);font-weight:900;font-size:40pt;letter-spacing:.1em}
  .p-meta{text-align:right;font-size:9pt;line-height:2.1;letter-spacing:.12em;color:rgba(26,26,26,.75)}
  .p-desc{margin-top:7mm;font-size:10pt;line-height:2.1;max-width:160mm}
  .p-poem{margin-top:6mm;font-family:var(--serif);font-size:12pt}
  .p-poem cite{font-size:8pt;color:rgba(26,26,26,.6);margin-left:4mm;font-style:normal}
  .p-foot{margin-top:8mm;font-size:8pt;letter-spacing:.3em;color:rgba(26,26,26,.5);display:flex;justify-content:space-between}
}
</style>

<canvas id="stage" role="presentation" aria-hidden="true"></canvas>

<header class="hdr">

    <h1>二十四节气</h1>
    <p>数字长卷 · THE 24 SOLAR TERMS</p>
  </div>
  <p class="hint">滚动展卷 · 横向拖拽速览 · ← → 逐气切换</p>
  <div class="ctl">
    <button class="btn" id="btnSound" aria-pressed="false" aria-label="开启环境音" title="环境音"></button>
    <button class="btn" id="btnTheme" aria-pressed="false" aria-label="切换明暗主题" title="明暗主题"></button>

<section class="label" id="label" aria-label="当前节气展签"></section>

<script>
"use strict";
/* ================================================================
   二十四节气数字长卷 · 单文件实现
   结构：数据(T24) → 引擎(canvas/粒子/形态过渡) → 24 场景 → UI/音频
   ================================================================ */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const frac=v=>v-Math.floor(v);
const hash=n=>frac(Math.sin(n*127.1+311.7)*43758.5453);
const easeIO=t=>t*t*(3-2*t);

/* ============ 数据：24 节气（真实文案） ============ */
const T24=[
{id:'lichun',name:'立春',py:'Lìchūn',season:'春',date:'公历 2月3日—5日',deg:'太阳黄经 315°',
hou:['东风解冻','蛰虫始振','鱼陟负冰'],
desc:'东风破冰，大地回春。冻土之下蛰虫微微颤动，河面薄冰裂开细纹，农人扶犁而立，把一年的期望写进第一锄松软的泥土里。',
poem:'律回岁晚冰霜少，春到人间草木知。',src:'宋 · 张栻《立春偶成》'},
{id:'yushui',name:'雨水',py:'Yǔshuǐ',season:'春',date:'公历 2月18日—20日',deg:'太阳黄经 330°',
hou:['獭祭鱼','候雁北','草木萌动'],
desc:'雪化成水，云气润土。细雨如丝，草木闻声而萌，水獭捕鱼祭于水面，鸿雁自南方归来，万物在此刻饮饱了第一口春天的水。',
poem:'好雨知时节，当春乃发生。',src:'唐 · 杜甫《春夜喜雨》'},
{id:'jingzhe',name:'惊蛰',py:'Jīngzhé',season:'春',date:'公历 3月5日—7日',deg:'太阳黄经 345°',
hou:['桃始华','仓庚鸣','鹰化为鸠'],
desc:'一声春雷，唤醒深藏的蛰虫。桃花初绽，黄鹂试声，田间开始有了声响。冬的静默被打破，生命自土中抬起头来张望。',
poem:'微雨众卉新，一雷惊蛰始。',src:'唐 · 韦应物《观田家》'},
{id:'chunfen',name:'春分',py:'Chūnfēn',season:'春',date:'公历 3月20日—22日',deg:'太阳黄经 0°',
hou:['玄鸟至','雷乃发声','始电'],
desc:'昼夜均分，寒暑平衡。燕子衔着春水归来，雷声自地底滚动，第一道闪电划亮长空。这是天平正中的一年之中点。',
poem:'春分雨脚落声微，柳岸斜风带客归。',src:'唐 · 徐铉《春分日》'},
{id:'qingming',name:'清明',py:'Qīngmíng',season:'春',date:'公历 4月4日—6日',deg:'太阳黄经 15°',
hou:['桐始华','田鼠化为鴽','虹始见'],
desc:'桐花始白，天朗气清。细雨如雾，远山淡成一层水墨，人们扫墓、踏青、插柳，把思念与希望一同交给春天。',
poem:'清明时节雨纷纷，路上行人欲断魂。',src:'唐 · 杜牧《清明》'},
{id:'guyu',name:'谷雨',py:'Gǔyǔ',season:'春',date:'公历 4月19日—21日',deg:'太阳黄经 30°',
hou:['萍始生','鸣鸠拂其羽','戴胜降于桑'],
desc:'萍生水面，戴胜栖桑。雨生百谷，茶农赶在谷雨前采下新芽，最后一口春雨落在翻好的田垄上，春事至此将尽。',
poem:'谷雨春光晓，山川黛色青。',src:'唐 · 元稹《咏廿四气诗·谷雨》'},
{id:'lixia',name:'立夏',py:'Lìxià',season:'夏',date:'公历 5月5日—7日',deg:'太阳黄经 45°',
hou:['蝼蝈鸣','蚯蚓出','王瓜生'],
desc:'蝼蝈夜鸣，蚯蚓翻土。绿荫渐浓，荷风未至，蝉已在枝头预演整个夏天。夏天像一壶煮沸的水，咕嘟咕嘟地冒上来。',
poem:'绿树阴浓夏日长，楼台倒影入池塘。',src:'唐 · 高骈《山亭夏日》'},
{id:'xiaoman',name:'小满',py:'Xiǎomǎn',season:'夏',date:'公历 5月20日—22日',deg:'太阳黄经 60°',
hou:['苦菜秀','靡草死','麦秋至'],
desc:'苦菜秀野，麦粒渐满。物至于此，小得盈满——麦穗灌浆而未满，正是最好的分寸：将满未满之间，最见天地的留白。',
poem:'最爱垄头麦，迎风笑落红。',src:'宋 · 欧阳修《小满》'},
{id:'mangzhong',name:'芒种',py:'Mángzhòng',season:'夏',date:'公历 6月5日—7日',deg:'太阳黄经 75°',
hou:['螳螂生','鵙始鸣','反舌无声'],
desc:'螳螂生，鵙始鸣。有芒的麦子快收，有芒的稻子可种。这是田野一年中最忙的日子，人追着季节跑，汗珠子摔成八瓣。',
poem:'时雨及芒种，四野皆插秧。',src:'宋 · 陆游《时雨》'},
{id:'xiazhi',name:'夏至',py:'Xiàzhì',season:'夏',date:'公历 6月21日—22日',deg:'太阳黄经 90°',
hou:['鹿角解','蜩始鸣','半夏生'],
desc:'日长之至，日影短至。蝉鸣如潮，白昼把影子压到最短，而后光明一寸一寸退回夜晚。至，既是极点，也是新的起点。',
poem:'昼晷已云极，宵漏自此长。',src:'唐 · 韦应物《夏至避暑北池》'},
{id:'xiaoshu',name:'小暑',py:'Xiǎoshǔ',season:'夏',date:'公历 7月6日—8日',deg:'太阳黄经 105°',
hou:['温风至','蟋蟀居宇','荷始华'],
desc:'温风至，荷始华。暑气初盛未烈，蟋蟀搬进屋檐乘凉。荷塘边风过处，凉意在最热的日子里若隐若现，蜻蜓点水而过。',
poem:'倏忽温风至，因循小暑来。',src:'唐 · 元稹《咏廿四气诗·小暑》'},
{id:'dashu',name:'大暑',py:'Dàshǔ',season:'夏',date:'公历 7月22日—24日',deg:'太阳黄经 120°',
hou:['腐草为萤','土润溽暑','大雨时行'],
desc:'土润溽暑，大雨时行。腐草化萤，暮色里点点流动。三伏正中，天地像一口蒸笼，暴雨是它偶尔掀起的锅盖。',
poem:'何以销烦暑，端居一院中。',src:'唐 · 白居易《销暑》'},

/* ============ 主题调色板（画布侧，随主题插值过渡） ============ */
const THEMES={
  light:{paper:[245,241,232],ink:[26,26,26],cin:[192,57,43],ind:[44,62,80],flake:[96,108,128],glow:[214,120,92]},
  dark:{paper:[23,24,26],ink:[240,235,223],cin:[209,86,66],ind:[112,134,160],flake:[228,224,212],glow:[228,168,124]}
};
let themeName=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
let userTheme=null;
const P={};
function setP(src){for(const k in src)P[k]=src[k].slice();}
setP(THEMES[themeName]);
let Pfrom={},Pto={},pT=1,grainDirty=true;
function themeTo(name){for(const k in P)Pfrom[k]=P[k].slice();Pto=THEMES[name];pT=0;themeName=name;buildBlob();grainDirty=true;markDirty();}
function stepPalette(dt){if(pT<1){pT=Math.min(1,pT+dt/0.6);const e=easeIO(pT);for(const k in Pto)P[k]=Pfrom[k].map((c,j)=>lerp(c,Pto[k][j],e));grainDirty=true;}}
const css=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const mix=(c1,c2,t)=>[lerp(c1[0],c2[0],t),lerp(c1[1],c2[1],t),lerp(c1[2],c2[2],t)];

/* ============ 减弱动效：静态构图模式 ============ */
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)');
let staticMode=REDUCED.matches;
let dirty=true;
const markDirty=()=>{dirty=true;};
REDUCED.addEventListener('change',e=>{staticMode=e.matches;if(staticMode)tAnim=4.2;markDirty();});

/* ============ 画布与 DPR 适配 ============ */
const canvas=document.getElementById('stage');
const ctx=canvas.getContext('2d',{alpha:false});
let W=0,H=0,DPR=1;
function resize(){
  W=innerWidth;H=innerHeight;
  let d=Math.min(devicePixelRatio||1,2);
  const area=W*H*d*d;
  if(area>4.6e6)d=Math.max(1,Math.sqrt(4.6e6/(W*H)));
  DPR=d;
  canvas.width=Math.max(1,Math.round(W*d));
  canvas.height=Math.max(1,Math.round(H*d));
  ctx.setTransform(d,0,0,d,0,0);
  grainDirty=true;markDirty();
}
addEventListener('resize',resize);

/* ============ 离屏资源（仅 2 张、同对象原地重绘，无按场景新建） ============ */
const grainCv=document.createElement('canvas');grainCv.width=grainCv.height=256;
let grainPat=null;
function buildGrain(){
  const g=grainCv.getContext('2d');g.clearRect(0,0,256,256);
  g.fillStyle=css(P.ink,0.05);
  for(let i=0;i<900;i++)g.fillRect((hash(i*3.17)*256)|0,(hash(i*7.7)*256)|0,1,1);
  g.fillStyle=css(P.ink,0.03);
  for(let i=0;i<200;i++)g.fillRect((hash(i*13.3+99)*256)|0,(hash(i*29.1+7)*256)|0,2,1);
  grainPat=ctx.createPattern(grainCv,'repeat');
}
const blobCv=document.createElement('canvas');blobCv.width=blobCv.height=256;
function buildBlob(){
  const g=blobCv.getContext('2d');g.clearRect(0,0,256,256);
  const rg=g.createRadialGradient(128,128,10,128,128,128);
  rg.addColorStop(0,css(P.ink,0.6));rg.addColorStop(0.55,css(P.ink,0.25));rg.addColorStop(1,css(P.ink,0));
  g.fillStyle=rg;g.fillRect(0,0,256,256);
}

/* ============ 粒子场（定长数组，逐帧零分配） ============ */
const PMAX=2200;let quality=1,PNUM=2000;
const R1=new Float32Array(PMAX),R2=new Float32Array(PMAX),R3=new Float32Array(PMAX);
const STG=new Float32Array(PMAX),ARC=new Float32Array(PMAX);
const PX=new Float32Array(PMAX),PY=new Float32Array(PMAX),VX=new Float32Array(PMAX),VY=new Float32Array(PMAX);
const PS=new Float32Array(PMAX),BC=new Uint8Array(PMAX);
for(let i=0;i<PMAX;i++){
  R1[i]=Math.random();R2[i]=Math.random();R3[i]=Math.random();
  STG[i]=Math.random()*0.3;ARC[i]=Math.random()*2-1;PS[i]=1.1+Math.random()*1.8;
}
function applyQuality(){PNUM=Math.round(2000*quality);}

/* ============ 雪堆（大雪/大寒 共享，进场重置） ============ */
const PILE=new Float32Array(64);
function pileH(nx){const f=clamp(nx,0,0.999)*63;const k=Math.floor(f);const u=f-k;return PILE[k]*(1-u)+PILE[k+1]*u;}
function pileGrow(dt,s){if(s>0.35)for(let k=0;k<64;k++){PILE[k]+=dt*H*0.005*(0.4+hash(k*13.7+3));if(PILE[k]>H*0.07)PILE[k]=H*0.07;}}
function drawPile(gy){
  if(!PILE[0]&&!PILE[16]&&!PILE[32]&&!PILE[48]&&!PILE[63])return;
  ctx.beginPath();ctx.moveTo(0,gy);
  for(let k=0;k<=64;k++)ctx.lineTo(k/64*W,gy-PILE[Math.min(63,k)]);
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();
  ctx.fillStyle=css(P.flake,themeName==='dark'?0.85:0.22);ctx.fill();
  ctx.strokeStyle=css(P.flake,0.45);ctx.lineWidth=1.2;ctx.beginPath();
  for(let k=0;k<=64;k++){const x=k/64*W;const y=gy-PILE[Math.min(63,k)];k?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  ctx.stroke();
}

/* ============ 指针 → 对流场扰动 ============ */
let mx=-9e3,my=-9e3,pvx=0,pvy=0,pLast=0;
addEventListener('pointermove',e=>{
  const now=performance.now();const dtm=Math.max(8,now-pLast);
  const nx=e.clientX,ny=e.clientY;
  if(pLast){pvx=lerp(pvx,(nx-mx)/dtm*16,0.4);pvy=lerp(pvy,(ny-my)/dtm*16,0.4);}
  mx=nx;my=ny;pLast=now;
},{passive:true});
document.addEventListener('mouseleave',()=>{mx=-9e3;my=-9e3;pvx=0;pvy=0;});

/* ============ 滚动 → 节气映射 ============ */
let fDisp=0,fTarget=0,activeIdx=-1;
function maxScroll(){return Math.max(1,document.documentElement.scrollHeight-innerHeight);}

/* ============ 主循环（rAF 驱动，含 fps 守卫与单帧耗时监控） ============ */
let lastT=performance.now(),tAnim=2.4;
let fpsEma=60,lowFrames=0,costMax=0,costWarned=false;

function computeMorph(){
  const i0=clamp(Math.floor(fDisp),0,23);const fr=fDisp-i0;
  let ai=i0,bi=i0,tm=0;
  if(fr>0.5&&i0<23){bi=i0+1;tm=(fr-0.5)*2;}
  const sA=ai===bi?1:1-tm,sB=ai===bi?1:tm;
  return{ai,bi,tm,sA,sB};
}

const TX={x:0,y:0},TB={x:0,y:0};
function updateParticles(ai,bi,tm,sA,sB,snap){
  const scA=SC[ai],scB=SC[bi];const t=tAnim;
  const flow=(scA.flow??1)*(snap?0:1);
  const pr=Math.min(W,H)*0.13,pr2=pr*pr;
  for(let i=0;i<PNUM;i++){
    scA.target(i,t,sA,TX);
    let ax=TX.x,ay=TX.y,lcol=scA.bcol(i);
    if(tm>0){
      scB.target(i,t,sB,TB);
      const li0=clamp((tm-STG[i])/0.7,0,1);const li=easeIO(li0);
      if(li>0){
        const dx=TB.x-ax,dy=TB.y-ay;const l=Math.sqrt(dx*dx+dy*dy)||1;
        const off=Math.sin(Math.PI*li)*ARC[i]*46;
        ax=lerp(ax,TB.x,li)-dy/l*off;
        ay=lerp(ay,TB.y,li)+dx/l*off;
        if(li>0.5)lcol=scB.bcol(i);
      }
    }
    BC[i]=lcol;
    if(snap){PX[i]=ax;PY[i]=ay;VX[i]=0;VY[i]=0;continue;}
    let fx=(Math.sin(PY[i]*0.006+t*0.7)+Math.sin(PY[i]*0.011-t*0.43))*0.012*flow;
    let fy=Math.cos(PX[i]*0.005-t*0.51)*0.012*flow;
    const ddx=PX[i]-mx,ddy=PY[i]-my,d2=ddx*ddx+ddy*ddy;
    if(d2<pr2){
      const d=Math.sqrt(d2)||1;const f=1-d2/pr2;
      fx+=ddx/d*f*1.6+pvx*f*0.045;
      fy+=ddy/d*f*1.6+pvy*f*0.045;
    }
    VX[i]=(VX[i]+(ax-PX[i])*0.021+fx)*0.86;
    VY[i]=(VY[i]+(ay-PY[i])*0.021+fy)*0.86;
    PX[i]+=VX[i];PY[i]+=VY[i];
  }
}

function decorDraw(idx,settle,tm,incoming){
  const sc=SC[idx];if(!sc.decor)return;
  ctx.save();
  if(tm>0){
    const d=1-settle;
    const ys=d*(incoming?-H*0.07:H*0.07);
    const sy=1-d*0.07;
    ctx.translate(0,H*0.5+ys);ctx.scale(1,sy);ctx.translate(0,-H*0.5);
    ctx.globalAlpha=lerp(incoming?0.3:0.4,1,settle);
  }
  sc.decor(tAnim,settle);
  ctx.restore();
}

function wipeDraw(tm){
  const a=Math.sin(Math.PI*tm);const cx=W*(tm*1.6-0.3);
  for(let k=0;k<6;k++){
    const ox=(hash(k*3.31)-0.5)*W*(0.2+0.8*tm);
    const oy=(hash(k*7.93)-0.5)*H*0.5;
    const rw=W*(0.16+0.28*hash(k*5.17)),rh=H*(0.22+0.5*hash(k*9.71));
    ctx.globalAlpha=a*(0.42-k*0.05);
    ctx.drawImage(blobCv,cx+ox-rw,oy-rh,rw*2,rh*2);
  }
  ctx.globalAlpha=1;
}

function drawAll(ai,bi,tm,sA,sB){
  ctx.fillStyle=css(P.paper,1);ctx.fillRect(0,0,W,H);
  decorDraw(ai,sA,tm,true);
  if(tm>0)decorDraw(bi,sB,tm,false);
  if(tm>0.02&&tm<0.98)wipeDraw(tm);
  const scA=SC[ai],scB=SC[bi];
  ctx.globalCompositeOperation=scA.mode||'source-over';
  const sMul=clamp(Math.min(W,H)/760,0.65,1.8)*(scA.sm||1);
  for(let b=0;b<4;b++){
    const pa=scA.pal[b],pb=scB.pal[b];
    const a=lerp(pa[1],pb[1],tm);
    if(a<0.02)continue;
    ctx.fillStyle=css(mix(P[pa[0]],P[pb[0]],tm),a);
    ctx.beginPath();
    const stA=(tm<0.5&&scA.streak)?scA.streak:0;
    const stB=(tm>=0.5&&scB.streak)?scB.streak:0;
    for(let i=0;i<PNUM;i++){
      if(BC[i]!==b)continue;
      const s=PS[i]*sMul;const x=PX[i],y=PY[i];
      const st=(tm<0.5?stA:stB);
      if(st)ctx.rect(x-0.7,y-st*0.5,s*0.9,st);
      else ctx.rect(x-s*0.5,y-s*0.5,s,s);
    }
    ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
  if(scA.feat&&sA>0.12){
    ctx.save();ctx.globalAlpha=clamp((sA-0.12)/0.88,0,1);
    const n=Math.min(scA.featN||0,PNUM);
    for(let i=0;i<n;i++)scA.feat(i,PX[i],PY[i],tAnim,sA);
    ctx.restore();
  }
  if(grainDirty){buildGrain();grainDirty=false;}
  if(grainPat){ctx.fillStyle=grainPat;ctx.fillRect(0,0,W,H);}
}

function drawStill(){
  fDisp=fTarget;
  const i0=clamp(Math.round(fDisp),0,23);
  updateParticles(i0,i0,0,1,1,true);
  drawAll(i0,i0,0,1,1);
}

function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-lastT)/1000;lastT=now;
  if(dt>0.1)dt=0.1;
  const t0=performance.now();
  stepPalette(dt);
  fTarget=clamp(scrollY/maxScroll(),0,1)*23;
  if(staticMode){
    if(pT>=1&&!dirty)return;
    fDisp=fTarget;dirty=false;
  }else{
    tAnim+=dt;
    fDisp+=(fTarget-fDisp)*clamp(dt*6.5,0,1);
    if(Math.abs(fTarget-fDisp)<0.0004)fDisp=fTarget;
  }
  const m=computeMorph();
  const idx=m.tm>0.5?m.bi:m.ai;
  if(idx!==activeIdx){activeIdx=idx;onScene(idx);}
  if(SC[m.ai].snow)pileGrow(dt,m.sA);
  stepStrip(dt);
  pvx*=Math.exp(-dt*3.2);pvy*=Math.exp(-dt*3.2);
  updateParticles(m.ai,m.bi,m.tm,m.sA,m.sB,staticMode);
  drawAll(m.ai,m.bi,m.tm,m.sA,m.sB);
  railThumb.style.top=(fDisp/23*100).toFixed(2)+'%';
  const cost=performance.now()-t0;
  if(cost>costMax)costMax=cost;
  if(!staticMode){
    fpsEma=lerp(fpsEma,1/Math.max(dt,0.001),0.06);
    if(fpsEma<45){
      lowFrames++;
      if(lowFrames>60&&quality>0.4){
        quality=quality>0.6?0.6:0.4;
        applyQuality();lowFrames=0;
        toast('检测到画面负载较高，已自动将粒子规模调至 '+PNUM+' 个以维持流畅');
      }
    }else lowFrames=0;
    if(costMax>12&&!costWarned){costWarned=true;console.info('[数字长卷] 主线程单帧峰值',costMax.toFixed(1)+'ms（目标 ≤ 8ms）');}
  }
}

/* ================================================================
   场景绘制原语（数字水墨笔法）
   ================================================================ */
function ridge(seed,yB,amp,col,al){
  ctx.beginPath();ctx.moveTo(-10,H+10);
  const n=26;
  for(let k=0;k<=n;k++){
    const u=k/n;
    const v=Math.sin(u*3.3+seed)*0.55+Math.sin(u*7.9+seed*2.7)*0.3+Math.sin(u*15.1+seed*1.3)*0.15+1;
    ctx.lineTo(u*W,yB-v*amp);
  }
  ctx.lineTo(W+10,H+10);ctx.closePath();
  ctx.fillStyle=css(col,al);ctx.fill();
}
function ground(gy){
  ctx.fillStyle=css(mix(P.paper,P.ink,themeName==='dark'?0.28:0.07),1);
  ctx.fillRect(0,gy,W,H-gy);
  ctx.fillStyle=css(P.ink,0.35);ctx.fillRect(0,gy,W,1.4);
}
function skyGrad(col,al1,al2){

 bcol:i=>i<26?3:(R3[i]<0.8?3:0),
 target(i,t,s,out){
   const gy=H*0.82;
   if(i<26){
     out.x=(0.05+hash(i*3.7)*0.9)*W;
     out.y=(0.05+hash(i*7.1)*0.45)*H;
   }else{
     const y=frac(R3[i]+t*0.05);
     out.x=frac(R1[i]+t*0.01+Math.sin(t*0.5+R2[i]*9)*0.015)*W;
     out.y=y*(gy-4);
   }
 },
 feat(i,x,y,t,s){
   if(i>=26)return;
   const g=Math.sin(t*1.5+i*2.3)*0.5+0.5;
   ctx.fillStyle=css(P.flake,0.2+0.6*g);
   ctx.fillRect(x-1,y-1,2,2);
 },
 decor(t,s){
   const gy=H*0.82;
   const g=ctx.createLinearGradient(0,0,0,gy);
   g.addColorStop(0,css(P.ind,0.3));g.addColorStop(1,css(P.ind,0.08));
   ctx.fillStyle=g;ctx.fillRect(0,0,W,gy);
   moonGlow(W*0.26,H*0.3,H*0.075);
   ground(gy);
   ctx.fillStyle=css(themeName==='dark'?P.flake:P.ink,themeName==='dark'?0.12:0.06);
   ctx.fillRect(0,gy,W,H-gy);
   const hx=W*0.72,hy=gy-H*0.045;
   ctx.fillStyle=css(P.ink,0.55);
   ctx.fillRect(hx,hy,W*0.05,H*0.045);
   ctx.beginPath();ctx.moveTo(hx-W*0.008,hy);ctx.lineTo(hx+W*0.025,hy-H*0.02);ctx.lineTo(hx+W*0.058,hy);ctx.closePath();ctx.fill();
   ctx.fillStyle=css(P.cin,0.5*(0.6+0.4*Math.sin(t*3.1)));
   ctx.fillRect(hx+W*0.02,hy+H*0.012,W*0.01,H*0.012);
 }},
/* 22 小寒：冰窗冰裂纹生长 */
{g:0.8,flow:0.7,
 pal:[['ink',0.2],['ind',0.55],['ind',0.2],['flake',0.8]],
 bcol:i=>R1[i]<0.55?1:3,
 target(i,t,s,out){
   const gy=H*0.8;
   const cell=Math.max(46,W*0.045);
   if(R1[i]<0.55){
     const gx=Math.floor(R2[i]*(W/cell+1));
     const gyy=Math.floor(R3[i]*(H*0.7/cell+1));
     const q=Math.floor(frac(R1[i]*1001)*4);
     const dx=[1,1,-1,-1][q],dy=[1,-1,1,-1][q];
     const nx0=gx*cell+cell/2,ny0=gyy*cell+cell/2;
     const reveal=clamp(s*1.8-((gx*3+gyy*5)%9)*0.1,0,1);
     const u=frac(R1[i]*7+R2[i]*13)*reveal;
     out.x=nx0+dx*u*cell*0.5;
     out.y=ny0+dy*u*cell*0.5;
   }else{
     const y=frac(R3[i]+t*(0.05+0.06*R2[i]));
     out.x=frac(R1[i]+t*0.012+Math.sin(t*0.5+R2[i]*9)*0.012)*W;
     out.y=y*(gy-4);
   }
 },
 decor(t,s){
   const gy=H*0.8;
   skyGrad(P.ind,0.22,0.06);
   ground(gy);
   branch(W*1.02,H*0.25,Math.PI*0.83,H*0.26,4,2.4);
   moonGlow(W*0.2,H*0.22,H*0.05);
 }},
/* 23 大寒：梅枝梅花 + 大雪覆地 */
{g:0.8,flow:0.8,snow:true,
 pal:[['ink',0.25],['ind',0.25],['cin',0.8],['flake',0.9]],
 bcol:i=>R1[i]<0.42?2:3,
 target(i,t,s,out){
   const gy=H*0.8;
   if(R1[i]<0.42){
     const B=plumNodes(),n=Math.floor(R2[i]*10),b=B[n];
     const k=Math.floor(R3[i]*5);
     const a=k*TAU/5+0.5+n*1.7;
     const rr=(4+8*frac(R3[i]*5))*(0.3+0.7*s);
     out.x=b.x+Math.cos(a+t*0.15)*rr;
     out.y=b.y+Math.sin(a+t*0.15)*rr*0.8;
   }else{
     const x=frac(R1[i]+t*0.02+Math.sin(t*0.7+R2[i]*9)*0.02);
     out.x=x*W;
     const y=frac(R3[i]+t*(0.16+0.12*R2[i]));
     const ph=pileH(x);
     out.y=y*(gy-ph-4);
     if(y>0.985)out.y=gy-ph-2;
   }
 },
 decor(t,s){
   const gy=H*0.8;
   skyGrad(P.ind,0.24,0.1);
   ground(gy);
   drawPile(gy);
   plumBranch();
 }}
];

/* ================================================================
   UI：展签 / 进度轨 / 横向节气带 / 键盘 / hash / 声音 / 主题
   ================================================================ */
const labelEl=document.getElementById('label');
const liveEl=document.getElementById('live');
const railEl=document.getElementById('rail');
const railTrack=document.getElementById('railTrack');
const railThumb=document.getElementById('railThumb');
const railNum=document.getElementById('railNum');
const stripEl=document.getElementById('strip');
const trackEl=document.getElementById('track');
const toastEl=document.getElementById('toast');
let chips=[],ticks=[];

function buildStrip(){
  T24.forEach((d,i)=>{
    const b=document.createElement('button');
    b.className='chip';
    b.setAttribute('aria-label',d.name+' '+d.py);
    b.innerHTML='<i>'+String(i+1).padStart(2,'0')+' · '+d.season+'</i><b>'+d.name+'</b>';
    b.addEventListener('click',()=>goIdx(i));
    trackEl.appendChild(b);
  });
  chips=[...trackEl.children];
}
function buildRail(){
  for(let i=0;i<24;i++){
    const s=document.createElement('span');
    s.className='rail-tick';
    s.style.top=(i/23*100)+'%';
    railTrack.appendChild(s);
  }
  ticks=[...railTrack.querySelectorAll('.rail-tick')];
}

/* --- 横向节气带：自实现惯性衰减 + 边缘回弹（无物理库） --- */
let sX=0,sV=0,sDrag=false,sLX=0,sLT=0,sDX=0,sAuto=null;
const minSx=()=>Math.min(0,trackEl.clientWidth-stripEl.clientWidth);
stripEl.addEventListener('pointerdown',e=>{
  sDrag=true;sAuto=null;sLX=e.clientX;sDX=e.clientX;sLT=performance.now();sV=0;
  stripEl.setPointerCapture(e.pointerId);
});
stripEl.addEventListener('pointermove',e=>{
  if(!sDrag)return;
  const now=performance.now();
  let nx=sX+(e.clientX-sLX);
  const lo=minSx();
  if(nx>0)nx*=0.35;
  if(nx<lo)nx=lo+(nx-lo)*0.35;
  const dtm=Math.max(8,now-sLT);
  sV=lerp(sV,(e.clientX-sLX)/dtm*1000,0.45);
  sX=nx;sLX=e.clientX;sLT=now;
});
stripEl.addEventListener('pointerup',e=>{
  if(!sDrag)return;
  sDrag=false;
  if(Math.abs(e.clientX-sDX)<6){
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const chip=el&&el.closest?el.closest('.chip'):null;
    if(chip)chip.click();
  }
});
stripEl.addEventListener('pointercancel',()=>{sDrag=false;});
function stepStrip(dt){
  if(sAuto!==null&&!sDrag){
    sX+=(sAuto-sX)*Math.min(1,dt*7);
    if(Math.abs(sAuto-sX)<0.5)sAuto=null;
  }
  if(!sDrag){
    sX+=sV*dt;
    sV*=Math.exp(-2.6*dt);
    const lo=minSx();
    if(sX>0){sX*=Math.pow(0.008,dt);sV*=Math.pow(0.008,dt);}
    else if(sX<lo){sX=lo+(sX-lo)*Math.pow(0.008,dt);sV*=Math.pow(0.008,dt);}
  }
  trackEl.style.transform='translate3d('+sX.toFixed(1)+'px,0,0)';
}

/* --- 进度轨：点击 / 拖拽定位 + 键盘 --- */
let rDrag=false;
const railSet=e=>{
  const r=railTrack.getBoundingClientRect();
  const f=clamp((e.clientY-r.top)/r.height,0,1);
  window.scrollTo(0,f*maxScroll());
};
railEl.addEventListener('pointerdown',e=>{rDrag=true;railEl.setPointerCapture(e.pointerId);railSet(e);});
railEl.addEventListener('pointermove',e=>{if(rDrag)railSet(e);});
railEl.addEventListener('pointerup',()=>{rDrag=false;});
railEl.addEventListener('keydown',e=>{
  const map={ArrowUp:-1,ArrowDown:1,PageUp:-1,PageDown:1};
  if(e.key in map){e.preventDefault();goIdx(activeIdx+map[e.key]);}
  else if(e.key==='Home'){e.preventDefault();goIdx(0);}
  else if(e.key==='End'){e.preventDefault();goIdx(23);}
});

/* --- 展签 / 海报渲染 --- */
const CN=['一','二','三'];
function renderLabel(idx){
  const d=T24[idx];
  labelEl.innerHTML=
    '<div class="lt-top a" style="--i:0"><div class="lt-idx">二十四节气 · 第 '+String(idx+1).padStart(2,'0')+' 气<span class="lt-season">'+d.season+'</span></div>'+
    '<div class="seal" aria-hidden="true">'+d.name+'</div></div>'+
    '<h2 class="lt-name a" id="ltName" style="--i:1">'+d.name.split('').map((c,j)=>'<span style="--i:'+(1+j)+'">'+c+'</span>').join('')+'</h2>'+
    '<div class="lt-py a" style="--i:3">'+d.py+'</div>'+
    '<div class="lt-date a" style="--i:4"><span>'+d.date+'</span><span>'+d.deg+'</span></div>'+
    '<div class="lt-hou a" style="--i:5">'+d.hou.map((h,j)=>'<div><span>第'+CN[j]+'候</span>'+h+'</div>').join('')+'</div>'+
    '<p class="lt-desc a" style="--i:6">'+d.desc+'</p>'+

}
function renderPoster(idx){
  const d=T24[idx];

  $('pName').textContent=d.name+' · '+d.py;
  $('pMeta').innerHTML=d.date+'<br>'+d.deg+'<br>第'+String(idx+1).padStart(2,'0')+'气 · '+d.season+'季';
  $('pDesc').textContent=d.desc;
  $('pPoem').innerHTML=d.poem+' <cite>—— '+d.src+'</cite>';
  $('pHou').textContent='三候 · '+d.hou.join(' / ');

/* --- 节气切换总入口 --- */
function onScene(idx){
  const d=T24[idx];
  renderLabel(idx);
  renderPoster(idx);
  try{history.replaceState(null,'','#'+d.id);}catch(_){/* 文件协议下某些浏览器忽略 */}
  railEl.setAttribute('aria-valuenow',String(Math.round(idx/23*100)));
  railNum.textContent=String(idx+1).padStart(2,'0');
  ticks.forEach((tk,j)=>tk.classList.toggle('on',j===idx));
  chips.forEach((c,j)=>{if(j===idx)c.setAttribute('aria-current','true');else c.removeAttribute('aria-current');});
  if(!sDrag){
    const c=chips[idx];
    if(c)sAuto=clamp(c.offsetLeft-stripEl.clientWidth*0.3,minSx(),0);
  }
  liveEl.textContent=(idx+1)+' / 24 · '+d.name+' '+d.py+'，'+d.date;
  if(SC[idx].snow)PILE.fill(0);
  pluckNote(idx);
  markDirty();
}

/* --- 键盘 ←→ 与 hash 定位 --- */
function goIdx(i){
  i=clamp(Math.round(i),0,23);
  window.scrollTo({top:i/23*maxScroll(),behavior:staticMode?'auto':'smooth'});
}
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){e.preventDefault();goIdx(activeIdx+1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();goIdx(activeIdx-1);}
});
function fromHash(){
  const id=location.hash.slice(1);
  const i=T24.findIndex(d=>d.id===id);
  if(i<0)return;
  window.scrollTo(0,i/23*maxScroll());
  fDisp=i;
}
addEventListener('hashchange',fromHash);

/* --- 声音：WebAudio 自生成（风声底噪 + 五声拨弦 + 雷声） --- */
let AC=null,master=null,dly=null,audioOn=false;
function ensureAudio(){
  if(AC)return;
  const Ctx=window.AudioContext||window.webkitAudioContext;
  if(!Ctx)return;
  AC=new Ctx();
  master=AC.createGain();master.gain.value=0;master.connect(AC.destination);
  dly=AC.createDelay(1);dly.delayTime.value=0.31;
  const fb=AC.createGain();fb.gain.value=0.32;
  const wet=AC.createGain();wet.gain.value=0.22;
  dly.connect(fb);fb.connect(dly);dly.connect(wet);wet.connect(master);
  const len=AC.sampleRate*2;
  const buf=AC.createBuffer(1,len,AC.sampleRate);
  const dd=buf.getChannelData(0);
  for(let i=0;i<len;i++)dd[i]=Math.random()*2-1;
  const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=320;lp.Q.value=0.6;
  const wg=AC.createGain();wg.gain.value=0.06;
  const lfo=AC.createOscillator();lfo.frequency.value=0.07;
  const lg=AC.createGain();lg.gain.value=140;
  lfo.connect(lg);lg.connect(lp.frequency);
  src.connect(lp);lp.connect(wg);wg.connect(master);
  src.start();lfo.start();
}
const PENT=[0,2,4,7,9];
function note(f,vol,when){
  const t=AC.currentTime+(when||0);
  const o=AC.createOscillator();o.type='sine';o.frequency.value=f;
  const g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+1.7);
  o.connect(g);g.connect(master);g.connect(dly);
  o.start(t);o.stop(t+1.8);
}
function pluckNote(i){
  if(!AC||!audioOn)return;
  const f=196*Math.pow(2,(PENT[i%5]+12*(Math.floor(i/5)%2))/12);
  note(f,0.5);note(f*1.498,0.16,0.12);
}
function thunder(){
  if(!AC||!audioOn)return;
  const len=(AC.sampleRate*1.4)|0;
  const buf=AC.createBuffer(1,len,AC.sampleRate);
  const dd=buf.getChannelData(0);
  for(let i=0;i<len;i++)dd[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.6);
  const src=AC.createBufferSource();src.buffer=buf;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=110;
  const g=AC.createGain();
  g.gain.setValueAtTime(0.5,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+1.4);
  src.connect(lp);lp.connect(g);g.connect(master);src.start();
}

/* --- 提示条 --- */
let toastTmr=0;
function toast(msg){
  toastEl.textContent=msg;
  toastEl.classList.add('on');
  clearTimeout(toastTmr);
  toastTmr=setTimeout(()=>toastEl.classList.remove('on'),3600);
}

const btnSound=document.getElementById('btnSound');

const ICON_MOON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"/></svg>';
const ICON_SUN='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.5 4.5l2 2M17.5 17.5l2 2M19.5 4.5l-2 2M6.5 17.5l-2 2"/></svg>';
function applyThemeIcon(){
  btnTheme.innerHTML=themeName==='dark'?ICON_SUN:ICON_MOON;
  btnTheme.setAttribute('aria-pressed',String(themeName==='dark'));
  btnTheme.setAttribute('aria-label',themeName==='dark'?'切换到浅色主题':'切换到深色主题');
}
btnTheme.addEventListener('click',()=>{
  userTheme=themeName==='dark'?'light':'dark';
  themeTo(userTheme);
  document.documentElement.setAttribute('data-theme',themeName);
  applyThemeIcon();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',e=>{
  if(userTheme)return;
  themeTo(e.matches?'dark':'light');
  document.documentElement.setAttribute('data-theme',themeName);
  applyThemeIcon();
});
btnSound.innerHTML=ICON_SOUND;
btnSound.addEventListener('click',()=>{
  ensureAudio();
  if(!AC)return;
  if(AC.state==='suspended')AC.resume();
  audioOn=!audioOn;
  master.gain.setTargetAtTime(audioOn?0.5:0,AC.currentTime,0.3);
  btnSound.setAttribute('aria-pressed',String(audioOn));
  btnSound.setAttribute('aria-label',audioOn?'关闭环境音':'开启环境音');
  if(audioOn)pluckNote(activeIdx<0?0:activeIdx);
});

/* --- 打印海报 --- */
addEventListener('beforeprint',()=>{
  tAnim=4.6;
  fTarget=Math.round(fTarget);
  fDisp=fTarget;
  renderPoster(clamp(activeIdx,0,23));
  drawStill();
});

/* --- 启动 --- */
function init(){
  buildStrip();
  buildRail();
  buildBlob();
  document.documentElement.setAttribute('data-theme',themeName);
  applyThemeIcon();
  resize();
  fromHash();
  const idx0=clamp(Math.round(fDisp),0,23);
  const o={x:0,y:0};
  const sc=SC[idx0];
  for(let i=0;i<PMAX;i++){sc.target(i,tAnim,1,o);PX[i]=o.x;PY[i]=o.y;}
  requestAnimationFrame(frame);
}
init();
</script>
