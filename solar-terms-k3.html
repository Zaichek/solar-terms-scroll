<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时间的形状 · 二十四节气数字长卷</title>
<!--
  ============================================================
  时间的形状 · 二十四节气数字长卷 —— 单页交互式数字博物馆
  零外部依赖：全部视觉由 Canvas/SVG/CSS 程序化生成
  模块结构：
    [样式] CSS 变量双主题 / 8pt 网格 / 展签排版 / 打印海报
    [数据] DATA —— 24 节气真实文案（物候三候 / 描述 / 古诗）
    [引擎] ParticleField —— 2000+ 粒子的统一粒子场与形变过渡
    [场景] SCENES —— 24 个彼此不同的生成式场景
    [声音] AudioEngine —— Web Audio 实时合成环境音景
    [交互] 滚动叙事 / 拖拽横滑 / 键盘 / URL hash / 性能守护
  ============================================================
-->
<style>
/* ==================== 一、主题变量（明暗双色，过渡平滑） ==================== */
:root{
  /* 色板：宣纸白 / 墨黑 / 朱砂红 / 黛蓝 及其衍生色阶 */
  --paper:      #F5F1E8;
  --paper-88:   rgba(245,241,232,.88);
  --paper-64:   rgba(245,241,232,.64);
  --ink:        #1A1A1A;
  --ink-72:     rgba(26,26,26,.72);
  --ink-48:     rgba(26,26,26,.48);
  --ink-24:     rgba(26,26,26,.24);
  --ink-12:     rgba(26,26,26,.12);
  --cinnabar:   #C0392B;
  --cinnabar-72:rgba(192,57,43,.72);
  --dai:        #2C3E50;
  --dai-56:     rgba(44,62,80,.56);
  --dai-24:     rgba(44,62,80,.24);
  --wash:       rgba(44,62,80,.05);   /* 展签底色淡黛蓝晕染 */
  --serif: "Songti SC","STSong","SimSun","Noto Serif CJK SC","Source Han Serif SC",serif;
  --sans:  "PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
}
[data-theme="dark"]{
  --paper:      #181D24;              /* 黛蓝 × 墨黑的深衍生色 */
  --paper-88:   rgba(24,29,36,.88);
  --paper-64:   rgba(24,29,36,.64);
  --ink:        #EDE7D8;              /* 宣纸白的暗色反转 */
  --ink-72:     rgba(237,231,216,.72);
  --ink-48:     rgba(237,231,216,.48);
  --ink-24:     rgba(237,231,216,.24);
  --ink-12:     rgba(237,231,216,.12);
  --cinnabar:   #D6513F;
  --cinnabar-72:rgba(214,81,63,.72);
  --dai:        #7A8FA6;              /* 黛蓝的浅衍生阶 */
  --dai-56:     rgba(122,143,166,.56);
  --dai-24:     rgba(122,143,166,.24);
  --wash:       rgba(122,143,166,.06);
}
/* 主题切换时所有颜色平滑过渡 */
*,*::before,*::after{
  transition: background-color .5s ease, border-color .5s ease, color .5s ease, fill .5s ease, stroke .5s ease;
}

/* ==================== 二、基础排版（8pt 网格：0.5rem = 8px） ==================== */
html{ scroll-behavior:smooth; scrollbar-width:none; }
html::-webkit-scrollbar{ display:none; }
html.rm{ scroll-behavior:auto; }      /* prefers-reduced-motion 时关闭平滑滚动 */
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.75;
  overflow-x:hidden;
  /* 隐藏原生滚动条，由自定义进度指示替代 */
  scrollbar-width:none; -ms-overflow-style:none;
}
body::-webkit-scrollbar{ display:none; }
:focus-visible{ outline:2px solid var(--cinnabar); outline-offset:3px; border-radius:2px; }

/* ==================== 三、全屏粒子画布 ==================== */
#field{
  position:fixed; inset:0; z-index:0; display:block;
  width:100vw; height:100vh;
}

/* ==================== 四、卷首与卷尾 ==================== */
.prologue,.epilogue{
  position:relative; z-index:1; min-height:100vh;
  display:flex; flex-direction:column; justify-content:center; align-items:center;
  text-align:center; padding:3rem 1.5rem; pointer-events:none;
}
.prologue h1{
  font-family:var(--serif); font-weight:700;
  font-size:clamp(2.5rem,7vw,5.5rem); letter-spacing:.18em; margin:0 0 1.5rem;
}
.prologue .sub{
  font-family:var(--serif); font-size:clamp(.9rem,1.6vw,1.15rem);
  letter-spacing:.5em; color:var(--ink-48); margin:0 0 3rem; text-indent:.5em;
}
.prologue .hint{
  font-size:.78rem; letter-spacing:.3em; color:var(--ink-48);
  border:1px solid var(--ink-24); padding:.5rem 1.5rem; border-radius:999px;
}
.epilogue p{ font-family:var(--serif); letter-spacing:.35em; color:var(--ink-48); }

/* ==================== 五、节气展签（博物馆展签排版） ==================== */
main{ position:relative; z-index:1; pointer-events:none; }
.term{
  min-height:110vh; display:flex; align-items:center;
  padding:6rem clamp(1.5rem,6vw,8rem); box-sizing:border-box;
}
.term:nth-child(odd){ justify-content:flex-start; }
.term:nth-child(even){ justify-content:flex-end; }
.label-card{
  pointer-events:auto; background:var(--paper-88); backdrop-filter:blur(2px);
  border:1px solid var(--ink-24); padding:3rem; max-width:34rem; width:min(34rem,100%);
  box-shadow:0 1rem 3rem var(--ink-12); position:relative; box-sizing:border-box;
}
.label-card::before{                      /* 展签顶部朱砂细线 */
  content:""; position:absolute; top:0; left:3rem; right:3rem; height:2px;
  background:var(--cinnabar);
}
.label-card .no{
  font-size:.72rem; letter-spacing:.4em; color:var(--cinnabar); margin-bottom:1rem;
}
.label-card h2{
  font-family:var(--serif); font-size:clamp(2.2rem,5vw,3.2rem);
  margin:0; letter-spacing:.22em; line-height:1.2;
}
.label-card .pinyin{
  font-family:var(--serif); font-style:italic; color:var(--ink-48);
  letter-spacing:.28em; font-size:.95rem; margin:.5rem 0 1.5rem;
}
.label-card .date{
  display:inline-block; font-size:.75rem; letter-spacing:.2em;
  border:1px solid var(--dai-24); color:var(--dai);
  padding:.25rem 1rem; margin-bottom:1.5rem;
}
.hou{ display:flex; gap:1rem; margin:0 0 1.5rem; padding:1rem 0; border-top:1px solid var(--ink-12); border-bottom:1px solid var(--ink-12); }
.hou div{ flex:1; }
.hou .hou-t{ font-size:.68rem; letter-spacing:.24em; color:var(--ink-48); display:block; margin-bottom:.25rem; }
.hou .hou-v{ font-family:var(--serif); font-size:.92rem; letter-spacing:.08em; }
.desc{ font-size:.92rem; color:var(--ink-72); margin:0 0 1.5rem; text-align:justify; }
.poem{
  font-family:var(--serif); font-size:1rem; letter-spacing:.12em;
  color:var(--dai); margin:0; padding-left:1rem; border-left:2px solid var(--cinnabar);
}
.poem cite{ display:block; font-style:normal; font-size:.72rem; color:var(--ink-48); margin-top:.5rem; letter-spacing:.2em; }

/* ==================== 六、固定 UI：题签 / 按钮 / 进度轨 / 横滑条 ==================== */
.masthead{
  position:fixed; top:1.5rem; left:1.5rem; z-index:10; pointer-events:none;
}
.masthead .brand{ font-family:var(--serif); font-size:1rem; letter-spacing:.4em; color:var(--ink-72); }
.masthead .now{ font-family:var(--serif); font-size:.78rem; letter-spacing:.3em; color:var(--cinnabar); margin-top:.25rem; min-height:1.2em; }

.toolbar{ position:fixed; top:1.5rem; right:1.5rem; z-index:10; display:flex; gap:.75rem; }
.tool-btn{
  width:2.5rem; height:2.5rem; border-radius:50%; cursor:pointer;
  border:1px solid var(--ink-24); background:var(--paper-88); color:var(--ink);
  display:flex; align-items:center; justify-content:center; padding:0;
}
.tool-btn:hover{ border-color:var(--cinnabar); color:var(--cinnabar); }
.tool-btn svg{ width:1.1rem; height:1.1rem; display:block; }
.tool-btn .icon-off{ display:none; }
.tool-btn[aria-pressed="true"] .icon-on{ display:none; }
.tool-btn[aria-pressed="true"] .icon-off{ display:block; }

/* 自定义纵向滚动进度轨（替代原生滚动条） */
.rail{
  position:fixed; right:1.5rem; top:50%; transform:translateY(-50%); z-index:10;
  display:flex; flex-direction:column; align-items:center; gap:0;
  padding:.5rem 0;
}
.rail-track{ position:relative; width:2px; height:44vh; background:var(--ink-12); }
.rail-fill{ position:absolute; top:0; left:0; width:100%; height:0%; background:var(--cinnabar); }
.rail-dots{ position:absolute; inset:0; display:flex; flex-direction:column; justify-content:space-between; align-items:center; }
.rail-dot{
  width:8px; height:8px; border-radius:50%; border:1px solid var(--ink-24);
  background:var(--paper); cursor:pointer; padding:0; transform:translateX(.5px);
}
.rail-dot[aria-current="true"]{ background:var(--cinnabar); border-color:var(--cinnabar); transform:scale(1.5) translateX(.5px); }
.rail-label{
  writing-mode:vertical-rl; font-size:.68rem; letter-spacing:.4em;
  color:var(--ink-48); margin-top:1rem; font-family:var(--serif);
}

/* 底部节气横滑条（自实现拖拽 + 惯性 + 回弹） */
.strip{
  position:fixed; left:0; right:0; bottom:0; z-index:10;
  padding:.75rem 0 1rem; background:linear-gradient(to top, var(--paper-88), transparent);
  overflow:hidden; cursor:grab; user-select:none; -webkit-user-select:none;
  touch-action:pan-y;
}
.strip.dragging{ cursor:grabbing; }
.strip-track{ display:flex; gap:.5rem; padding:0 50vw; width:max-content; will-change:transform; }
.chip{
  flex:none; border:1px solid var(--ink-24); background:var(--paper-88);
  font-family:var(--serif); font-size:.8rem; letter-spacing:.15em;
  padding:.5rem 1rem; cursor:pointer; color:var(--ink-72); white-space:nowrap;
}
.chip small{ display:block; font-size:.6rem; color:var(--ink-48); letter-spacing:.25em; }
.chip[aria-current="true"]{ border-color:var(--cinnabar); color:var(--cinnabar); }

/* 性能提示浮层 */
.toast{
  position:fixed; left:50%; bottom:5.5rem; transform:translateX(-50%); z-index:20;
  background:var(--ink); color:var(--paper); font-size:.75rem; letter-spacing:.15em;
  padding:.5rem 1.5rem; border-radius:999px; opacity:0; pointer-events:none;
  transition:opacity .4s ease;
}
.toast.show{ opacity:.92; }

/* ==================== 七、响应式（320px ~ 2560px） ==================== */
@media (max-width:640px){
  .term{ padding:5rem 1rem; justify-content:center !important; }
  .label-card{ padding:1.5rem; }
  .masthead .brand{ font-size:.8rem; }
  .rail{ right:.5rem; }
  .rail-track{ height:32vh; }
  .hou{ gap:.5rem; }
}
@media (min-width:1920px){
  body{ font-size:18px; }
  .label-card{ max-width:38rem; }
}
/* ==================== 八、减弱动效 ==================== */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ transition:none !important; animation:none !important; }
}
/* ==================== 九、打印样式：长卷输出为一张海报 ==================== */
@media print{
  #field,.toolbar,.rail,.strip,.toast,.masthead .now,.prologue .hint{ display:none !important; }
  body{ background:#fff; color:#000; }
  .prologue,.epilogue{ min-height:auto; padding:2rem 0; }
  .prologue h1{ font-size:2.4rem; }
  main{ display:grid; grid-template-columns:repeat(4,1fr); gap:8pt; padding:0 8pt; }
  .term{ min-height:auto; padding:0; display:block; page-break-inside:avoid; }
  .label-card{ box-shadow:none; backdrop-filter:none; max-width:none; padding:12pt; background:#fff; }
  .label-card h2{ font-size:16pt; }
  .desc,.poem{ font-size:8.5pt; }
}
</style>
</head>
<body>
<!-- 全屏粒子场（装饰性视觉，对辅助技术隐藏） -->
<canvas id="field" aria-hidden="true"></canvas>

<!-- 卷首 -->
<header class="prologue" id="top">
  <h1>时间的形状</h1>
  <p class="sub">二十四节气数字长卷</p>
  <p class="hint">向下滚动 · 或拖动底部节气签 · ← → 键切换</p>
</header>

<!-- 长卷主体：24 个节气展签由 JS 依 DATA 生成 -->
<main id="scroll" aria-label="二十四节气长卷"></main>

<!-- 卷尾 -->
<footer class="epilogue">
  <p>寒来暑往 · 秋收冬藏 · 卷终而时无穷</p>
</footer>

<!-- 固定题签 -->
<div class="masthead" aria-hidden="true">
  <div class="brand">时间的形状</div>
  <div class="now" id="nowLabel"></div>
</div>

<!-- 工具栏：声音开关 / 主题切换（图标均为手绘 SVG） -->
<div class="toolbar">
  <button class="tool-btn" id="soundBtn" aria-pressed="false" aria-label="环境音景开关，默认静音">
    <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

    </svg>
    <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9v6h4l5 4V5L8 9H4z"/><line x1="17" y1="9" x2="22" y2="14"/><line x1="22" y1="9" x2="17" y2="14"/>
    </svg>
  </button>
  <button class="tool-btn" id="themeBtn" aria-pressed="false" aria-label="明暗主题切换">

      <circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/>
    </svg>
    <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/>
    </svg>
  </button>
</div>

<!-- 自定义滚动进度轨 -->
<nav class="rail" aria-label="长卷进度">
  <div class="rail-track"><div class="rail-fill" id="railFill"></div><div class="rail-dots" id="railDots"></div></div>
  <div class="rail-label" id="railLabel">立春</div>
</nav>

<!-- 底部横滑节气签 -->
<div class="strip" id="strip" role="listbox" aria-label="拖动浏览二十四节气">
  <div class="strip-track" id="stripTrack"></div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
/* ============================================================
   [数据] DATA —— 二十四节气：名称 / 拼音 / 日期 / 三候 / 描述 / 古诗
   描述均为原创文案（≥40 字），古诗注明出处
   ============================================================ */
const DATA = [
{ slug:"lichun", name:"立春", pinyin:"Lì Chūn", date:"2月3日 — 2月5日",
  hou:["东风解冻","蛰虫始振","鱼陟负冰"],
  desc:"冬的硬壳从东面最先松动。风一改往日的刀锋，贴着冻土吹出细小的裂响；蛰伏的虫豸在黑暗里翻了个身，鱼儿顶着尚未融尽的碎冰上浮——春天不是抵达，而是万物在内部先动了一下。",
  poem:"等闲识得东风面，万紫千红总是春。", cite:"宋 · 朱熹《春日》",
  tone:{ root:196.0, filter:900, noise:0.10, pluckEvery:5.5, wave:"sine" } },
{ slug:"yushui", name:"雨水", pinyin:"Yǔ Shuǐ", date:"2月18日 — 2月20日",
  hou:["獭祭鱼","鸿雁来","草木萌动"],
  desc:"雪开始学着变成雨。水獭把捕到的鱼摆上岸边，像一场小小的祭祀；北归的雁阵掠过云层，雨丝落进干了一冬的泥土，渗得很慢，仿佛大地在学习如何重新喝水。",
  poem:"好雨知时节，当春乃发生。", cite:"唐 · 杜甫《春夜喜雨》",
  tone:{ root:220.0, filter:1400, noise:0.22, pluckEvery:4.5, wave:"sine" } },
{ slug:"jingzhe", name:"惊蛰", pinyin:"Jīng Zhé", date:"3月5日 — 3月7日",
  hou:["桃始华","仓庚鸣","鹰化为鸠"],
  desc:"第一声雷不是从天上来的，是从土里滚过去的。沉睡的虫群被同一声闷响同时惊醒，四散奔逃；桃花趁人不备先开了，黄鹂试了两声嗓子，天空把猛禽的剪影换成了温和的鸠。",
  poem:"微雨众卉新，一雷惊蛰始。", cite:"唐 · 韦应物《观田家》",
  tone:{ root:246.9, filter:700, noise:0.08, pluckEvery:3.2, wave:"triangle" } },
{ slug:"chunfen", name:"春分", pinyin:"Chūn Fēn", date:"3月20日 — 3月22日",
  hou:["玄鸟至","雷乃发声","始电"],
  desc:"这一天，白昼与黑夜在天平两端坐得一样平。燕子准时回到旧梁，雷声开始有了正式的席位，闪电第一次被写进物候的册页——天地用最精确的中点，宣布春天过半。",
  poem:"日月阳阴两均天，玄鸟不辞桃花寒。", cite:"唐 · 刘长卿《春分》",
  tone:{ root:196.0, filter:1100, noise:0.10, pluckEvery:5.0, wave:"sine" } },
{ slug:"qingming", name:"清明", pinyin:"Qīng Míng", date:"4月4日 — 4月6日",
  hou:["桐始华","田鼠化为鴽","虹始见"],
  desc:"雨下得极细，细到可以穿过人的心事。泡桐花举起了淡紫的钟，田鼠躲回洞里而鹌鹑走向田野，雨住之后，天边挂出一道浅浅的虹——这一日，人们踏青，也低头。",
  poem:"清明时节雨纷纷，路上行人欲断魂。", cite:"唐 · 杜牧《清明》",

{ slug:"guyu", name:"谷雨", pinyin:"Gǔ Yǔ", date:"4月19日 — 4月21日",
  hou:["萍始生","鸣鸠拂其羽","戴胜降于桑"],
  desc:"春天的最后一场雨专为谷物而下。浮萍在水面铺开第一层绿，布谷鸟一遍遍地擦亮羽毛，戴胜鸟落在桑树最高的枝头；茶山上下，人们赶在雨前把嫩芽摘进竹篓。",
  poem:"春山谷雨前，并手摘芳烟。", cite:"唐 · 齐己《谢中上人寄茶》",

{ slug:"lixia", name:"立夏", pinyin:"Lì Xià", date:"5月5日 — 5月7日",
  hou:["蝼蝈鸣","蚯蚓出","王瓜生"],
  desc:"蝼蝈在夜里试出第一声长鸣，夏天就这样被叫醒了。蚯蚓把松软的土翻出新意，王瓜的藤蔓沿着架子一天一个样；树荫从此有了重量，阳光落在地上开始发烫。",
  poem:"绿树阴浓夏日长，楼台倒影入池塘。", cite:"唐 · 高骈《山亭夏日》",
  tone:{ root:293.7, filter:1000, noise:0.12, pluckEvery:4.5, wave:"triangle" } },
{ slug:"xiaoman", name:"小满", pinyin:"Xiǎo Mǎn", date:"5月20日 — 5月22日",
  hou:["苦菜秀","靡草死","麦秋至"],

/* ============================================================
   [引擎] 画布、devicePixelRatio 适配、运行时调色板
   ============================================================ */
const canvas = document.getElementById("field");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;
const PAL = {};                                   // 从 CSS 变量读取的画布用色
function refreshPalette() {
  const cs = getComputedStyle(document.documentElement);
  ["--ink","--ink-72","--ink-48","--ink-24","--cinnabar","--cinnabar-72","--dai","--dai-56","--dai-24","--paper"]
    .forEach(k => { PAL[k.slice(2)] = cs.getPropertyValue(k).trim(); });
}
function sizeCanvas() {
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);  // 高倍屏适配，上限 2 以保性能
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

/* 轻量伪随机与噪声（无需第三方库） */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
function nz(a, b, t){                              // 便宜的正弦混合"噪声"
  return Math.sin(a*1.71 + t)*0.6 + Math.sin(b*2.33 - t*0.7)*0.3 + Math.sin((a+b)*0.93 + t*0.5)*0.35;
}

/* ============================================================
   [引擎] ParticleField —— 统一粒子池（typed arrays，零逐帧分配）
   ============================================================ */
const MAXP = 2200;                                 // 粒子规模上限（≥2000）
const F = {
  x:new Float32Array(MAXP), y:new Float32Array(MAXP),
  vx:new Float32Array(MAXP), vy:new Float32Array(MAXP),
  hx:new Float32Array(MAXP), hy:new Float32Array(MAXP),   // 形变目标（home）
  sz:new Float32Array(MAXP), sd:new Float32Array(MAXP),   // 尺寸 / 随机种子
  A:new Float32Array(MAXP), B:new Float32Array(MAXP),     // 场景自定义参数
  col:new Uint8Array(MAXP), shp:new Uint8Array(MAXP),     // 颜色索引 / 形状
};
let alive = MAXP;                                  // 性能守护可下调
const LEVELS = [2200, 1600, 1100, 800]; let levelIdx = 0;

/* 指针流场扰动状态 */
const ptr = { x:-9999, y:-9999, vx:0, vy:0, on:false };
window.addEventListener("pointermove", e => {
  const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y;
  ptr.vx = ptr.vx*0.6 + dx*0.4; ptr.vy = ptr.vy*0.6 + dy*0.4;
  ptr.x = e.clientX; ptr.y = e.clientY; ptr.on = true;
}, { passive:true });
window.addEventListener("pointerleave", () => { ptr.on = false; });

/* ============================================================
   [引擎] 场景管理 + 形变过渡（morph）
   切换时粒子从旧形态弹簧迁移到新形态，附加衰减的湍流，
   绝不使用整体淡入淡出。
   ============================================================ */
let cur = -1, scene = null, S = {};                // S = 当前场景的私有状态
let morphT = 1, MORPH_DUR = 1.5;
let simT = 0;                                      // 场景内累计时间

function setScene(idx) {
  if (idx === cur) return;
  const hadPrev = cur >= 0;
  let px = null, py = null;
  if (hadPrev){ px = F.x.slice(); py = F.y.slice(); }    // 记住旧形态位置
  if (scene && scene.exit) scene.exit(S);                // 回收旧场景离屏资源
  cur = idx; scene = SCENES[idx]; S = {};
  if (scene.enter) scene.enter(S, W, H);
  scene.setup(F, W, H, S);
  scene._has34 = false;                                  // 是否含叶片/萤火类逐粒绘制
  for (let i = 0; i < alive; i++) if (F.shp[i] >= 3){ scene._has34 = true; break; }
  if (hadPrev){ F.x.set(px); F.y.set(py); }              // 粒子从旧形态出发 → 形变过渡
  morphT = 0; simT = 0;
  AudioEngine.setTerm(idx);
  UI.sync(idx);
  if (RM.matches) staticRender();                        // 减弱动效下直接渲染静态构图
}

/* 单帧粒子更新：弹簧归位 + 场景行为 + 指针扰动 + 过渡湍流 */
function updateParticles(dt) {
  const st = scene.stiff || 0.02, dp = scene.damp || 0.9;
  const turb = (1 - morphT) * (scene.morphAmp || 60);   // morph 期间的湍流强度
  const R = scene.pointerR || 120, F0 = scene.pointerF || 5;
  const swirl = scene.swirl || 0, R2 = R*R;
  const sty = scene.springY === 0 ? 0 : st;              // 落体式场景关闭纵向弹簧
  for (let i = 0; i < alive; i++) {
    F.vx[i] += (F.hx[i]-F.x[i]) * st;
    F.vy[i] += (F.hy[i]-F.y[i]) * sty;
    if (scene.act) scene.act(F, i, dt, simT, W, H, S);
    if (turb > 0.01) {                               // 形变过渡中的流场扰动
      F.vx[i] += nz(F.sd[i]*9.1, F.y[i]*0.004, simT*2) * turb * dt;
      F.vy[i] += nz(F.x[i]*0.004, F.sd[i]*7.3, simT*2+5) * turb * dt;
    }
    if (ptr.on) {                                    // 指针扰动流场
      const dx = F.x[i]-ptr.x, dy = F.y[i]-ptr.y, d2 = dx*dx+dy*dy;
      if (d2 < R2 && d2 > 0.01) {
        const d = Math.sqrt(d2), f = F0 * (1 - d/R);
        F.vx[i] += dx/d*f + ptr.vx*0.12*(1-d/R);
        F.vy[i] += dy/d*f + ptr.vy*0.12*(1-d/R);
        if (swirl) { F.vx[i] += -dy/d*f*swirl; F.vy[i] += dx/d*f*swirl; }
      }
    }
    F.vx[i] *= dp; F.vy[i] *= dp;
    F.x[i] += F.vx[i] * dt * 60; F.y[i] += F.vy[i] * dt * 60;
  }
}

/* 主题切换后重解析所有场景用色（pal 存 CSS 变量键名，palR 为解析结果） */
function resolvePalettes(){ SCENES.forEach(s => { s.palR = s.pal.map(k => PAL[k]); }); }

/* 单帧绘制：按颜色分组批量提交，减少 fillStyle 切换 */
function renderParticles() {
  ctx.clearRect(0, 0, W, H);
  if (scene.extra) scene.extra(ctx, simT, W, H, PAL, S, 1);
  const palList = scene.palR;
  for (let c = 0; c < palList.length; c++) {
    ctx.fillStyle = palList[c]; ctx.strokeStyle = palList[c];
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < alive; i++) {
      if (F.col[i] !== c) continue;
      const s = F.sz[i], sh = F.shp[i];
      if (sh === 0) ctx.rect(F.x[i]-s/2, F.y[i]-s/2, s, s);            // 墨点
      else if (sh === 1) { ctx.moveTo(F.x[i], F.y[i]);                 // 雨丝/流痕
        ctx.lineTo(F.x[i]-F.vx[i]*2.2, F.y[i]-F.vy[i]*2.2); }
      else if (sh === 2) { const r = s;                                // 六角雪片
        for (let k = 0; k < 6; k++) { const a = k*Math.PI/3 + F.sd[i];
          const px = F.x[i]+Math.cos(a)*r, py = F.y[i]+Math.sin(a)*r;
          k ? ctx.lineTo(px,py) : ctx.moveTo(px,py); }
        ctx.closePath(); }
    }
    ctx.fill(); ctx.stroke();
    /* 需要独立透明度的形状（叶片 / 萤火）逐粒绘制（无此类粒子则跳过） */
    if (!scene._has34) continue;
    for (let i = 0; i < alive; i++) {
      if (F.col[i] !== c) continue;
      const s = F.sz[i];
      if (F.shp[i] === 3) { ctx.save(); ctx.translate(F.x[i], F.y[i]);
        ctx.rotate(F.sd[i]*6 + simT*F.B[i]);
        ctx.globalAlpha = 0.85; ctx.beginPath();
        ctx.ellipse(0, 0, s*1.7, s*0.72, 0, 0, Math.PI*2); ctx.fill();
        ctx.restore(); ctx.globalAlpha = 1; }

    const ground=H-S.depth[col]-F.sz[i];

      S.ag.fillStyle=PAL["ink-48"];                      // 积雪色随主题
      S.ag.beginPath(); S.ag.arc(F.x[i],F.y[i]-(H-S.acc.height),F.sz[i]*0.9,0,Math.PI*2); S.ag.fill();
      S.depth[col]+=0.55;                                    // 雪深增加
      for(let k=-2;k<=2;k++){ const c2=col+k;                // 向两侧滑落摊平
        if(c2>=0&&c2<S.depth.length&&k!==0&&S.depth[c2]<S.depth[col]-4)
          { S.depth[c2]+=0.9; S.depth[col]-=0.35; } }
      F.y[i]=-14; F.x[i]=Math.random()*W; F.vy[i]=0.5; } },
  extra(c,t,W,H,P,S){
    c.drawImage(S.acc,0,H-S.acc.height);                     // 积雪
    c.strokeStyle=P["ink-24"]; c.lineWidth=1; c.beginPath(); // 雪原轮廓
    for(let x=0;x<=W;x+=8){ const y=H-S.depth[Math.floor(x/8)];
      x?c.lineTo(x,y):c.moveTo(x,y); }
    c.stroke(); } },

/* —— 21 冬至 · 一阳生：至暗的黛蓝里，光尘绕低日回旋 —— */
{ pal:["cinnabar-72","ink-48","dai-56"],
  stiff:0.07, damp:0.88, pointerR:160, pointerF:7, swirl:1.4, morphAmp:90,
  setup(F,W,H,S){ for(let i=0;i<MAXP;i++){ F.sd[i]=Math.random();
      F.x[i]=Math.random()*W; F.y[i]=Math.random()*H;
      F.sz[i]=1.1+F.sd[i]*1.5; F.col[i]=i%11===0?0:(i%2+1); F.shp[i]=0;
      F.B[i]=0.06+F.sd[i]*0.12; } },
  act(F,i,dt,t,W,H,S){
    const cx=W*0.5, cy=H*0.6;
    const r=26+Math.pow(F.sd[i],0.7)*Math.min(W,H)*0.4;      // 内密外疏的螺旋
    const a=F.sd[i]*6.283+t*F.B[i]*(1.2-F.sd[i]*0.6);
    F.hx[i]=cx+Math.cos(a)*r; F.hy[i]=cy+Math.sin(a)*r; },
  extra(c,t,W,H,P){
    c.fillStyle=P["dai-24"]; c.fillRect(0,0,W,H);            // 至暗夜色
    c.fillStyle=P["cinnabar"]; c.beginPath();                // 低垂的冬日
    c.arc(W*0.5,H*0.6,22,0,Math.PI*2); c.fill();
    c.strokeStyle=P["cinnabar-72"]; c.lineWidth=1; c.beginPath();
    for(let k=1;k<=4;k++){ c.arc(W*0.5,H*0.6,22+k*16,0,Math.PI*2); }
    c.stroke(); } },

/* —— 22 小寒 · 鹊始巢：寒枝不动，高枝上一巢新筑 —— */
{ pal:["ink-48","ink-24","dai-24"],
  stiff:0.11, damp:0.86, pointerR:130, pointerF:5, morphAmp:60,
  setup(F,W,H,S){
    S.pts=[];                                                // 递归生成寒枝骨架
    const rr=mulberry32(20260105);
    (function grow(x,y,ang,len,dep){
      if(dep>5||len<8) return;
      const nx=x+Math.cos(ang)*len, ny=y+Math.sin(ang)*len;
      S.pts.push([x,y,nx,ny]);
      const n=dep<2?2:(rr()>0.4?2:1);
      for(let k=0;k<n;k++) grow(nx,ny,ang+(rr()-0.5)*1.1,len*(0.62+rr()*0.18),dep+1);
    })(W*0.3,H*0.95,-Math.PI/2+(rr()-0.5)*0.3,H*0.24,0);
    for(let i=0;i<MAXP;i++){ F.sd[i]=Math.random();
      const seg=S.pts[i%S.pts.length], u=F.sd[i];
      F.hx[i]=seg[0]+(seg[2]-seg[0])*u; F.hy[i]=seg[1]+(seg[3]-seg[1])*u;
      F.x[i]=Math.random()*W; F.y[i]=Math.random()*H;
      F.sz[i]=1.2+F.sd[i]*1.2; F.col[i]=i%3; F.shp[i]=0; } },
  act(F,i,dt,t,W,H,S){                                       // 几乎静止的微颤
    F.vx[i]+=nz(F.sd[i]*20,t*3,i)*0.05;
    F.vy[i]+=nz(i,F.sd[i]*20,t*3)*0.05; },
  extra(c,t,W,H,P,S){
    c.strokeStyle=P["ink-48"]; c.lineWidth=1.4; c.beginPath();
    S.pts.forEach(p=>{ c.moveTo(p[0],p[1]); c.lineTo(p[2],p[3]); });
    c.stroke();
    const nx=S.pts[2]?((S.pts[2][0]+S.pts[2][2])/2):W*0.3,   // 鹊巢
          ny=S.pts[2]?S.pts[2][1]-6:H*0.6;
    c.strokeStyle=P["ink-72"]; c.lineWidth=1.2; c.beginPath();
    for(let k=0;k<9;k++){ const a=k*0.7;
      c.arc(nx+Math.cos(a)*4,ny+Math.sin(a)*2,8+k*1.5,a,a+2.2); }
    c.stroke(); } },

/* —— 23 大寒 · 水泽腹坚：冰裂成网，裂隙尽头暗藏朱砂梅蕾 —— */
{ pal:["dai-56","ink-48","cinnabar-72"],
  stiff:0.12, damp:0.85, pointerR:140, pointerF:5, morphAmp:50,
  setup(F,W,H,S){
    S.cracks=[]; S.buds=[];
    const rr=mulberry32(20260120);
    for(let b=0;b<16;b++){                                   // 冰裂网络
      let x=rr()*W, y=rr()*H, ang=rr()*Math.PI*2;
      const pts=[[x,y]];
      for(let k=0;k<11;k++){ const len=22+rr()*44;
        x+=Math.cos(ang)*len; y+=Math.sin(ang)*len;
        ang+=(rr()-0.5)*1.2; pts.push([x,y]); }
      S.cracks.push(pts);
      if(b%2===0) S.buds.push([x,y]); }                      // 裂隙尽头的梅蕾
    for(let i=0;i<MAXP;i++){ F.sd[i]=Math.random();
      const seg=S.cracks[i%S.cracks.length];
      const k=Math.floor(F.sd[i]*(seg.length-1)), u=(F.sd[i]*(seg.length-1))%1;
      F.hx[i]=seg[k][0]+(seg[k+1][0]-seg[k][0])*u;
      F.hy[i]=seg[k][1]+(seg[k+1][1]-seg[k][1])*u;
      F.x[i]=Math.random()*W; F.y[i]=Math.random()*H;
      F.sz[i]=1.1+F.sd[i]*1.2; F.col[i]=i%5===0?1:0; F.shp[i]=0; } },
  act(F,i,dt,t,W,H,S){                                       // 极寒中的凝滞
    F.vx[i]+=nz(F.sd[i]*30,t*2,i)*0.03;
    F.vy[i]+=nz(i,F.sd[i]*30,t*2)*0.03; },
  extra(c,t,W,H,P,S){
    c.strokeStyle=P["dai-24"]; c.lineWidth=1; c.beginPath(); // 冰裂纹理
    S.cracks.forEach(pts=>{ c.moveTo(pts[0][0],pts[0][1]);
      for(let k=1;k<pts.length;k++) c.lineTo(pts[k][0],pts[k][1]); });
    c.stroke();
    c.fillStyle=P["cinnabar-72"];                            // 待放的梅蕾
    S.buds.forEach((b,k)=>{ c.globalAlpha=0.5+0.4*Math.sin(t*1.5+k);
      c.beginPath(); c.arc(b[0],b[1],2.6,0,Math.PI*2); c.fill(); });
    c.globalAlpha=1;
    const mx=(t*10)%W;                                       // 呵气般的寒雾
    c.fillStyle=P["dai-24"];
    c.beginPath(); c.ellipse(mx,H*0.3,120,26,0,0,Math.PI*2); c.fill();
    c.beginPath(); c.ellipse(W-mx,H*0.7,150,30,0,0,Math.PI*2); c.fill(); } },
];

/* ============================================================
   [声音] AudioEngine —— Web Audio 实时合成环境音景
   持续层（双振荡器 + 滤波噪声）随节气平滑变调，拨弦层稀疏点缀；
   所有参数变化均走 setTargetAtTime，切换无爆音；默认静音。
   ============================================================ */
const AudioEngine = {
  ctx:null, master:null, enabled:false, term:-1,
  timer:0, nextPluck:2, pluckEvery:5, scale:[220,247,275,330,367,440],
  ensure(){ if(this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.gain.value = 0;
    this.master.connect(this.ctx.destination);
    this.oscA = this.ctx.createOscillator(); this.oscB = this.ctx.createOscillator();
    this.lp = this.ctx.createBiquadFilter(); this.lp.type = "lowpass";
    this.droneGain = this.ctx.createGain(); this.droneGain.gain.value = 0.07;
    this.oscA.connect(this.lp); this.oscB.connect(this.lp);
    this.lp.connect(this.droneGain); this.droneGain.connect(this.master);
    this.oscA.start(); this.oscB.start();
    const len = this.ctx.sampleRate*2, buf = this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    const ch = buf.getChannelData(0); for(let i=0;i<len;i++) ch[i]=Math.random()*2-1;
    this.noise = this.ctx.createBufferSource(); this.noise.buffer = buf; this.noise.loop = true;
    this.bp = this.ctx.createBiquadFilter(); this.bp.type="bandpass"; this.bp.Q.value=0.8;
    this.noiseGain = this.ctx.createGain(); this.noiseGain.gain.value = 0;
    this.noise.connect(this.bp); this.bp.connect(this.noiseGain); this.noiseGain.connect(this.master);
    this.noise.start(); },
  toggle(){ this.ensure(); if(!this.ctx) return false;
    if(this.ctx.state==="suspended") this.ctx.resume();
    this.enabled = !this.enabled;
    const t = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(t);
    this.master.gain.setTargetAtTime(this.enabled ? 0.4 : 0, t, 0.5);  // 淡入淡出
    if(this.enabled && this.term >= 0) this.applyTerm(this.term);
    return this.enabled; },
  setTerm(i){ this.term = i; if(!this.ctx || !this.enabled) return; this.applyTerm(i); },
  applyTerm(i){                                          // 换节气：整体变调，全程斜坡
    const tone = DATA[i].tone, t = this.ctx.currentTime;
    this.scale = [1,9/8,5/4,3/2,5/3,2].map(r => tone.root*r*2);      // 五声音阶
    this.oscA.type = tone.wave; this.oscB.type = "sine";
    this.oscA.frequency.setTargetAtTime(tone.root, t, 0.9);
    this.oscB.frequency.setTargetAtTime(tone.root*1.5 + (i%3), t, 0.9);
    this.lp.frequency.setTargetAtTime(tone.filter, t, 0.9);
    this.bp.frequency.setTargetAtTime(tone.filter*1.8, t, 0.9);
    this.noiseGain.gain.setTargetAtTime(tone.noise*0.22, t, 0.9);
    this.pluckEvery = tone.pluckEvery; },
  tick(dt){ if(!this.ctx || !this.enabled) return;       // 稀疏的拨弦泛音
    this.timer += dt; if(this.timer < this.nextPluck) return;
    this.timer = 0; this.nextPluck = this.pluckEvery*(0.7+Math.random()*0.6);
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = "sine";
    o.frequency.value = this.scale[Math.floor(Math.random()*this.scale.length)];
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.08, t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t+1.8);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+2);
    o.onended = () => { o.disconnect(); g.disconnect(); }; }
};

/* ============================================================
   [交互] UI 同步 / 滚动叙事 / 拖拽横滑 / 键盘 / hash
   ============================================================ */
const RM = window.matchMedia("(prefers-reduced-motion: reduce)");
const nowLabel = document.getElementById("nowLabel");
const railFill = document.getElementById("railFill");
const railDots = document.getElementById("railDots");
const railLabel = document.getElementById("railLabel");
const strip = document.getElementById("strip");
const stripTrack = document.getElementById("stripTrack");
const toastEl = document.getElementById("toast");
let toastTimer = 0;
function toast(msg){ toastEl.textContent = msg; toastEl.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove("show"), 3200); }

/* 构建进度轨圆点与底部节气签 */
const railBtns = [], chipBtns = [];
DATA.forEach((d, i) => {
  const b = document.createElement("button");
  b.className = "rail-dot"; b.setAttribute("aria-label", d.name + " " + d.date);
  b.addEventListener("click", () => goTo(i));
  railDots.appendChild(b); railBtns.push(b);
  const c = document.createElement("button");
  c.className = "chip"; c.setAttribute("role","option"); c.setAttribute("aria-selected","false");
  c.innerHTML = "<small>" + String(i+1).padStart(2,"0") + "</small>" + d.name;
  c.addEventListener("click", () => { if(!stripMoved) goTo(i); });
  stripTrack.appendChild(c); chipBtns.push(c);
});

const UI = {
  sync(idx){
    const d = DATA[idx];
    nowLabel.textContent = d.name + " · " + d.pinyin;
    railLabel.textContent = d.name;
    railBtns.forEach((b,k) => b.setAttribute("aria-current", k===idx ? "true" : "false"));
    chipBtns.forEach((c,k) => { c.setAttribute("aria-current", k===idx ? "true" : "false");
      c.setAttribute("aria-selected", k===idx ? "true" : "false"); });
    stripTarget(idx);
    if(location.hash !== "#"+d.slug)
      history.replaceState(null, "", "#"+d.slug);        // 当前节气写入 hash
  }
};

/* —— 滚动叙事：滚动进度驱动节气切换与进度轨 —— */
let secTops = [];
function measure(){ secTops = DATA.map(d => {
  const el = document.getElementById(d.slug);
  return el.getBoundingClientRect().top + window.scrollY;   // 文档绝对坐标
}); }
window.addEventListener("scroll", () => {
  const max = document.documentElement.scrollHeight - window.innerHeight;
  railFill.style.height = (max > 0 ? (window.scrollY/max)*100 : 0) + "%";
  const y = window.scrollY + window.innerHeight*0.5;
  let idx = 0;
  for(let k = 0; k < secTops.length; k++) if(secTops[k] <= y) idx = k;
  if(idx !== cur) setScene(idx);
}, { passive:true });

function goTo(idx){
  idx = Math.max(0, Math.min(DATA.length-1, idx));
  const top = document.getElementById(DATA[idx].slug).offsetTop;
  window.scrollTo({ top, behavior: RM.matches ? "auto" : "smooth" });
  setScene(idx);
}

/* 键盘 ← → 切换节气 */
window.addEventListener("keydown", e => {
  if(e.key === "ArrowRight"){ e.preventDefault(); goTo(cur+1); }
  else if(e.key === "ArrowLeft"){ e.preventDefault(); goTo(cur-1); }
});

/* URL hash 定位（刷新后恢复）与手动改 hash */
window.addEventListener("hashchange", () => {
  const i = DATA.findIndex(d => "#"+d.slug === location.hash);
  if(i >= 0 && i !== cur) goTo(i);
});

/* —— 拖拽横滑：自实现惯性衰减与边缘回弹 —— */
let sx = 0, sv = 0, dragging = false, lastX = 0, stripMoved = false, stripGoal = null;
function stripBounds(){ return Math.min(0, strip.clientWidth - stripTrack.scrollWidth); }
function stripTarget(idx){                               // 当前节气签居中
  const chip = chipBtns[idx]; if(!chip) return;
  const goal = strip.clientWidth/2 - (chip.offsetLeft + chip.offsetWidth/2);
  stripGoal = Math.max(stripBounds(), Math.min(0, goal));
  if(RM.matches){ sx = stripGoal; stripGoal = null;      // 减弱动效：直接落位
    stripTrack.style.transform = "translateX(" + sx + "px)"; }
}
strip.addEventListener("pointerdown", e => {
  dragging = true; stripMoved = false; stripGoal = null; sv = 0;
  lastX = e.clientX; strip.classList.add("dragging");
  strip.setPointerCapture(e.pointerId);
});
strip.addEventListener("pointermove", e => {
  if(!dragging) return;
  const dx = e.clientX - lastX; lastX = e.clientX;
  if(Math.abs(dx) > 2) stripMoved = true;
  sv = sv*0.5 + dx*0.5;
  const min = stripBounds();
  let nx = sx + dx;
  if(nx > 0) nx = nx*0.35;                               // 橡皮筋阻尼
  else if(nx < min) nx = min + (nx-min)*0.35;
  sx = nx;
});
function stripRelease(){ dragging = false; strip.classList.remove("dragging"); }
strip.addEventListener("pointerup", stripRelease);
strip.addEventListener("pointercancel", stripRelease);
function stripStep(){                                    // 惯性衰减 + 边缘回弹
  if(dragging){ stripTrack.style.transform = "translateX(" + sx + "px)"; return; }
  if(stripGoal !== null){ sx += (stripGoal - sx)*0.12;   // 回中动画
    if(Math.abs(stripGoal - sx) < 0.5) stripGoal = null; }
  else {
    sx += sv; sv *= 0.94;                                // 惯性衰减
    if(Math.abs(sv) < 0.05) sv = 0;
    const min = stripBounds();
    if(sx > 0) sx += (0 - sx)*0.14;                      // 边缘回弹
    else if(sx < min) sx += (min - sx)*0.14;
  }
  stripTrack.style.transform = "translateX(" + sx + "px)";
}

/* ============================================================
   [工程] 主题切换 / 减弱动效 / DPR 与重排 / 性能守护 / 启动
   ============================================================ */
const themeBtn = document.getElementById("themeBtn");
const soundBtn = document.getElementById("soundBtn");
function applyTheme(mode){
  document.documentElement.dataset.theme = mode;
  themeBtn.setAttribute("aria-pressed", mode === "dark" ? "true" : "false");
  refreshPalette(); resolvePalettes();
  if(RM.matches) staticRender();
}
themeBtn.addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  try{ localStorage.setItem("solar-theme", next); }catch(e){}
  applyTheme(next);
});
soundBtn.addEventListener("click", () => {
  soundBtn.setAttribute("aria-pressed", AudioEngine.toggle() ? "true" : "false");
});

/* 减弱动效：粒子直接归位，渲染一帧静态构图 */
function staticRender(){
  if(!scene) return;
  for(let k = 0; k < 240; k++) updateParticles(1/60);    // 模拟沉淀出构图
  simT = 20; morphT = 1; renderParticles();
}

/* 主循环：rAF 驱动 */
let rafId = 0, lastTs = 0;
function frame(ts){
  rafId = requestAnimationFrame(frame);
  const dt = Math.min(0.05, (ts - lastTs)/1000 || 0.016); lastTs = ts;
  simT += dt; morphT = Math.min(1, morphT + dt/MORPH_DUR);
  updateParticles(dt);
  renderParticles();
  AudioEngine.tick(dt);
  stripStep();
  fpsWatch(dt);
}
function startLoop(){ if(!rafId){ lastTs = performance.now(); rafId = requestAnimationFrame(frame); } }
function stopLoop(){ cancelAnimationFrame(rafId); rafId = 0; }

/* 性能守护：连续 60 帧平均低于 45fps 时自动降级粒子规模 */
let ftAcc = 0, ftCnt = 0;
function fpsWatch(dt){
  ftAcc += dt; ftCnt++;
  if(ftCnt < 60) return;
  const fps = ftCnt/ftAcc; ftAcc = 0; ftCnt = 0;
  if(fps < 45 && levelIdx < LEVELS.length-1){
    levelIdx++; alive = LEVELS[levelIdx];
    toast("已自动降低粒子规模至 " + alive + " 以保证流畅");
  }
}

/* 视口变化：适配 DPR，重建场景布局与离屏缓冲 */
let rsTimer = 0;
window.addEventListener("resize", () => {
  clearTimeout(rsTimer);
  rsTimer = setTimeout(() => {
    sizeCanvas(); measure();
    if(scene){ if(scene.exit) scene.exit(S); S = {};
      if(scene.enter) scene.enter(S, W, H); scene.setup(F, W, H, S); }
    morphT = 1;
    stripTarget(cur);
    if(RM.matches) staticRender();
  }, 150);
});

/* 启动 */
(function boot(){
  let theme = null;
  try{ theme = localStorage.getItem("solar-theme"); }catch(e){}
  if(!theme) theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = theme;
  themeBtn.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
  if(RM.matches) document.documentElement.classList.add("rm");
  refreshPalette(); resolvePalettes(); sizeCanvas(); measure();
  const init = DATA.findIndex(d => "#"+d.slug === location.hash);
  setScene(init >= 0 ? init : 0);
  if(init > 0) requestAnimationFrame(() => {             // 首帧绘制后按 hash 瞬时定位
    measure();
    window.scrollTo({ top: secTops[init], behavior: "instant" });
    window.dispatchEvent(new Event("scroll"));
  });
  else window.dispatchEvent(new Event("scroll"));        // 初始化进度轨
  if(RM.matches) staticRender(); else startLoop();
  RM.addEventListener("change", () => {                  // 跟随系统动效偏好
    document.documentElement.classList.toggle("rm", RM.matches);
    if(RM.matches){ stopLoop(); staticRender(); } else startLoop();
  });
})();
</script>
