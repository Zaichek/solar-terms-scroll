<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="description" content="时间的形状 · 二十四节气数字长卷 —— 一座程序化生成的数字水墨博物馆。">
<title>时间的形状 · 二十四节气数字长卷</title>
<style>
/* ============================================================
 * 【样式模块 A】设计基座
 * 色板（硬性约束）：宣纸白 #F5F1E8 / 墨黑 #1A1A1A /
 *                   朱砂红 #C0392B / 黛蓝 #2C3E50
 * 其余颜色均为以上四色的派生色阶（明度/透明度变化）。
 * 所有间距遵循 8pt 网格（--sp-* 系列变量）。
 * ============================================================ */
:root{
  --paper:#F5F1E8;
  --ink:#1A1A1A;
  --cinnabar:#C0392B;
  --dai:#2C3E50;
  --paper-2:#EDE7D8;            /* 宣纸·深一档 */
  --paper-3:#E3DCC9;            /* 宣纸·再深 */
  --ink-2:#4A4A46;              /* 墨·七成 */
  --ink-3:#8A877E;              /* 墨·四成 */
  --cinnabar-2:#A93226;         /* 朱砂·深 */
  --dai-2:#46617D;              /* 黛·亮一档 */
  --line:rgba(26,26,26,.16);    /* 分隔线 */
  --card:rgba(245,241,232,.88); /* 展签底 */
  --sp-1:8px; --sp-2:16px; --sp-3:24px; --sp-4:32px;
  --sp-6:48px; --sp-8:64px; --sp-12:96px;
  --serif:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
  --sans:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
}
/* 暗色主题：同色族的暗部派生，不引入色板外色相 */
[data-theme="dark"]{
  --paper:#171A1E;
  --ink:#E9E4D6;
  --cinnabar:#D15A4A;
  --dai:#8FA6BC;
  --paper-2:#1F2429;
  --paper-3:#262C33;
  --ink-2:#B9B3A4;
  --ink-3:#7C786D;
  --cinnabar-2:#E06A58;
  --dai-2:#A9BCCF;
  --line:rgba(233,228,214,.18);
  --card:rgba(23,26,30,.82);
}

/* ============================================================
 * 【样式模块 B】基础布局：画布固定、长卷纵向滚动
 * ============================================================ */
*{ margin:0; padding:0; box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  overflow-x:hidden;
  scrollbar-width:none;                 /* 隐藏原生滚动条（用自定义进度轨替代） */
  transition:background-color .6s ease, color .6s ease;
}
body::-webkit-scrollbar{ display:none; }
#stage{                                 /* 全屏 Canvas：所有程序化视觉 */
  position:fixed; inset:0; z-index:0;
  width:100%; height:100%; display:block;
}
main{ position:relative; z-index:1; }
.scene{ position:relative; height:100vh; height:100svh; }

/* ============================================================
 * 【样式模块 C】展签（博物馆标签排版）与封面
 * ============================================================ */
.plaque{
  position:absolute; left:var(--sp-8); bottom:var(--sp-12);
  max-width:560px; padding:var(--sp-4);
  background:var(--card); border:1px solid var(--line);
  opacity:0; transform:translateY(24px);
  transition:opacity .7s ease, transform .7s ease, background-color .6s ease;
}
.scene.active .plaque{ opacity:1; transform:none; }
.scene:nth-child(even) .plaque{ left:auto; right:var(--sp-8); }
.scene.first .plaque{ left:auto; right:var(--sp-8); } /* 首屏封面居左，展签让位右侧 */
.p-top{ display:flex; align-items:center; gap:var(--sp-2); margin-bottom:var(--sp-2); }
.p-num{ font-size:13px; letter-spacing:.2em; color:var(--ink-3); }
.p-seal{                                /* 朱砂印章（纯 CSS + 汉字，非 emoji） */
  width:32px; height:32px; display:grid; place-items:center;
  background:var(--cinnabar); color:#F5F1E8;
  font-family:var(--serif); font-size:18px; line-height:1;
}
.p-name{
  font-family:var(--serif); font-weight:700;
  font-size:clamp(48px, 7vw, 88px); line-height:1.1; letter-spacing:.08em;
}
.p-pin{ margin-top:var(--sp-1); font-size:16px; letter-spacing:.24em; color:var(--ink-3); }
.p-date{
  margin-top:var(--sp-2); font-size:14px; color:var(--ink-2);
  border-left:3px solid var(--cinnabar); padding-left:var(--sp-2);
}
.p-hou{ list-style:none; display:flex; flex-wrap:wrap; gap:var(--sp-2); margin-top:var(--sp-3); }
.p-hou li{
  font-size:13px; color:var(--ink-2);
  padding:var(--sp-1) var(--sp-2); border:1px solid var(--line);
}
.p-desc{ margin-top:var(--sp-3); font-size:15px; line-height:1.9; text-align:justify; color:var(--ink-2); }
.p-poem{ margin-top:var(--sp-3); font-family:var(--serif); font-size:17px; line-height:1.8; }
.p-poem cite{
  display:block; margin-top:var(--sp-1);
  font-family:var(--sans); font-style:normal; font-size:13px; color:var(--ink-3);
}

/* 封面（与「立春」同屏） */
.cover{ position:absolute; left:var(--sp-8); top:16vh; max-width:720px; }
.cover h1{
  font-family:var(--serif); font-weight:700;
  font-size:clamp(56px, 9vw, 128px); line-height:1.15; letter-spacing:.12em;
}
.cover .sub{ margin-top:var(--sp-3); font-size:clamp(15px,1.6vw,20px); letter-spacing:.4em; color:var(--ink-2); }
.cover .intro{ margin-top:var(--sp-4); max-width:480px; font-size:15px; line-height:2; color:var(--ink-2); text-align:justify; }
.hint{
  position:absolute; left:50%; bottom:120px; transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; gap:var(--sp-1);
  color:var(--ink-3); font-size:12px; letter-spacing:.3em;
}
.hint svg{ width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.6;
  stroke-linecap:round; stroke-linejoin:round; animation:bob 2.4s ease-in-out infinite; }
@keyframes bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(8px); } }

/* ============================================================
 * 【样式模块 D】控件 / 进度轨 / 横滑节气列表 / 提示
 * ============================================================ */
.brand{
  position:fixed; top:var(--sp-3); left:var(--sp-3); z-index:6;
  padding:var(--sp-1) var(--sp-2); border:1px solid var(--line); background:var(--card);
  font-family:var(--serif); font-size:14px; letter-spacing:.3em; color:var(--ink-2);
}
.controls{ position:fixed; top:var(--sp-3); right:var(--sp-3); z-index:6;
  display:flex; flex-direction:column; gap:var(--sp-1); }
.ctl{
  width:48px; height:48px; display:grid; place-items:center; cursor:pointer;
  border:1px solid var(--line); background:var(--card); color:var(--ink);
  transition:border-color .3s, color .3s, background-color .6s ease;
}
.ctl:hover{ border-color:var(--cinnabar); color:var(--cinnabar); }
.ctl svg{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.6;
  stroke-linecap:round; stroke-linejoin:round; }
.ctl .alt{ display:none; }
.ctl[aria-pressed="true"] .base{ display:none; }
.ctl[aria-pressed="true"] .alt{ display:block; }

/* 右侧自定义进度轨（24 个节气刻度 + 滑动游标） */
#rail{
  position:fixed; right:var(--sp-3); top:50%; transform:translateY(-50%); z-index:6;
  display:flex; flex-direction:column; align-items:center; gap:6px; padding:var(--sp-2) 0;
}
#rail::before{ content:""; position:absolute; top:0; bottom:0; left:50%; width:1px;
  background:var(--line); }
.dot{
  position:relative; width:8px; height:8px; padding:0; cursor:pointer;
  border-radius:50%; border:1px solid var(--ink-3); background:transparent;
  transition:transform .3s, background-color .3s, border-color .3s;
}
.dot[aria-current="true"]{
  background:var(--cinnabar); border-color:var(--cinnabar); transform:scale(1.5);
}
#railThumb{
  position:absolute; left:50%; top:0; width:1px; height:24px;
  background:var(--cinnabar); transform:translate(-50%,-50%);
  transition:top .25s ease;
}

/* 底部横滑节气列表（自实现惯性 + 边缘回弹） */
#strip{
  position:fixed; left:0; right:0; bottom:0; z-index:6; height:96px;
  border-top:1px solid var(--line); touch-action:none; user-select:none;
  background:linear-gradient(to top, var(--card), transparent);
}
#stripTrack{
  position:absolute; top:0; bottom:0; left:0; display:flex; align-items:stretch;
  gap:var(--sp-1); padding:var(--sp-2) var(--sp-4);
  will-change:transform; cursor:grab;
}
#stripTrack.dragging{ cursor:grabbing; }
.card{
  flex:0 0 auto; width:112px; padding:var(--sp-1) var(--sp-2); cursor:pointer;
  display:flex; flex-direction:column; justify-content:center; gap:4px; text-align:left;
  border:1px solid var(--line); background:var(--card); color:var(--ink);
  font-family:var(--sans);
  transition:border-color .3s, background-color .6s ease, color .6s ease;
}
.card .c-num{ font-size:11px; letter-spacing:.16em; color:var(--ink-3); }
.card .c-name{ font-family:var(--serif); font-size:20px; letter-spacing:.1em; }
.card .c-date{ font-size:10px; color:var(--ink-3); }
.card[aria-current="true"]{ border-color:var(--cinnabar); }
.card[aria-current="true"] .c-name{ color:var(--cinnabar); }

#toast{
  position:fixed; left:50%; bottom:120px; z-index:7;
  transform:translateX(-50%) translateY(8px);
  padding:var(--sp-1) var(--sp-3); font-size:13px;
  background:var(--ink); color:var(--paper);
  opacity:0; pointer-events:none; transition:opacity .4s, transform .4s;
}
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

/* ============================================================
 * 【样式模块 E】无障碍：跳转链接 / 焦点可见 / 读屏专用
 * ============================================================ */
.sr-only{
  position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap;
}
.skip{
  position:fixed; left:-9999px; top:var(--sp-2); z-index:9;
  padding:var(--sp-1) var(--sp-2); background:var(--cinnabar); color:#F5F1E8;
  text-decoration:none;
}
.skip:focus{ left:var(--sp-2); }
:focus-visible{ outline:2px solid var(--cinnabar); outline-offset:2px; }

/* ============================================================
 * 【样式模块 F】动效偏好降级（prefers-reduced-motion）
 * ============================================================ */
@media (prefers-reduced-motion: reduce){
  html{ scroll-behavior:auto; }
  .hint svg{ animation:none; }
  .plaque{ transition:none; opacity:1; transform:none; }
  #railThumb{ transition:none; }
}

/* ============================================================
 * 【样式模块 G】响应式（320px – 2560px）
 * ============================================================ */
@media (max-width:768px){
  .plaque{ left:var(--sp-3); right:var(--sp-3); bottom:112px; max-width:none; padding:var(--sp-3); }
  .scene:nth-child(even) .plaque{ left:var(--sp-3); right:var(--sp-3); }
  .scene.first .plaque{ left:var(--sp-3); right:var(--sp-3); }
  .cover{ left:var(--sp-3); right:var(--sp-3); top:12vh; }
  #rail{ right:var(--sp-1); }
  .card{ width:88px; }
}
@media (max-width:560px){
  #rail{ gap:2px; }
  .dot{ width:6px; height:6px; }
  .p-hou{ gap:var(--sp-1); }
}
@media (min-width:1920px){
  .plaque{ max-width:640px; }
  .p-desc{ font-size:17px; }
}

/* ============================================================
 * 【样式模块 H】打印样式：长卷输出为一张海报
 * ============================================================ */
#printHead{ display:none; font-family:var(--serif); margin-bottom:var(--sp-2); }
#printHead h1{ font-size:32pt; letter-spacing:.2em; }
#printHead p{ font-size:11pt; letter-spacing:.3em; color:#4A4A46; margin-top:var(--sp-1); }
@page{ size:A3 portrait; margin:12mm; }
@media print{
  html{ scroll-behavior:auto; }
  body{ background:#F5F1E8; color:#1A1A1A; overflow:visible; }
  #stage, .controls, .brand, #rail, #strip, #toast, .hint, .skip{ display:none !important; }
  #printHead{ display:block; }
  main{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .scene{ height:auto; page-break-inside:avoid; }
  .plaque{
    position:static; opacity:1; transform:none; max-width:none;
    background:#F5F1E8; border:1px solid rgba(26,26,26,.25);
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .scene:nth-child(even) .plaque, .scene.first .plaque{ left:auto; right:auto; }
  .cover{ position:static; display:none; }
}
</style>
</head>
<body>
<!-- 无障碍：键盘用户跳转链接 -->
<a class="skip" href="#s-0">跳到正文</a>

<!-- 全屏程序化画布（粒子场 + 24 个节气场景，纯装饰，读屏隐藏） -->
<canvas id="stage" aria-hidden="true"></canvas>

<!-- 左上角馆名 -->
<div class="brand" aria-hidden="true">时间的形状</div>

<!-- 右上角控件：声音开关 / 明暗主题（图标均为手绘 SVG，无 emoji） -->
<div class="controls" role="group" aria-label="显示与声音控制">
  <button id="btnSound" class="ctl" type="button" aria-pressed="false" aria-label="环境音：已关闭">
    <svg class="base" viewBox="0 0 24 24" aria-hidden="true">

      <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"></path>

</div>

<!-- 纵向长卷：24 个节气 section 由脚本按数据注入 -->
<main id="scroll"></main>

<!-- 右侧自定义进度轨（替代原生滚动条） -->
<nav id="rail" aria-label="二十四节气进度">
  <div id="railThumb" aria-hidden="true"></div>
</nav>

<!-- 底部横滑节气列表（拖拽惯性 + 边缘回弹） -->
<nav id="strip" aria-label="节气横向列表，可拖拽浏览">

<!-- 提示浮层（aria-live）与读屏播报区 -->
<div id="toast" role="status"></div>

<!-- 打印海报页眉（仅打印可见） -->
<div id="printHead">
  <h1>时间的形状</h1>
  <p>二十四节气数字长卷 · 数字水墨 · 博物馆展签体例</p>

<script>
"use strict";
/* ============================================================
 * 【脚本模块 0】工具函数与全局常量
 * ============================================================ */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const clamp01 = v => clamp(v, 0, 1);
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; // 缓入缓出
const TAU = Math.PI * 2;
const reduceMQ = matchMedia("(prefers-reduced-motion: reduce)"); // 动效降级（可实时监听）
/* 关闭浏览器自动滚动恢复：避免 load 后被拽回顶部、覆盖 hash 定位（需求 8） */
if ("scrollRestoration" in history) history.scrollRestoration = "manual";

/* 确定性伪随机（mulberry32）：保证每次打开同一场景构图一致 */
function mulberry(seed){
  let t = seed >>> 0;
  return () => {
    t += 0x6D2B79F5;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}

/* ============================================================
 * 【脚本模块 1】色板：与 CSS 变量同步的双主题调色板
 * Canvas 端持有当前色数值，主题切换时逐帧插值，过渡平滑。
 * ============================================================ */
const THEMES = {
  light: { paper:[245,241,232], ink:[26,26,26],  cinnabar:[192,57,43],  dai:[44,62,80]   },
  dark:  { paper:[23,26,30],    ink:[233,228,214], cinnabar:[209,90,74], dai:[143,166,188] }
};
const PAL = { cur: null, tgt: null, moving: false };
function setPalette(name){
  PAL.tgt = THEMES[name];
  if (!PAL.cur){                       // 首次：直接就位
    PAL.cur = JSON.parse(JSON.stringify(THEMES[name]));
    PAL.moving = false;
  } else {
    PAL.moving = true;                 // 之后：每帧向目标插值
  }
}
function tickPalette(){
  if (!PAL.moving) return;
  let done = true;
  for (const k in PAL.tgt){
    for (let i = 0; i < 3; i++){
      PAL.cur[k][i] = lerp(PAL.cur[k][i], PAL.tgt[k][i], 0.12);
      if (Math.abs(PAL.cur[k][i] - PAL.tgt[k][i]) > 0.5) done = false;
    }
  }
  PAL.moving = !done;
  vignetteDirty = true;                // 主题过渡中，暗角渐变需要重建
}
function rgba(name, a){ const c = PAL.cur[name]; return "rgba(" + (c[0]|0) + "," + (c[1]|0) + "," + (c[2]|0) + "," + a + ")"; }
function mixC(n1, n2, t, a){           // 两色混合（用于季节底色微染）
  const A = PAL.cur[n1], B = PAL.cur[n2];
  return "rgba(" + (lerp(A[0],B[0],t)|0) + "," + (lerp(A[1],B[1],t)|0) + "," + (lerp(A[2],B[2],t)|0) + "," + a + ")";
}

/* ============================================================
 * 【脚本模块 2】主题初始化（跟随系统 + 手动切换）
 * ============================================================ */
const darkMQ = matchMedia("(prefers-color-scheme: dark)");
let themeName = darkMQ.matches ? "dark" : "light";
let userChoseTheme = false;
function applyTheme(name){
  themeName = name;
  document.documentElement.dataset.theme = name;
  setPalette(name);
  $("#btnTheme").setAttribute("aria-pressed", String(name === "dark"));
  $("#btnTheme").setAttribute("aria-label", name === "dark" ? "切换为明亮主题" : "切换为暗黑主题");
  if (reduceMQ.matches) renderStatic();
}
if (darkMQ.addEventListener){
  darkMQ.addEventListener("change", e => { if (!userChoseTheme) applyTheme(e.matches ? "dark" : "light"); });
}

/* ============================================================
 * 【脚本模块 3】画布尺寸与 DPR 适配
 * ============================================================ */
const cvs = $("#stage");
const ctx = cvs.getContext("2d", { alpha: false });
let W = 0, H = 0, DPR = 1, vignetteDirty = true, vignetteGrad = null;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, perf.downgrades >= 1 ? 1.5 : 2);
  W = window.innerWidth;
  H = window.innerHeight;
  cvs.width = Math.round(W * DPR);
  cvs.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  vignetteDirty = true;
}
/* ============================================================
 * 【脚本模块 4】内容数据：二十四节气（真实文案）
 * 字段：slug 标识 / name 名称 / pin 拼音 / dates 公历区间 /
 *      season 季节 / hou 物候三候 / desc 原创描述 /
 *      poem 古诗 / src 出处 / scene 对应场景键
 * ============================================================ */
const DATA = [
  { slug:"lichun", name:"立春", pin:"lì chūn", dates:"2月4日 – 2月18日", season:"spring",

/* ============================================================
 * 【脚本模块 6】粒子引擎：2000 个粒子的流场、鼠标扰动、重组
 * 采用 TypedArray 扁平存储，单帧更新耗时可控（≤8ms 目标）。
 * ============================================================ */
const perf = { fps: 0, ema: 0.016, lowCount: 0, downgrades: 0 };   // 性能监视
const state = {                                                    // 全局场景状态
  active: 0, morphT: 0, morphDur: 1200, prevIdx: -1, time: 0,      // morphT=0：首帧即触发初始重组
  mouse: { x: -9999, y: -9999, px: -9999, py: -9999, active: false }
};

class ParticleField{
  constructor(){
    this.N = 2200;                       // 初始粒子规模（要求 ≥2000）
    this.count = this.N;                 // 当前生效数量（性能降级时缩小）
    this.px = new Float32Array(this.N);  this.py = new Float32Array(this.N);
    this.tx = new Float32Array(this.N);  this.ty = new Float32Array(this.N);  // 目标位
    this.vx = new Float32Array(this.N);  this.vy = new Float32Array(this.N);
    this.sd = new Float32Array(this.N);  // 每粒确定性随机
    this.alive = new Uint8Array(this.N); // 1=被当前场景使用
    this.prevAlive = new Uint8Array(this.N); // 上一场景的使用标记（用于 morph 出发位）
    const r = mulberry(20260817);
    for (let i = 0; i < this.N; i++){
      this.sd[i] = r();
      this.px[i] = Math.random() * 2000;
      this.py[i] = Math.random() * 1200;
      this.tx[i] = this.px[i]; this.ty[i] = this.py[i];
      this.alive[i] = 1; this.prevAlive[i] = 0;
    }
  }
  /* 粒子重组：把粒子分配到新场景的目标位（形态由场景决定） */
  retarget(i, targets, W, H){
    this.prevAlive[i] = this.alive[i];
    const r1 = this.sd[i], r2 = this.sd[(i * 7 + 13) % this.N], r3 = this.sd[(i * 13 + 7) % this.N];
    // 记录出发位 = 旧目标位（场景 morph 的起点）
    if (!this.morphSrc) this.morphSrc = { x: new Float32Array(this.N), y: new Float32Array(this.N) };
    this.morphSrc.x[i] = this.tx[i];
    this.morphSrc.y[i] = this.ty[i];
    if (targets && targets.length){
      const n = targets.length;
      // 用确定性噪声打散取样顺序，避免相邻粒子全挤在一起
      const j = Math.floor((r1 * 17 + r2 * 31 + r3 * 97) % 1 * n) % n;
      const t = targets[j];
      this.tx[i] = t.x * W + (r2 - .5) * (t.j || 0);
      this.ty[i] = t.y * H + (r3 - .5) * (t.j || 0);
      this.alive[i] = t.live !== undefined ? (t.live > r3 ? 1 : 0) : 1;
    } else {
      this.alive[i] = 1;
    }
  }
  /* 每帧更新：位置向目标位插值 + 流场摆动 + 鼠标斥力 */
  update(dt, morphT, W, H){
    const { px, py, tx, ty, vx, vy, sd, alive, prevAlive, count } = this;
    const m = state.mouse, time = state.time;
    const e = ease(clamp01(morphT));
    for (let i = 0; i < count; i++){
      // 形变过渡：旧位 -> 新位 的插值路径上叠加弧线偏移，形成"整体重组"感
      let gx = tx[i], gy = ty[i];
      if (morphT < 1){
        const sx = this.morphSrc ? this.morphSrc.x[i] : px[i];
        const sy = this.morphSrc ? this.morphSrc.y[i] : py[i];
        gx = lerp(sx, tx[i], e);
        gy = lerp(sy, ty[i], e);
        const arc = Math.sin(e * Math.PI) * 60 * (sd[i] - .5); // 弧线侧移
        gx += arc; gy += arc * .6;
      }
      // 流场摆动（伪 curl：随相位与位置变化的低频场）
      const ph = time * .001 + sd[i] * TAU;
      const n1 = Math.sin(gx * .003 + ph) + Math.cos(gy * .004 - ph * .7);
      const n2 = Math.cos(gx * .004 - ph * .8) + Math.sin(gy * .003 + ph);
      vx[i] += (n1 * 6 - vx[i]) * .06;
      vy[i] += (n2 * 4 - vy[i]) * .06;
      // 向目标位的弱弹性
      vx[i] += (gx - px[i]) * .006;
      vy[i] += (gy - py[i]) * .006;
      // 鼠标斥力（对指针产生可感知扰动）
      if (m.active){
        const dx = px[i] - m.x, dy = py[i] - m.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < 16000){
          const f = (16000 - d2) / 16000;
          const d = Math.sqrt(d2) || 1;
          vx[i] += dx / d * f * 3.2;
          vy[i] += dy / d * f * 3.2;
        }
      }
      // 存活度淡出粒子缓慢回收至中心（场景间形态切换的过渡粒子）
      if (!alive[i] && prevAlive[i]){
        vx[i] += (W / 2 - px[i]) * .0004;
        vy[i] += (H / 2 - py[i]) * .0004;
      }
      px[i] += vx[i]; py[i] += vy[i];
      vx[i] *= .94; vy[i] *= .94;
    }
  }
  /* 绘制：按"存活标记 + 相位"分桶减少 fillStyle 切换次数 */
  draw(ctx, morphT){
    const { px, py, alive, count, sd } = this;
    const baseA = .10 + PAL.moving * 0;   // 基底透明度
    for (let b = 0; b < 3; b++){
      ctx.fillStyle = b === 0 ? rgba("ink", baseA) : b === 1 ? rgba("dai", baseA * .9) : rgba("cinnabar", baseA * .8);
      for (let i = b; i < count; i += 3){
        if (!alive[i]) continue;
        const r = .8 + sd[i] * 1.8;
        ctx.fillRect(px[i] - r * .5, py[i] - r * .5, r, r);
      }
    }
  }
}

/* ============================================================
 * 【脚本模块 7】性能监视：连续 60 帧 <45fps 时降级粒子规模
 * ============================================================ */
function perfWatch(dt){
  perf.ema = perf.ema * .95 + dt * .05;          // 帧时长指数滑动平均
  const fps = 1 / Math.max(perf.ema, 1e-4);
  if (fps < 45 && !reduceMQ.matches){
    perf.lowCount++;
    if (perf.lowCount >= 60 && perf.downgrades < 3){
      perf.downgrades++;
      field.count = Math.max(600, Math.floor(field.count * .6));
      resize();                                   // 同步下调 DPR 上限
      toast("已自动降低粒子规模以保持流畅");
      perf.lowCount = 0;
    }
  } else {
    perf.lowCount = Math.max(0, perf.lowCount - 1);
  }
}

/* ============================================================
 * 【脚本模块 9】程序化水墨画笔工具
 * 所有视觉均为代码生成：墨枝、梅瓣、山影、雪片、涟漪……
 * ============================================================ */
const hash1 = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

/* 墨枝：递归分叉，线宽渐细，模拟书法运笔 */
function inkBranch(ctx, x, y, len, ang, w, depth, rnd){
  if (depth <= 0 || len < 4) return;
  const bend = (rnd() - .5) * .5;
  const x2 = x + Math.cos(ang + bend) * len;
  const y2 = y + Math.sin(ang + bend) * len;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.quadraticCurveTo((x + x2) / 2 + (rnd() - .5) * 12, (y + y2) / 2 + (rnd() - .5) * 12, x2, y2);
  ctx.lineWidth = w;
  ctx.stroke();
  const n = depth > 3 ? 2 : rnd() > .3 ? 2 : 1;
  for (let i = 0; i < n; i++){
    inkBranch(ctx, x2, y2, len * (0.6 + rnd() * 0.2), ang + (rnd() - .5) * 1.1, w * .62, depth - 1, rnd);
  }
}
/* 梅花：五瓣 + 蕊 */
function blossom(ctx, x, y, r, fill, core){
  for (let k = 0; k < 5; k++){
    const a = k / 5 * TAU - Math.PI / 2;
    ctx.beginPath();
    ctx.arc(x + Math.cos(a) * r * .72, y + Math.sin(a) * r * .72, r * .58, 0, TAU);
    ctx.fillStyle = fill;
    ctx.fill();
  }
  ctx.beginPath();
  ctx.arc(x, y, r * .3, 0, TAU);
  ctx.fillStyle = core;
  ctx.fill();
}
/* 山影：一条噪声山脊线并向下填充 */
function ridge(ctx, W, H, baseY, amp, color, seed){
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += Math.max(6, W / 160)){
    const n = hash1(x * .011 + seed) * .6 + hash1(x * .037 + seed * 2) * .4;
    ctx.lineTo(x, baseY - n * amp);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}
/* 六角雪片路径 */
function flakePath(ctx, x, y, r){
  ctx.beginPath();
  for (let k = 0; k < 6; k++){
    const a = k / 6 * TAU;
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    const bx = x + Math.cos(a) * r * .6, by = y + Math.sin(a) * r * .6;
    ctx.moveTo(bx, by);
    ctx.lineTo(bx + Math.cos(a + .6) * r * .3, by + Math.sin(a + .6) * r * .3);
    ctx.moveTo(bx, by);
    ctx.lineTo(bx + Math.cos(a - .6) * r * .3, by + Math.sin(a - .6) * r * .3);
  }
  ctx.stroke();
}
/* 叶片（椭圆叶片，可旋转） */
function leafShape(ctx, x, y, rx, ry, rot, color){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.beginPath();
  ctx.ellipse(0, 0, rx, ry, 0, 0, TAU);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}
/* 月亮/太阳圆盘（多层同心淡圈，水墨晕染感） */
function haloDisc(ctx, x, y, r, core, ring, rings){
  for (let k = rings; k >= 1; k--){
    ctx.beginPath();
    ctx.arc(x, y, r * (1 + k * .28), 0, TAU);
    ctx.strokeStyle = ring;
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  ctx.fillStyle = core;
  ctx.fill();
}
/* 暗角渐变（缓存，主题/尺寸变化时重建） */
function drawVignette(ctx, W, H){
  if (vignetteDirty || !vignetteGrad){
    vignetteGrad = ctx.createRadialGradient(W / 2, H * .45, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
    vignetteGrad.addColorStop(0, rgba("ink", 0));
    vignetteGrad.addColorStop(1, rgba("ink", themeName === "dark" ? .5 : .16));
    vignetteDirty = false;
  }
  ctx.fillStyle = vignetteGrad;
  ctx.fillRect(0, 0, W, H);
}

/* ============================================================
 * 【脚本模块 10】季节底景离屏层（懒构建、可回收）
 * ============================================================ */
let seasonLayer = null;      // { season, canvas, w, h }
let seasonDirty = true;      // 主题过渡结束后需重绘

function paintSeasonBase(cx, season, w, h, rnd){
  cx.clearRect(0, 0, w, h);
  cx.lineCap = "round";
  cx.strokeStyle = rgba("ink", .5);
  if (season === 0){                                   // 春：远山 + 一枝斜出的新枝
    ridge(cx, w, h, h * .78, h * .1, rgba("dai", .1), 3);
    inkBranch(cx, -20, h * .18, w * .16, .5, 4, 5, rnd);
  } else if (season === 1){                            // 夏：顶部垂枝浓荫
    inkBranch(cx, w * .1, -20, h * .14, Math.PI / 2.3, 5, 4, rnd);
    inkBranch(cx, w * .95, -30, h * .16, Math.PI / 1.7, 5, 4, rnd);
    ridge(cx, w, h, h * .88, h * .05, rgba("dai", .08), 8);
  } else if (season === 2){                            // 秋：疏枝横斜
    inkBranch(cx, w + 20, h * .22, -w * .17, .35, 4, 5, rnd);
    ridge(cx, w, h, h * .85, h * .06, rgba("dai", .07), 11);
  } else {                                             // 冬：雪脊 + 枯枝
    ridge(cx, w, h, h * .82, h * .09, rgba("ink", .08), 17);
    inkBranch(cx, -20, h * .7, w * .13, -.55, 3.5, 5, rnd);
  }
}
function ensureSeasonLayer(season){
  if (seasonLayer && seasonLayer.season === season && !seasonDirty) return seasonLayer;
  if (seasonLayer){ seasonLayer.canvas.width = 0; seasonLayer.canvas.height = 0; } // 释放旧离屏画布
  const c = document.createElement("canvas");
  const w = Math.min(Math.round(W), 1440), h = Math.min(Math.round(H), 860);
  c.width = w; c.height = h;
  paintSeasonBase(c.getContext("2d"), season, w, h, mulberry(season * 777 + 5));
  seasonLayer = { season, canvas: c, w, h };
  seasonDirty = false;
  return seasonLayer;
}

/* ============================================================
 * 【脚本模块 11】二十四节气场景定义
 * 每个场景：ensure(s,W,H) 预生成确定性数据；
 *           draw(ctx,s,W,H) 每帧绘制（s.t 为场景内时间）。
 * 静态模式（reduced-motion）下直接以固定时刻调用 draw。
 * ============================================================ */
const SCENES = {};

/* —— 01 立春：冰河初解，梅枝先春 —— */
SCENES.lichun = {
  ensure(s, W, H){
    const r = s.r;
    s.extra.blossoms = Array.from({ length: 9 }, () => ({
      x: W * (.12 + r() * .5), y: H * (.14 + r() * .4), r: 5 + r() * 9, d: r() * 2.2
    }));
  },
  draw(ctx, s, W, H){
    ridge(ctx, W, H, H * .8, H * .09, rgba("dai", .12), 1);
    ridge(ctx, W, H, H * .88, H * .06, rgba("dai", .07), 2);
    ctx.strokeStyle = rgba("ink", .8); ctx.lineCap = "round";
    const r = mulberry(101);
    inkBranch(ctx, -30, H * .16, W * .19, .42, 6, 6, r);
    const bloom = clamp01(s.t / 3);                       // 花开过程
    for (const b of s.extra.blossoms){
      const p = clamp01(bloom * 1.6 - b.d * .5);
      if (p > 0) blossom(ctx, b.x, b.y, b.r * p, rgba("cinnabar", .78), rgba("ink", .5));
    }
    for (let i = 0; i < 3; i++){                          // 冰面裂纹消融
      const y = H * (.87 + i * .035);
      ctx.beginPath();
      ctx.moveTo(W * .1, y);
      ctx.lineTo(W * .9, y);
      ctx.strokeStyle = rgba("dai", .12 + .1 * Math.sin(s.t + i));
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }
};

/* —— 02 雨水：雨丝落地，溅起涟漪，浸润大地 —— */
SCENES.yushui = {
  ensure(s, W, H){
    s.extra.drops = Array.from({ length: 180 }, (_, i) => ({
      x: hash1(i * 3.1), p: hash1(i * 7.7), v: .6 + hash1(i * 1.3) * .8
    }));
    s.extra.splashes = [];
  },
  draw(ctx, s, W, H){
    ridge(ctx, W, H, H * .84, H * .07, rgba("dai", .1), 4);
    const wet = clamp01(s.t / 12);                        // 浸润进度
    const g = ctx.createLinearGradient(0, H * .8, 0, H);
    g.addColorStop(0, rgba("dai", 0));
    g.addColorStop(1, rgba("dai", .12 + wet * .14));
    ctx.fillStyle = g;
    ctx.fillRect(0, H * .8, W, H * .2);
    ctx.strokeStyle = rgba("ink", .22);
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (const d of s.extra.drops){
      const y = ((s.t * d.v * .45 + d.p) % 1) * H * .85;
      const x = d.x * W + Math.sin(y * .02) * 4;
      ctx.moveTo(x, y);
      ctx.lineTo(x - 1.5, y + 14 * d.v);
      if (y > H * .83 && s.extra.splashes.length < 40 && hash1(d.x * 91 + Math.floor(s.t * 3)) > .7){
        s.extra.splashes.push({ x, t: 0 });
      }
    }
    ctx.stroke();
    for (let i = s.extra.splashes.length - 1; i >= 0; i--){
      const sp = s.extra.splashes[i];
      sp.t += .03;
      const rr = sp.t * 26;
      ctx.beginPath();
      ctx.ellipse(sp.x, H * .84, rr, rr * .28, 0, 0, TAU);
      ctx.strokeStyle = rgba("dai", .35 * (1 - sp.t));
      ctx.stroke();
      if (sp.t >= 1) s.extra.splashes.splice(i, 1);
    }
  }
};

/* —— 03 惊蛰：春雷乍动，虫群受惊四散 —— */
SCENES.jingzhe = {
  ensure(s, W, H){
    s.extra.bugs = Array.from({ length: 160 }, (_, i) => ({
      x: .5, y: .5, a: hash1(i) * TAU, v: .4 + hash1(i * 2) * .8, w: hash1(i * 5)
    }));
    s.extra.flash = 0;
    s.extra.jolt = 0;
  },
  draw(ctx, s, W, H){
    const cx0 = W * .5, cy0 = H * .42;
    // 雷声：周期性触发
    const cycle = (s.t * .55 + .3) % 6;
    if (cycle < .12 && s.extra.flash <= 0){ s.extra.flash = 1; s.extra.jolt = 1; }
    if (s.extra.flash > 0){
      ctx.fillStyle = rgba("ink", s.extra.flash * .1);
      ctx.fillRect(0, 0, W, H);
      // 闪电折线
      ctx.beginPath();
      ctx.strokeStyle = rgba("ink", s.extra.flash * .9);
      ctx.lineWidth = 2;
      let lx = W * (.45 + hash1(Math.floor(s.t)) * .1), ly = 0;
      ctx.moveTo(lx, ly);
      for (let k = 0; k < 6; k++){
        lx += (hash1(k * 3 + Math.floor(s.t * 7)) - .5) * 60;
        ly += H / 7;
        ctx.lineTo(lx, ly);
      }
      ctx.stroke();
      s.extra.flash -= .05;
    }
    ctx.fillStyle = rgba("ink", .55);
    const m = state.mouse;
    for (const b of s.extra.bugs){
      // 惊扰：雷声或指针靠近时向外奔逃
      let bx = b.x * W, by = b.y * H;
      const dm = m.active ? Math.hypot(bx - m.x, by - m.y) : 9999;
      const scare = s.extra.jolt + clamp01(1 - dm / 200) * .8;
      b.a += (hash1(b.w * 99 + Math.floor(s.t * 8)) - .5) * .5;
      const speed = b.v * (1 + scare * 4);
      const away = Math.atan2(by - cy0, bx - cx0);
      b.x += (Math.cos(b.a) * .3 + Math.cos(away) * scare * .5) * speed * .0016;
      b.y += (Math.sin(b.a) * .3 + Math.sin(away) * scare * .5) * speed * .0016;
      // 边界环绕
      if (b.x < -.02) b.x = 1.02; if (b.x > 1.02) b.x = -.02;
      if (b.y < -.02) b.y = 1.02; if (b.y > 1.02) b.y = -.02;
      ctx.fillRect(bx - 1.4, by - 1.4, 2.8, 2.8);
    }
    s.extra.jolt *= .9;
    ridge(ctx, W, H, H * .9, H * .05, rgba("dai", .1), 6);
  }
};

/* —— 07 立夏：荷池初涨，蜻蜓点水 —— */
SCENES.lixia = {
  ensure(s){ s.extra.rings = []; s.extra.leaves = [{ x: .25, y: .7, r: .13 }, { x: .68, y: .62, r: .09 }, { x: .5, y: .8, r: .11 }]; },
  draw(ctx, s, W, H){
    // 涟漪
    if (s.extra.rings.length < 8 && hash1(Math.floor(s.t * 2)) > .6) s.extra.rings.push({ x: hash1(s.t * 7) * W, y: H * (.6 + hash1(s.t * 3) * .3), t: 0 });
    for (let i = s.extra.rings.length - 1; i >= 0; i--){
      const r = s.extra.rings[i]; r.t += .015;
      ctx.beginPath();
      ctx.ellipse(r.x, r.y, r.t * 90, r.t * 24, 0, 0, TAU);
      ctx.strokeStyle = rgba("dai", .4 * (1 - r.t));
      ctx.lineWidth = 1.2;
      ctx.stroke();
      if (r.t >= 1) s.extra.rings.splice(i, 1);
    }
    // 荷叶
    for (const L of s.extra.leaves){
      const x = L.x * W, y = L.y * H, r = L.r * Math.min(W, H);
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU);
      ctx.fillStyle = rgba("dai", .35); ctx.fill();
      ctx.strokeStyle = rgba("paper", .25); ctx.lineWidth = 1;
      for (let k = 0; k < 8; k++){
        const a = k / 8 * TAU;
        ctx.beginPath(); ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(a) * r * .9, y + Math.sin(a) * r * .9); ctx.stroke();
      }
    }
    // 蜻蜓
    const dx = W * (.55 + Math.sin(s.t * .5) * .1), dy = H * .34 + Math.sin(s.t * 1.3) * 14;
    ctx.strokeStyle = rgba("ink", .7); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(dx - 14, dy); ctx.lineTo(dx + 14, dy); ctx.stroke();
    ctx.lineWidth = 1;
    const wa = Math.sin(s.t * 16) * .5;
    for (const side of [-1, 1]){
      ctx.beginPath();
      ctx.ellipse(dx, dy - 6 * side, 16, 4, side * (0.6 + wa * .2), 0, TAU);
      ctx.strokeStyle = rgba("ink", .35); ctx.stroke();
    }
  }
};

/* —— 08 小满：麦穗灌浆，随风起伏 —— */
SCENES.xiaoman = {
  ensure(s, W, H){
    const n = Math.min(240, Math.floor(W / 6));
    s.extra.stalks = Array.from({ length: n }, (_, i) => ({ x: i / n + hash1(i) * .004, h: .3 + hash1(i * 2) * .16, ph: hash1(i * 3) * TAU }));
  },
  draw(ctx, s, W, H){
    const gy = H * .86;
    for (const st of s.extra.stalks){
      const x = st.x * W;
      const sway = Math.sin(s.t * 1.6 + st.ph + st.x * 6) * 8;
      const top = gy - st.h * H;
      ctx.beginPath();
      ctx.moveTo(x, gy);
      ctx.quadraticCurveTo(x + sway * .4, gy - st.h * H * .5, x + sway, top);
      ctx.strokeStyle = rgba("ink", .4);
      ctx.lineWidth = 1.4;
      ctx.stroke();
      // 麦芒
      for (let k = 0; k < 4; k++){
        const yy = top + k * 5;
        ctx.beginPath();
        ctx.moveTo(x + sway, yy);
        ctx.lineTo(x + sway - 5, yy - 4);
        ctx.moveTo(x + sway, yy);
        ctx.lineTo(x + sway + 5, yy - 4);
        ctx.strokeStyle = rgba("dai", .5);
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
    // 一缕风
    ctx.beginPath();
    ctx.strokeStyle = rgba("ink", .12);
    ctx.lineWidth = 2;
    const wx = ((s.t * .12) % 1.4 - .2) * W;
    ctx.moveTo(wx, H * .3);
    ctx.bezierCurveTo(wx + 80, H * .26, wx + 160, H * .34, wx + 260, H * .3);
    ctx.stroke();
  }
};

/* —— 09 芒种：水田如镜，抢收抢种 —— */
SCENES.mangzhong = {
  ensure(s, W){ s.extra.rows = Math.max(8, Math.floor(W / 90)); },
  draw(ctx, s, W, H){
    const hor = H * .42;
    // 田埂透视线
    ctx.strokeStyle = rgba("dai", .3); ctx.lineWidth = 1;
    for (let i = 0; i <= s.extra.rows; i++){
      const t = i / s.extra.rows;
      ctx.beginPath();
      ctx.moveTo(lerp(-W * .3, W * 1.3, t), H);
      ctx.lineTo(lerp(W * .32, W * .68, t), hor);
      ctx.stroke();
    }
    for (let r = 0; r < 6; r++){
      const y = lerp(hor, H, Math.pow((r + 1) / 7, 1.6));
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y);
      ctx.strokeStyle = rgba("dai", .16); ctx.stroke();
    }
    // 秧苗
    ctx.strokeStyle = rgba("ink", .5); ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (let r = 0; r < 6; r++){
      const y = lerp(hor, H, Math.pow((r + 1) / 7, 1.6));
      const step = 26 + r * 10;
      for (let x = 10; x < W; x += step){
        const sway = Math.sin(s.t * 2 + x * .1) * 2;
        ctx.moveTo(x, y);
        ctx.lineTo(x + sway, y - 8 - r * 2);
        ctx.moveTo(x, y);
        ctx.lineTo(x + sway - 4, y - 6 - r);
        ctx.moveTo(x, y);
        ctx.lineTo(x + sway + 4, y - 6 - r);
      }
    }
    ctx.stroke();
    // 水面反光扫过
    const lx = ((s.t * .1) % 1.6 - .3) * W;
    const lg = ctx.createLinearGradient(lx, 0, lx + W * .2, 0);
    lg.addColorStop(0, rgba("paper", 0)); lg.addColorStop(.5, rgba("paper", .14)); lg.addColorStop(1, rgba("paper", 0));
    ctx.fillStyle = lg;
    ctx.fillRect(0, hor, W, H - hor);
  }
};

/* —— 10 夏至：日长之至，晷影最短 —— */
SCENES.xiazhi = {
  ensure(s){},
  draw(ctx, s, W, H){
    const cx0 = W * .5, cy0 = H * .4, R = Math.min(W, H) * .13;
    // 白昼最长：自中心向外扩散的无数光环
    for (let k = 0; k < 14; k++){
      const rr = R * (1.3 + k * .5) + Math.sin(s.t * .8 + k) * 6;
      ctx.beginPath(); ctx.arc(cx0, cy0, rr, 0, TAU);
      ctx.strokeStyle = rgba("cinnabar", .22 - k * .013);
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    haloDisc(ctx, cx0, cy0, R, rgba("cinnabar", .85), rgba("cinnabar", .16), 0);
    // 日晷：晷针投影缓慢转动
    ctx.beginPath();
    ctx.ellipse(cx0, H * .82, R * 2.2, R * .5, 0, 0, TAU);
    ctx.strokeStyle = rgba("ink", .4); ctx.lineWidth = 2; ctx.stroke();
    const a = -Math.PI / 2 + Math.sin(s.t * .15) * .5;
    ctx.beginPath();
    ctx.moveTo(cx0, H * .82);
    ctx.lineTo(cx0 + Math.cos(a) * R * 2, H * .82 + Math.sin(a) * R * .45);
    ctx.strokeStyle = rgba("ink", .6);
    ctx.stroke();
  }
};

/* —— 11 小暑：温风至，热浪起 —— */
SCENES.xiaoshu = {
  ensure(s){ s.extra.waves = Array.from({ length: 16 }, (_, i) => ({ x: i / 16, sp: .3 + hash1(i) * .4, ph: hash1(i * 7) * TAU })); },
  draw(ctx, s, W, H){
    // 屋檐阴影
    ctx.fillStyle = rgba("ink", .12);
    ctx.beginPath();
    ctx.moveTo(0, H * .12); ctx.lineTo(W * .4, H * .12); ctx.lineTo(W * .34, H * .2); ctx.lineTo(0, H * .2);
    ctx.closePath(); ctx.fill();
    // 上升的热浪（波动半透明竖带）
    for (const wv of s.extra.waves){
      const x = wv.x * W;
      ctx.beginPath();
      for (let y = H; y > H * .2; y -= 12){
        const off = Math.sin(y * .02 + s.t * wv.sp * 4 + wv.ph) * 10;
        if (y === H) ctx.moveTo(x + off, y); else ctx.lineTo(x + off, y);
      }
      ctx.strokeStyle = rgba("ink", .05);
      ctx.lineWidth = 8;
      ctx.stroke();
    }
    // 团扇
    ctx.beginPath();
    ctx.arc(W * .78, H * .5, Math.min(W, H) * .16, 0, TAU);
    ctx.strokeStyle = rgba("ink", .5); ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(W * .78, H * .5 + Math.min(W, H) * .16);
    ctx.lineTo(W * .78, H * .5 + Math.min(W, H) * .3);
    ctx.stroke();
    const rock = Math.sin(s.t * 1.2) * .12;
    ctx.save();
    ctx.translate(W * .78, H * .5);
    ctx.rotate(rock);
    ctx.beginPath(); ctx.arc(0, 0, Math.min(W, H) * .13, 0, TAU);
    ctx.fillStyle = rgba("dai", .12); ctx.fill();
    ctx.restore();
  }
};

/* —— 12 大暑：腐草为萤，星火点点 —— */
SCENES.dashu = {
  ensure(s){
    s.extra.flies = Array.from({ length: 70 }, (_, i) => ({
      x: hash1(i * 1.1), y: .45 + hash1(i * 2.7) * .5, sp: .01 + hash1(i * 3) * .02, ph: hash1(i * 5) * TAU
    }));
    s.extra.grass = Array.from({ length: 120 }, (_, i) => ({ x: i / 120, h: .04 + hash1(i * 9) * .09, ph: hash1(i) * TAU }));
  },
  draw(ctx, s, W, H){
    // 夜色压暗
    ctx.fillStyle = rgba("ink", .1);
    ctx.fillRect(0, 0, W, H);
    // 草丛
    ctx.strokeStyle = rgba("ink", .5); ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (const g of s.extra.grass){
      const x = g.x * W, top = H - g.h * H;
      const sway = Math.sin(s.t * 1.5 + g.ph) * 5;
      ctx.moveTo(x, H);
      ctx.quadraticCurveTo(x + sway * .4, (H + top) / 2, x + sway, top);
    }
    ctx.stroke();
    // 萤火：呼吸的暖光（朱砂系低饱和光点）
    for (const f of s.extra.flies){
      const x = (f.x + Math.sin(s.t * f.sp * 10 + f.ph) * .02) * W;
      const y = (f.y + Math.cos(s.t * f.sp * 8 + f.ph) * .015) * H;
      const pulse = .3 + .7 * (0.5 + 0.5 * Math.sin(s.t * 2 + f.ph * 3));
      ctx.beginPath();
      ctx.arc(x, y, 1.6, 0, TAU);
      ctx.fillStyle = rgba("cinnabar", .75 * pulse);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x, y, 6, 0, TAU);
      ctx.fillStyle = rgba("cinnabar", .1 * pulse);
      ctx.fill();
    }
  }
};

/* —— 13 立秋：一叶知秋，梧叶飘阶 —— */
SCENES.liqiu = {
  ensure(s){
    s.extra.leaves = Array.from({ length: 26 }, (_, i) => ({
      x: hash1(i * 2), p: hash1(i * 4), sp: .06 + hash1(i * 6) * .08, r: 4 + hash1(i * 8) * 7, ph: hash1(i) * TAU
    }));
    s.extra.pile = 0;
  },
  draw(ctx, s, W, H){
    ctx.strokeStyle = rgba("ink", .8); ctx.lineCap = "round";
    const r = mulberry(1313);
    inkBranch(ctx, W + 30, H * .12, -W * .2, .3, 6, 6, r);
    ctx.fillStyle = rgba("ink", .06);
    ctx.fillRect(0, H * .88, W, H * .12);
    for (const L of s.extra.leaves){
      const p = (s.t * L.sp + L.p) % 1;
      const x = L.x * W + Math.sin(p * 9 + L.ph) * 40;
      const y = p * H * .9;
      const rot = p * 6 + L.ph;
      leafShape(ctx, x, y, L.r, L.r * .55, rot, rgba("dai", .5));
      if (p > .97) s.extra.pile = Math.min(40, s.extra.pile + .02);
    }
    // 阶前落叶堆积
    for (let i = 0; i < Math.floor(s.extra.pile); i++){
      leafShape(ctx, hash1(i * 3) * W, H * (.9 + hash1(i * 7) * .07), 6, 3, hash1(i) * TAU, rgba("dai", .35));
    }
  }
};

/* —— 14 处暑：暑气至此而止，云散风起 —— */
SCENES.chushu = {
  ensure(s){ s.extra.stars = Array.from({ length: 40 }, (_, i) => ({ x: hash1(i * 1.3), y: hash1(i * 2.9) * .4, ph: hash1(i) * TAU })); },
  draw(ctx, s, W, H){
    // 暮色横向色带（黛的明度阶梯）
    for (let b = 0; b < 6; b++){
      ctx.fillStyle = rgba("dai", .04 + b * .03);
      ctx.fillRect(0, H * (.35 + b * .1), W, H * .1);
    }
    // 落日半沉
    haloDisc(ctx, W * .5, H * .72, Math.min(W, H) * .07, rgba("cinnabar", .7), rgba("cinnabar", .12), 4);
    ctx.fillStyle = rgba("paper", .5);
    ctx.fillRect(0, H * .72, W, H * .02);
    // 流云被风吹散
    for (let i = 0; i < 5; i++){
      const cx0 = ((s.t * .03 + i * .22) % 1.3 - .15) * W;
      const cy0 = H * (.2 + i * .08);
      ctx.beginPath();
      ctx.ellipse(cx0, cy0, 90 - i * 8, 12, 0, 0, TAU);
      ctx.fillStyle = rgba("paper", .2);
      ctx.fill();
    }
    // 晚星初现
    for (const st of s.extra.stars){
      const a = .15 + .25 * (0.5 + 0.5 * Math.sin(s.t + st.ph));
      ctx.fillStyle = rgba("ink", a);
      ctx.fillRect(st.x * W, st.y * H, 1.6, 1.6);
    }
  }
};

/* —— 15 白露：蒹葭苍苍，露凝而白 —— */
SCENES.bailu = {
  ensure(s){
    s.extra.reeds = Array.from({ length: 60 }, (_, i) => ({
      x: i / 60 + hash1(i) * .01, h: .2 + hash1(i * 3) * .25, ph: hash1(i * 5) * TAU, dew: hash1(i * 7) > .5
    }));
  },
  draw(ctx, s, W, H){
    // 水边薄雾
    const fg = ctx.createLinearGradient(0, H * .55, 0, H);
    fg.addColorStop(0, rgba("dai", .05)); fg.addColorStop(1, rgba("dai", .16));
    ctx.fillStyle = fg; ctx.fillRect(0, H * .55, W, H * .45);
    for (const rd of s.extra.reeds){
      const x = rd.x * W, top = H - rd.h * H;
      const sway = Math.sin(s.t * 1.1 + rd.ph) * 10;
      ctx.beginPath();
      ctx.moveTo(x, H);
      ctx.quadraticCurveTo(x + sway * .3, H - rd.h * H * .6, x + sway, top);
      ctx.strokeStyle = rgba("ink", .5);
      ctx.lineWidth = 1.6;
      ctx.stroke();
      // 芦花
      ctx.beginPath();
      ctx.ellipse(x + sway, top - 8, 3, 10, sway * .02, 0, TAU);
      ctx.fillStyle = rgba("ink", .3);
      ctx.fill();
      // 露珠（纸白高光）
      if (rd.dew){
        const dy = H - rd.h * H * .5;
        ctx.beginPath();
        ctx.arc(x + sway * .4, dy, 2.6, 0, TAU);
        ctx.fillStyle = rgba("paper", .85);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x + sway * .4, dy, 4, 0, TAU);
        ctx.strokeStyle = rgba("dai", .3); ctx.lineWidth = 1; ctx.stroke();
      }
    }
  }
};

/* —— 16 秋分：雷始收声，平分秋色 —— */
SCENES.qiufen = {
  ensure(s){},
  draw(ctx, s, W, H){
    // 与夏至呼应的圆，但转为黛色月轮，象征阴气渐盛
    const cx0 = W * .5, cy0 = H * .38, R = Math.min(W, H) * .12;
    for (let k = 0; k < 10; k++){
      ctx.beginPath(); ctx.arc(cx0, cy0, R * (1.3 + k * .4), 0, TAU);
      ctx.strokeStyle = rgba("dai", .18 - k * .014);
      ctx.lineWidth = 1; ctx.stroke();
    }
    haloDisc(ctx, cx0, cy0, R, rgba("dai", .55), rgba("dai", .14), 0);
    // 天平般的分割线 + 两侧对称的稻穗
    ctx.beginPath();
    ctx.moveTo(W * .08, H * .62); ctx.lineTo(W * .92, H * .62);
    ctx.strokeStyle = rgba("ink", .35); ctx.lineWidth = 1; ctx.stroke();
    ctx.strokeStyle = rgba("ink", .45); ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (const side of [-1, 1]){
      for (let i = 0; i < 14; i++){
        const x = W * .5 + side * (60 + i * 26);
        const sway = Math.sin(s.t * 1.4 + i) * 5;
        ctx.moveTo(x, H * .82);
        ctx.quadraticCurveTo(x + sway, H * .72, x + sway + side * 10, H * .66);
      }
    }
    ctx.stroke();
  }
};

/* —— 17 寒露：菊有黄华，露气寒冷 —— */
SCENES.hanlu = {
  ensure(s){ s.extra.blooms = [{ x: .3, y: .55, r: .09 }, { x: .62, y: .48, r: .07 }, { x: .5, y: .68, r: .055 }]; },
  draw(ctx, s, W, H){
    ridge(ctx, W, H, H * .85, H * .06, rgba("dai", .12), 31);
    for (const b of s.extra.blooms){
      const x = b.x * W, y = b.y * H, r = b.r * Math.min(W, H);
      // 茎
      ctx.beginPath();
      ctx.moveTo(x, H); ctx.quadraticCurveTo(x - 10, (H + y) / 2, x, y);
      ctx.strokeStyle = rgba("ink", .5); ctx.lineWidth = 2; ctx.stroke();
      // 花瓣：放射状笔触
      const open = clamp01(s.t / 4);
      for (let k = 0; k < 22; k++){
        const a = k / 22 * TAU;
        const len = r * (0.6 + hash1(k + b.x * 99) * .4) * open;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
        ctx.strokeStyle = rgba("cinnabar", .55);
        ctx.lineWidth = 1.6;
        ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(x, y, r * .18, 0, TAU);
      ctx.fillStyle = rgba("ink", .6); ctx.fill();
    }
    // 寒露飘落
    ctx.fillStyle = rgba("dai", .3);
    for (let i = 0; i < 24; i++){
      const y = ((s.t * .08 + hash1(i * 3)) % 1) * H;
      ctx.beginPath(); ctx.ellipse(hash1(i) * W, y, 1.4, 2.6, 0, 0, TAU); ctx.fill();
    }
  }
};

/* —— 18 霜降：霜叶红于二月花 —— */
SCENES.shuangjiang = {
  ensure(s){
    s.extra.maples = Array.from({ length: 90 }, (_, i) => ({
      x: hash1(i * 2), p: hash1(i * 5), sp: .04 + hash1(i * 8) * .06, r: 3 + hash1(i * 11) * 5, ph: hash1(i) * TAU
    }));
  },
  draw(ctx, s, W, H){
    ctx.strokeStyle = rgba("ink", .8); ctx.lineCap = "round";
    const r = mulberry(1818);
    inkBranch(ctx, -20, H * .1, W * .22, .5, 7, 6, r);
    inkBranch(ctx, W + 20, H * .18, -W * .18, .42, 6, 5, r);
    // 枫叶点点（朱砂色阶的秋焰）
    for (const L of s.extra.maples){
      const p = (s.t * L.sp + L.p) % 1;
      const x = L.x * W + Math.sin(p * 7 + L.ph) * 50;
      const y = p * H;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(p * 5 + L.ph);
      ctx.fillStyle = rgba("cinnabar", .35 + hash1(L.ph) * .4);
      ctx.beginPath();
      ctx.moveTo(0, -L.r);
      ctx.lineTo(L.r * .9, 0);
      ctx.lineTo(0, L.r * .6);
      ctx.lineTo(-L.r * .9, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    // 地表薄霜
    ctx.strokeStyle = rgba("paper", .4); ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < 80; i++){
      const x = hash1(i * 1.7) * W;
      ctx.moveTo(x, H * .92 + hash1(i) * H * .06);
      ctx.lineTo(x + 6, H * .92 + hash1(i) * H * .06);
    }
    ctx.stroke();
  }
};

/* —— 19 立冬：水始冰，地始冻 —— */
SCENES.lidong = {
  ensure(s){ s.extra.cracks = Array.from({ length: 9 }, (_, i) => ({ x: hash1(i * 3), a: hash1(i * 7) * TAU })); },
  draw(ctx, s, W, H){
    // 枯枝
    ctx.strokeStyle = rgba("ink", .75); ctx.lineCap = "round";
    const r = mulberry(1919);
    inkBranch(ctx, W * .15, -20, H * .18, Math.PI / 2.1, 5, 5, r);
    // 冰面
    ctx.fillStyle = rgba("dai", .1);
    ctx.fillRect(0, H * .72, W, H * .28);
    ctx.strokeStyle = rgba("ink", .35); ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(0, H * .72); ctx.lineTo(W, H * .72); ctx.stroke();
    // 冰裂纹逐渐生长
    const grow = clamp01(s.t / 8);
    ctx.strokeStyle = rgba("dai", .4); ctx.lineWidth = 1;
    for (const c of s.extra.cracks){
      const x0 = c.x * W, y0 = H * (.76 + hash1(c.a) * .18);
      let x = x0, y = y0, a = c.a;
      ctx.beginPath(); ctx.moveTo(x, y);
      for (let k = 0; k < 6 * grow; k++){
        a += (hash1(k + c.x * 99) - .5) * 1.2;
        x += Math.cos(a) * 22; y += Math.sin(a) * 10;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    // 初雪零落
    ctx.fillStyle = rgba("paper", .7);
    for (let i = 0; i < 30; i++){
      const y = ((s.t * .06 + hash1(i * 2)) % 1) * H;
      ctx.beginPath(); ctx.arc(hash1(i) * W + Math.sin(y * .01 + i) * 12, y, 1.6, 0, TAU); ctx.fill();
    }
  }
};

/* —— 20 小雪：虹藏不见，闭塞成冬 —— */
SCENES.xiaoxue = {
  ensure(s){ s.extra.flakes = Array.from({ length: 130 }, (_, i) => ({ x: hash1(i * 1.9), p: hash1(i * 3.7), v: .04 + hash1(i * 2) * .05, r: 1.5 + hash1(i * 6) * 3, six: hash1(i * 9) > .8 })); s.extra.depth = new Float32Array(96); },
  draw(ctx, s, W, H){
    ridge(ctx, W, H, H * .7, H * .12, rgba("dai", .12), 41);
    for (const f of s.extra.flakes){
      const y = ((s.t * f.v + f.p) % 1) * (H * .96);
      const x = (f.x + Math.sin(y * .008 + f.p * 9) * .02) * W;
      if (f.six){
        ctx.strokeStyle = rgba("paper", .8); ctx.lineWidth = 1;
        flakePath(ctx, x, y, f.r * 2);
      } else {
        ctx.beginPath(); ctx.arc(x, y, f.r * .7, 0, TAU);
        ctx.fillStyle = rgba("paper", .75); ctx.fill();
      }
    }
    // 底部薄薄积雪
    const acc = clamp01(s.t / 30) * H * .02;
    ctx.fillStyle = rgba("paper", .55);
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let i = 0; i <= 96; i++){
      ctx.lineTo(i / 96 * W, H - acc - hash1(i * 3) * 6);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
  }
};

/* —— 21 大雪：雪盛也，六角纷飞，逐帧堆积 —— */
SCENES.daxue = {
  ensure(s){
    s.extra.flakes = Array.from({ length: 300 }, (_, i) => ({
      x: hash1(i * 2.1), p: hash1(i * 4.3), v: .06 + hash1(i * 1.7) * .1, r: 2 + hash1(i * 6.9) * 4, six: hash1(i * 9.3) > .55
    }));
    s.extra.depth = new Float32Array(128);       // 积雪高度场
  },
  draw(ctx, s, W, H){
    ridge(ctx, W, H, H * .68, H * .14, rgba("dai", .14), 51);
    const depth = s.extra.depth;
    for (const f of s.extra.flakes){
      const col = Math.floor(f.x * 128) % 128;
      const floorY = H - depth[col];
      const y = ((s.t * f.v + f.p) % 1) * floorY;
      const x = (f.x + Math.sin(y * .006 + f.p * 12) * .03) * W;
      if (y >= floorY - 4){                        // 落地 -> 堆积
        depth[col] = Math.min(H * .22, depth[col] + .12);
        depth[(col + 1) % 128] += .03;
        depth[(col + 127) % 128] += .03;
        continue;
      }
      if (f.six){
        ctx.strokeStyle = rgba("paper", .85); ctx.lineWidth = 1;
        flakePath(ctx, x, y, f.r * 2.2);
      } else {
        ctx.beginPath(); ctx.arc(x, y, f.r * .8, 0, TAU);
        ctx.fillStyle = rgba("paper", .8); ctx.fill();
      }
    }
    // 雪堆轮廓
    ctx.fillStyle = rgba("paper", .7);
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let i = 0; i <= 128; i++) ctx.lineTo(i / 128 * W, H - depth[i % 128]);
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
    // 雪中孤枝
    ctx.strokeStyle = rgba("ink", .6); ctx.lineCap = "round";
    const r = mulberry(2121);
    inkBranch(ctx, W * .82, H - depth[104], -H * .16, -Math.PI / 2.4, 4, 5, r);
  }
};

/* —— 22 冬至：一阳生，夜最长 —— */
SCENES.dongzhi = {
  ensure(s){ s.extra.stars = Array.from({ length: 60 }, (_, i) => ({ x: hash1(i * 1.1), y: hash1(i * 2.3) * .5, ph: hash1(i * 4) * TAU })); },

    }
    // 一弯残月
    ctx.beginPath();
    ctx.arc(W * .72, H * .24, 34, 0, TAU);
    ctx.fillStyle = rgba("paper", .8); ctx.fill();
    ctx.beginPath();
    ctx.arc(W * .72 + 14, H * .24 - 6, 30, 0, TAU);
    ctx.fillStyle = rgba("ink", .85); ctx.fill();

    ctx.strokeStyle = rgba("ink", .8); ctx.lineCap = "round";

    if (open > 0){

      blossom(ctx, W * .16, H * .66, 7 * open, rgba("cinnabar", .7), rgba("ink", .5));
      blossom(ctx, W * .22, H * .72, 6 * open, rgba("cinnabar", .75), rgba("ink", .5));
    }
  }
};

/* —— 23 小寒：鹊始巢，梅先天下春 —— */
SCENES.xiaohan = {
  ensure(s){ s.extra.flakes = Array.from({ length: 90 }, (_, i) => ({ x: hash1(i * 2.7), p: hash1(i * 5.1), v: .05 + hash1(i * 3.3) * .06 })); },
  draw(ctx, s, W, H){
    ctx.strokeStyle = rgba("ink", .85); ctx.lineCap = "round";
    const r = mulberry(2323);
    inkBranch(ctx, W * .12, -20, H * .2, Math.PI / 2.4, 6, 6, r);
    inkBranch(ctx, W + 20, H * .4, -W * .14, -.3, 5, 5, r);
    // 满枝梅花
    const r2 = mulberry(2324);
    for (let i = 0; i < 16; i++){
      const x = W * (.1 + r2() * .8), y = H * (.1 + r2() * .5);

    }

    const bx = W * .62, by = H * .32;
    ctx.fillStyle = rgba("ink", .85);

    ctx.beginPath(); ctx.arc(bx + 14, by - 6, 5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(bx - 14, by + 2); ctx.lineTo(bx - 34, by + 10); ctx.lineTo(bx - 30, by + 2); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = rgba("ink", .7); ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(bx + 18, by - 6); ctx.lineTo(bx + 24, by - 5); ctx.stroke(); // 喙

    for (const f of s.extra.flakes){
      const y = ((s.t * f.v + f.p) % 1) * H;

      ctx.arc(f.x * W + Math.sin(y * .01 + f.p * 8) * 10, y, 1.4, 0, TAU);
      ctx.fill();
    }
  }
};

/* —— 24 大寒：寒之极，春之始 —— */
SCENES.dahan = {
  ensure(s){ s.extra.streaks = Array.from({ length: 220 }, (_, i) => ({ x: hash1(i * 1.4), p: hash1(i * 3.9), v: .35 + hash1(i * 2.2) * .5 })); },
  draw(ctx, s, W, H){
    // 风雪横斜
    ctx.strokeStyle = rgba("paper", .4); ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (const f of s.extra.streaks){
      const y = ((s.t * f.v + f.p) % 1) * H;
      const x = ((f.x + s.t * f.v * .25) % 1.1 - .05) * W;
      ctx.moveTo(x, y); ctx.lineTo(x - 14, y + 18);
    }
    ctx.stroke();
    // 老树独立
    ctx.strokeStyle = rgba("ink", .85); ctx.lineCap = "round";
    const r = mulberry(2424);
    inkBranch(ctx, W * .42, H, H * .34, -Math.PI / 2, 9, 6, r);
    // 枝头一颗红芽：轮回将启
    const bud = clamp01((s.t - 2) / 3);
    if (bud > 0){
      ctx.beginPath();
      ctx.arc(W * .42 + 40, H * .42, 5 * bud, 0, TAU);
      ctx.fillStyle = rgba("cinnabar", .9);

    }

    ctx.fillStyle = rgba("paper", .5);
    ctx.beginPath();

    ctx.lineTo(W, H);
    ctx.closePath();

  }
};
/* ============================================================
 * 【脚本模块 11b】粒子目标形态：每个节气一种构图
 * 返回归一化坐标数组 {x, y, j:抖动像素, live:存活概率}，
 * 场景切换时全体粒子沿插值路径重组为这些形态（要求 7）。
 * ============================================================ */
function sceneTargets(slug){
  const T = [], R = mulberry(9000 + slug.length * 31 + slug.charCodeAt(0) * 7);
  const push = (x, y, j, live) => T.push({ x, y, j: j || 0, live: live === undefined ? 1 : live });
  const N = 2200;
  switch (slug){
    case "lichun":      // 斜出的梅枝弧线 + 零星
      for (let i = 0; i < N; i++){
        if (i % 3 === 0){ const t = R(); push(.05 + t * .5, .18 + t * .3 + Math.sin(t * 9) * .04, 26); }
        else push(R(), R(), 40, .5);
      } break;
    case "yushui":      // 雨幕：竖列、底部渐密
      for (let i = 0; i < N; i++) push(R(), Math.pow(R(), .6), 10);
      break;
    case "jingzhe":     // 自中心向外的惊散环
      for (let i = 0; i < N; i++){
        const a = R() * TAU, r = .1 + Math.pow(R(), .5) * .42;
        push(.5 + Math.cos(a) * r, .44 + Math.sin(a) * r * .8, 14);
      } break;
    case "chunfen":     // 昼夜分界：上下两半、中线密集
      for (let i = 0; i < N; i++){
        if (i % 4 === 0) push(R(), .5 + (R() - .5) * .03, 4);
        else push(R(), R() < .5 ? R() * .46 : .54 + R() * .46, 20);
      } break;
    case "qingming":    // 斜向雨带
      for (let i = 0; i < N; i++){
        const t = R();
        push(t, t * .7 + .12 + (R() - .5) * .16, 12);
      } break;
    case "guyu":        // 茶垄四行
      for (let i = 0; i < N; i++){
        const row = Math.floor(R() * 4);
        push(R(), .72 + row * .07 + (R() - .5) * .03, 8);
      } break;
    case "lixia":       // 荷池圆环
      for (let i = 0; i < N; i++){
        if (i % 3 === 0){ const a = R() * TAU; push(.5 + Math.cos(a) * .3, .6 + Math.sin(a) * .2, 12); }
        else push(.5 + (R() - .5) * .5, .6 + (R() - .5) * .34, 30, .6);
      } break;
    case "xiaoman":     // 麦秆列：底对齐的竖线
      for (let i = 0; i < N; i++){
        const x = Math.floor(R() * 90) / 90;
        push(x, .56 + R() * .3, 6);
      } break;
    case "mangzhong":   // 透视田埂：汇聚线
      for (let i = 0; i < N; i++){
        const t = R(), k = R();
        push(lerp(lerp(-.3, 1.3, t), lerp(.32, .68, t), k), lerp(1, .42, k), 8);
      } break;
    case "xiazhi":      // 同心光环
      for (let i = 0; i < N; i++){
        const a = R() * TAU, ring = Math.floor(R() * 6);
        const r = .12 + ring * .09 + (R() - .5) * .02;
        push(.5 + Math.cos(a) * r, .4 + Math.sin(a) * r * .8, 4);
      } break;
    case "xiaoshu":     // 热浪升腾柱
      for (let i = 0; i < N; i++){
        const col = Math.floor(R() * 16) / 16;
        push(col + .03, Math.pow(R(), .8), 12);
      } break;
    case "dashu":       // 萤火低空带
      for (let i = 0; i < N; i++) push(R(), .55 + Math.pow(R(), 1.4) * .44, 24, .85);
      break;
    case "liqiu":       // 三条飘落轨迹
      for (let i = 0; i < N; i++){
        const t = R(), band = Math.floor(R() * 3);
        push(t, t * .8 + .08 + band * .05 + Math.sin(t * 7 + band) * .05, 16);
      } break;
    case "chushu":      // 三道云带
      for (let i = 0; i < N; i++){
        const band = Math.floor(R() * 3);
        push(R(), .2 + band * .1 + (R() - .5) * .04, 14);
      } break;
    case "bailu":       // 芦苇竖笔
      for (let i = 0; i < N; i++){
        const x = Math.floor(R() * 60) / 60;
        push(x, .58 + R() * .42, 5);
      } break;
    case "qiufen":      // 左右对称穗列
      for (let i = 0; i < N; i++){
        const side = R() < .5 ? -1 : 1;
        push(.5 + side * (.08 + R() * .4), .66 + R() * .18, 10);
      } break;
    case "hanlu":       // 菊花放射
      for (let i = 0; i < N; i++){
        const spoke = Math.floor(R() * 22) / 22 * TAU;
        const r = R() * .16;
        push(.45 + Math.cos(spoke) * r * 1.4, .55 + Math.sin(spoke) * r, 8);
      } break;
    case "shuangjiang": // 枫冠两团
      for (let i = 0; i < N; i++){
        const a = R() * TAU, r = Math.pow(R(), .6) * .2;
        const cx = i % 2 ? .3 : .7, cy = i % 2 ? .3 : .26;
        push(cx + Math.cos(a) * r * 1.3, cy + Math.sin(a) * r, 18, .9);
      } break;
    case "lidong":      // 冰面裂纹横线
      for (let i = 0; i < N; i++){
        const line = Math.floor(R() * 3);
        push(R(), .76 + line * .07 + (R() - .5) * .015, 4);
      } break;
    case "xiaoxue":     // 疏雪匀落
      for (let i = 0; i < N; i++) push(R(), R(), 30, .55);
      break;
    case "daxue":       // 密雪 + 底部雪堆
      for (let i = 0; i < N; i++){
        if (i % 5 === 0) push(R(), .92 + R() * .07, 10);
        else push(R(), R() * .92, 18);
      } break;
    case "dongzhi":     // 残月弧 + 满天星
      for (let i = 0; i < N; i++){
        if (i % 4 === 0){ const a = R() * TAU; push(.72 + Math.cos(a) * .07, .24 + Math.sin(a) * .07, 3); }
        else push(R(), R() * .55, 16, .8);
      } break;
    case "xiaohan":     // 斜枝梅簇
      for (let i = 0; i < N; i++){
        if (i % 3 === 0){ const t = R(); push(.1 + t * .44, .12 + t * .5, 22); }
        else push(R(), R(), 36, .6);
      } break;
    case "dahan":       // 风雪中一树：中心密、四周疏
      for (let i = 0; i < N; i++){
        const a = R() * TAU, r = Math.pow(R(), 2.2) * .5;
        push(.5 + Math.cos(a) * r, .55 + Math.sin(a) * r * .9, 12);
      } break;
    default:
      for (let i = 0; i < N; i++) push(R(), R(), 20);
  }
  return T;
}

/* ============================================================
 * 【脚本模块 12】Web Audio 环境音景（零音频文件，全实时合成）
 * 每个声部带 50ms+ 的起音包络，切换时用等功率交叉淡化，
 * 不产生爆音；AudioContext 在用户首次开启声音时才创建。
 * ============================================================ */
const sound = {
  on: false, ctx: null, master: null,
  voice: null,                          // 当前节气声部
  cfg: null,                            // 当前声部配置（用于 morph）
  season: -1,                           // 已构建的季节声部（-1 未构建）
  seasonNodes: [],
};
/* 各季节的基础声部配方（滤波噪声 + 可选的低频嗡鸣） */
const SEASON_AUDIO = [
  { base: 600, q: .8, gain: .16, hum: 0 },                       // 春：轻柔
  { base: 950, q: 1.2, gain: .22, hum: 82 },                     // 夏：蝉底嗡鸣
  { base: 430, q: .6, gain: .15, hum: 55 },                      // 秋：风过疏林
  { base: 300, q: .5, gain: .12, hum: 40 },                      // 冬：空旷低鸣
];
/* 节气特征层（叠加在季节基底之上，形成 24 种不同音色） */
const SOUND_CFG = DATA.map((d, i) => {
  const base = {
    lichun:[700,.7,.14], yushui:[2400,3,.18], jingzhe:[800,1,.16], chunfen:[1500,2,.12],
    qingming:[1800,2.5,.15], guyu:[2200,3,.17], lixia:[2600,2,.13], xiaoman:[1200,1.5,.12],
    mangzhong:[1000,1.2,.14], xiazhi:[1600,2,.13], xiaoshu:[1300,1.5,.13], dashu:[900,1,.15],
    liqiu:[600,.8,.14], chushu:[700,.9,.13], bailu:[1100,1.4,.12], qiufen:[950,1.2,.12],
    hanlu:[850,1.1,.13], shuangjiang:[520,.7,.14], lidong:[380,.6,.13], xiaoxue:[450,.7,.12],
    daxue:[500,.8,.13], dongzhi:[260,.4,.15], xiaohan:[330,.5,.14], dahan:[280,.45,.16],
  }[d.slug];
  return {
    layer: { f: base[0], q: base[1], g: base[2] },
    hum: { f: 50 + i * 3, g: .05 },
    chirp: d.slug === "jingzhe" || d.slug === "guyu" ? .5 : 0,     // 虫鸣脉冲
    drip: d.slug === "yushui" ? .8 : (d.slug === "qingming" ? .5 : 0), // 滴答
    wind: (d.season === "winter" || d.season === "autumn") ? .8 : 0,   // 风啸
  };
});

function ensureAudio(){
  if (sound.ctx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  sound.ctx = new AC();
  sound.master = sound.ctx.createGain();
  sound.master.gain.value = 0;
  sound.master.connect(sound.ctx.destination);
  // 共享噪声源（所有声部共用一个缓冲，节省内存）
  const buf = sound.ctx.createBuffer(1, sound.ctx.sampleRate * 2, sound.ctx.sampleRate);
  const ch = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < ch.length; i++){          // 粉噪声近似（低通白噪声）
    last = last * .97 + (Math.random() * 2 - 1) * .03;
    ch[i] = last * 3;
  }
  sound.noiseBuf = buf;
}
function noiseSource(){
  const src = sound.ctx.createBufferSource();
  src.buffer = sound.noiseBuf;
  src.loop = true;
  return src;
}
/* 构建某个节气的完整声部（返回可淡出的节点集合） */
function buildVoice(i){
  const c = SOUND_CFG[i];
  const sea = SEASON_AUDIO[SEASON_IDX[DATA[i].season]];
  const ac = sound.ctx, t = ac.currentTime;
  const out = ac.createGain();
  out.gain.value = 0;
  out.connect(sound.master);
  const nodes = [];
  // 季节基底：滤波噪声
  const n1 = noiseSource();
  const f1 = ac.createBiquadFilter();
  f1.type = "bandpass"; f1.frequency.value = sea.base; f1.Q.value = sea.q;
  const g1 = ac.createGain(); g1.gain.value = sea.gain * .5;
  n1.connect(f1).connect(g1).connect(out);
  n1.start();
  nodes.push(n1);
  // 节气特征层：另一段不同中心频率的滤波噪声
  const n2 = noiseSource();
  const f2 = ac.createBiquadFilter();
  f2.type = "bandpass"; f2.frequency.value = c.layer.f; f2.Q.value = c.layer.q;
  const g2 = ac.createGain(); g2.gain.value = c.layer.g * .6;
  n2.connect(f2).connect(g2).connect(out);
  n2.start();
  nodes.push(n2);
  // 低频嗡鸣（部分节气，频率随节气变化，拉开音色差异）
  if (sea.hum > 0 || c.hum.g > 0){
    const o = ac.createOscillator();
    o.type = "sine";
    o.frequency.value = sea.hum > 0 ? sea.hum : c.hum.f;
    const og = ac.createGain(); og.gain.value = .03;
    o.connect(og).connect(out);
    o.start();
    nodes.push(o);
  }
  // 风的呼吸（LFO 调制基底的音量）
  const lfo = ac.createOscillator();
  lfo.frequency.value = .08 + c.wind * .1;
  const lg = ac.createGain();
  lg.gain.value = sea.gain * .25;
  lfo.connect(lg).connect(g1.gain);
  lfo.start();
  nodes.push(lfo);
  // 淡入（>60ms，避免爆音）
  out.gain.setValueAtTime(0, t);
  out.gain.linearRampToValueAtTime(1, t + .4);
  return { out, nodes, cfg: c };
}
/* 切换到目标节气的声部：等功率交叉淡化 */
function crossfadeVoice(i){
  if (!sound.ctx || !sound.on) return;
  const old = sound.voice;
  const t = sound.ctx.currentTime;
  const nv = buildVoice(i);
  sound.voice = nv;
  if (old){
    old.out.gain.cancelScheduledValues(t);
    old.out.gain.setValueAtTime(old.out.gain.value, t);
    old.out.gain.linearRampToValueAtTime(0, t + .6);
    setTimeout(() => {                          // 淡完后彻底停止并断开（无爆音）
      old.nodes.forEach(n => { try { n.stop(); } catch (e) {} });
      old.out.disconnect();
    }, 700);
  }
}
/* 事件音：滴答 / 虫鸣（短促包络，随节气概率触发） */
function tickBlips(){
  if (!sound.on || !sound.voice) return;
  const ac = sound.ctx, cfg = sound.voice.cfg, t = ac.currentTime;
  if (cfg.drip && Math.random() < cfg.drip * .02){
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(900 + Math.random() * 600, t);
    o.frequency.exponentialRampToValueAtTime(300, t + .08);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.06, t + .005);
    g.gain.exponentialRampToValueAtTime(.0001, t + .12);
    o.connect(g).connect(sound.master);
    o.start(t); o.stop(t + .15);
  }
  if (cfg.chirp && Math.random() < cfg.chirp * .015){
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(2400 + Math.random() * 800, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.03, t + .01);
    g.gain.exponentialRampToValueAtTime(.0001, t + .1);
    o.connect(g).connect(sound.master);
    o.start(t); o.stop(t + .12);
  }
}
/* 声音总开关 */
$("#btnSound").addEventListener("click", () => {
  ensureAudio();
  const ac = sound.ctx;
  if (!sound.on){
    if (ac.state === "suspended") ac.resume();
    sound.on = true;
    crossfadeVoice(state.active);
    ac.currentTime >= 0 && sound.master.gain.setTargetAtTime(.9, ac.currentTime, .25);
  } else {
    sound.on = false;
    sound.master.gain.setTargetAtTime(0, ac.currentTime, .2);
    const v = sound.voice;
    setTimeout(() => {
      if (v && !sound.on){
        v.nodes.forEach(n => { try { n.stop(); } catch (e) {} });
        v.out.disconnect();
        sound.voice = null;
      }
    }, 800);
  }
  const btn = $("#btnSound");
  btn.setAttribute("aria-pressed", String(sound.on));
  btn.setAttribute("aria-label", sound.on ? "环境音：已开启" : "环境音：已关闭");
});

/* ============================================================
 * 【脚本模块 13】交互系统：滚动 / 键盘 / hash / 横滑惯性
 * ============================================================ */
const sections = [];          // { el, top, height }
let activeIndex = -1;

function goTo(i, viaHash){
  i = clamp(i, 0, 23);
  const sec = sections[i];
  if (!sec) return;
  window.scrollTo({ top: sec.top, behavior: reduceMQ.matches ? "auto" : "smooth" });
  if (!viaHash) history.replaceState(null, "", "#" + DATA[i].slug);
}
/* 激活节气：驱动场景 morph、进度轨、读屏播报、声音切换 */
function setActive(i, silentHash){
  if (i === activeIndex) return;
  const prev = activeIndex;
  activeIndex = i;
  state.prevIdx = prev;
  state.morphT = 0;                               // 触发粒子整体重组
  sceneStates[i].t = prev === i ? sceneStates[i].t : 0;
  sections.forEach((s, k) => s.el.classList.toggle("active", k === i));
  document.querySelectorAll("#rail .dot").forEach(d =>
    d.setAttribute("aria-current", String(+d.dataset.i === i)));
  document.querySelectorAll("#stripTrack .card").forEach(c =>
    c.setAttribute("aria-current", String(+c.dataset.i === i)));
  stripCenterCard(i);
  const d = DATA[i];
  announce(cnNum(i + 1) + "：" + d.name + "，" + d.pin + "，" + d.dates);
  if (!silentHash) history.replaceState(null, "", "#" + d.slug);
  if (sound.on) crossfadeVoice(i);
  if (staticMode) renderStatic();               // 降级模式下切换节气时重绘静态构图
}

/* —— 纵向滚动：IntersectionObserver 定位当前节气 —— */
/* ioArmed：load 事件前不接受 IO 联动。浏览器对未匹配锚点的 fragment（如
   #lixia）会在文档就绪时执行“回到顶部”，可能覆盖 boot 阶段的 hash 定位
   并把第一屏误报为激活；load 后重放定位再放行即可稳定（需求 8）。 */
let ioArmed = false;
const io = new IntersectionObserver(entries => {
  if (!ioArmed) return;
  for (const e of entries){
    if (e.isIntersecting){
      setActive(+e.target.dataset.i, false);
    }
  }
}, { threshold: .55 });

/* —— 键盘 ← → 切换 —— */
window.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === "ArrowDown"){
    e.preventDefault(); goTo(activeIndex + 1);
  } else if (e.key === "ArrowLeft" || e.key === "ArrowUp"){
    e.preventDefault(); goTo(activeIndex - 1);
  } else if (e.key === "Home"){
    e.preventDefault(); goTo(0);
  } else if (e.key === "End"){
    e.preventDefault(); goTo(23);
  }
});

/* —— hash 定位（刷新后恢复位置） —— */
function applyHash(){
  const slug = decodeURIComponent(location.hash.slice(1));
  const idx = DATA.findIndex(d => d.slug === slug);
  if (idx >= 0){
    const sec = sections[idx];
    window.scrollTo({ top: sec.top, behavior: "auto" });
    setActive(idx, true);
    return true;
  }
  return false;
}
window.addEventListener("hashchange", () => applyHash());

/* —— 进度轨点击 —— */
$("#rail").addEventListener("click", e => {
  const b = e.target.closest(".dot");
  if (b) goTo(+b.dataset.i);
});

/* —— 底部横滑列表：自实现惯性衰减 + 边缘回弹（无物理库） —— */
const strip = {
  track: null, x: 0, vx: 0, dragging: false,
  lastX: 0, lastT: 0, min: 0, max: 0, raf: 0,
};
function stripMeasure(){
  strip.track = $("#stripTrack");
  const content = strip.track.scrollWidth;
  strip.min = Math.min(0, W - content - 32);   // 右边缘
  strip.max = 0;                                // 左边缘
}
function stripApply(){
  strip.track.style.transform = "translate3d(" + strip.x + "px,0,0)";
}
function stripCenterCard(i){
  if (!strip.track) return;
  const card = strip.track.children[i];
  if (!card) return;
  const target = clamp(-(card.offsetLeft - (W - card.offsetWidth) / 2), strip.min, strip.max);
  strip.x = target;
  strip.vx = 0;
  stripApply();
}
function stripTick(){
  if (strip.dragging) return;
  let moving = false;
  if (Math.abs(strip.vx) > .06){                 // 惯性衰减
    strip.x += strip.vx;
    strip.vx *= .94;
    moving = true;
  }
  // 边缘回弹（弹簧）
  if (strip.x > strip.max){
    strip.x += (strip.max - strip.x) * .12;
    strip.vx = 0;
    if (Math.abs(strip.max - strip.x) > .4) moving = true; else strip.x = strip.max;
  } else if (strip.x < strip.min){
    strip.x += (strip.min - strip.x) * .12;
    strip.vx = 0;
    if (Math.abs(strip.min - strip.x) > .4) moving = true; else strip.x = strip.min;
  }
  stripApply();
  if (moving) strip.raf = requestAnimationFrame(stripTick);
  else strip.raf = 0;
}
function stripKick(){
  if (!strip.raf) strip.raf = requestAnimationFrame(stripTick);
}
function bindStrip(){
  const track = $("#stripTrack");
  let startX = 0, moved = false;
  const down = e => {
    if (reduceMQ.matches) return;
    strip.dragging = true; moved = false;
    track.classList.add("dragging");
    strip.lastX = startX = (e.touches ? e.touches[0].clientX : e.clientX);
    strip.lastT = performance.now();
    strip.vx = 0;
    if (strip.raf){ cancelAnimationFrame(strip.raf); strip.raf = 0; }
  };
  const move = e => {
    if (!strip.dragging) return;
    const x = (e.touches ? e.touches[0].clientX : e.clientX);
    const dx = x - strip.lastX;
    if (Math.abs(x - startX) > 6) moved = true;
    strip.x += dx;
    // 越界时的橡皮筋阻尼
    if (strip.x > strip.max) strip.x = strip.max + (strip.x - strip.max) * .35;
    if (strip.x < strip.min) strip.x = strip.min + (strip.x - strip.min) * .35;
    const now = performance.now();
    const dt = Math.max(now - strip.lastT, 1);
    strip.vx = strip.vx * .5 + (dx / dt * 16) * .5;   // 速度平滑采样
    strip.lastX = x; strip.lastT = now;
    stripApply();
  };
  const up = e => {
    if (!strip.dragging) return;
    strip.dragging = false;
    track.classList.remove("dragging");
    const x = (e.changedTouches ? e.changedTouches[0].clientX : e.clientX);
    if (!moved){                                    // 点击节气牌 -> 跳转
      const card = e.target.closest(".card");
      if (card) goTo(+card.dataset.i);
    } else {
      stripKick();                                  // 释放后惯性滑行 + 回弹
    }
  };
  track.addEventListener("mousedown", down);
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
  track.addEventListener("touchstart", down, { passive: true });
  track.addEventListener("touchmove", move, { passive: true });
  track.addEventListener("touchend", up);
}

/* —— 指针位置（用于粒子场扰动与惊蛰虫群） —— */
window.addEventListener("pointermove", e => {
  state.mouse.x = e.clientX;
  state.mouse.y = e.clientY;
  state.mouse.active = true;
}, { passive: true });
window.addEventListener("pointerleave", () => { state.mouse.active = false; });

/* ============================================================
 * 【脚本模块 14】渲染主循环
 * ============================================================ */
const field = new ParticleField();
const sceneStates = {};                            // 每个场景的运行时状态 { t, r, extra }

function initSceneStates(){
  DATA.forEach((d, i) => {
    sceneStates[i] = { t: 0, r: mulberry(1000 + i * 137), extra: {} };
  });
}
let lastFrame = 0, frameCount = 0;

function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min((now - lastFrame) / 1000, .05) || .016;
  lastFrame = now;
  perfWatch(dt);
  tickPalette();
  if (PAL.moving) seasonDirty = true;             // 主题过渡结束后重绘一次季节底景
  else if (seasonDirty && seasonLayer){           // 只重绘，不销毁画布
    paintSeasonBase(seasonLayer.canvas.getContext("2d"), seasonLayer.season, seasonLayer.w, seasonLayer.h, mulberry(seasonLayer.season * 777 + 5));
    seasonDirty = false;
  }

  state.time = now;
  // 检测是否需要启动一次整体重组（先于 morphT 推进，避免错过 0 时刻）
  if (state.morphT === 0){
    const targets = sceneTargets(DATA[state.active].slug);
    for (let i = 0; i < field.count; i++) field.retarget(i, targets, W, H);
  }
  if (state.morphT < 1) state.morphT = Math.min(1, state.morphT + dt * 1000 / state.morphDur);

  // 当前场景时间推进
  const sc = sceneStates[state.active];
  sc.t += dt;
  const def = SCENES[DATA[state.active].scene];
  if (def && def.ensure && !sc.ensured){
    def.ensure(sc, W, H);
    sc.ensured = true;
  }
  field.update(dt, state.morphT, W, H);

  // 绘制
  ctx.fillStyle = rgba("paper", 1);
  ctx.fillRect(0, 0, W, H);
  // 季节底景（SEASON_IDX 转数字索引，与 paintSeasonBase 的 0–3 分支对应）
  const season = SEASON_IDX[DATA[state.active].season];
  const layer = ensureSeasonLayer(season);
  ctx.globalAlpha = .9;
  ctx.drawImage(layer.canvas, 0, 0, W, H);
  ctx.globalAlpha = 1;
  // 场景主体
  if (def && def.draw){
    ctx.save();
    def.draw(ctx, sc, W, H);
    ctx.restore();
  }
  // 粒子场
  field.draw(ctx, state.morphT);
  // 暗角
  drawVignette(ctx, W, H);

  // 进度游标
  frameCount++;
  if (frameCount % 6 === 0) updateRailThumb();
  if (frameCount % 20 === 0) tickBlips();
}

function updateRailThumb(){
  const rail = $("#rail");
  const thumb = $("#railThumb");
  const dots = rail.querySelectorAll(".dot");
  if (!dots.length) return;
  const active = dots[activeIndex] || dots[0];
  thumb.style.top = (active.offsetTop + active.offsetHeight / 2) + "px";
}

/* ============================================================
 * 【脚本模块 15】降级静态模式（prefers-reduced-motion）
 * 粒子静止于目标位，场景以固定时刻构图；仍保留滚动与切换。
 * ============================================================ */
let staticMode = false;
function renderStatic(){
  staticMode = true;
  // 场景时间固定为一个有代表性的时刻
  Object.keys(sceneStates).forEach(k => { sceneStates[k].t = 6; });
  // 粒子铺成网格微噪声构图
  for (let i = 0; i < field.count; i++){
    const gx = (i % 60) / 60, gy = Math.floor(i / 60) / Math.ceil(field.count / 60);
    field.px[i] = gx * W + field.sd[i] * 30;
    field.py[i] = gy * H + field.sd[(i + 1) % field.count] * 30;
    field.tx[i] = field.px[i]; field.ty[i] = field.py[i];
    field.vx[i] = 0; field.vy[i] = 0;
  }
  // 单帧合成
  state.morphT = 1;
  ctx.fillStyle = rgba("paper", 1);
  ctx.fillRect(0, 0, W, H);
  const layer = ensureSeasonLayer(SEASON_IDX[DATA[state.active].season]);
  ctx.drawImage(layer.canvas, 0, 0, W, H);
  const def = SCENES[DATA[state.active].scene];
  const sc = sceneStates[state.active];
  if (def.ensure && !sc.ensured){ def.ensure(sc, W, H); sc.ensured = true; }
  if (def.draw) def.draw(ctx, sc, W, H);
  field.draw(ctx, 1);
  drawVignette(ctx, W, H);
}
/* 静态模式下的轻量帧循环：仅主题过渡时重绘 */
function staticFrame(){
  if (!staticMode) return;
  requestAnimationFrame(staticFrame);
  if (PAL.moving){
    tickPalette();
    renderStatic();
  }
}
reduceMQ.addEventListener("change", e => {
  staticMode = e.matches;
  if (staticMode) renderStatic();
});

/* ============================================================
 * 【脚本模块 16】窗口变化与资源回收
 * ============================================================ */
let resizeTimer = 0;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    resize();
    measureSections();
    stripMeasure();
    strip.x = clamp(strip.x, strip.min, strip.max);
    stripApply();
    Object.keys(sceneStates).forEach(k => { sceneStates[k].ensured = false; });
    if (staticMode) renderStatic();
  }, 150);
});

function measureSections(){
  sections.length = 0;
  document.querySelectorAll(".scene").forEach(el => {
    sections.push({ el, top: el.offsetTop, height: el.offsetHeight });
    io.observe(el);
  });
}

/* 页面隐藏时暂停声音，避免后台空耗 */
document.addEventListener("visibilitychange", () => {
  if (!sound.ctx) return;
  if (document.hidden && sound.on) sound.ctx.suspend();
  else if (!document.hidden && sound.on) sound.ctx.resume();
});

/* ============================================================
 * 【脚本模块 17】启动
 * ============================================================ */
function boot(){
  buildDOM();
  initSceneStates();
  resize();
  measureSections();
  stripMeasure();
  bindStrip();
  applyTheme(themeName);
  const fromHash = applyHash();
  if (!fromHash) setActive(0, true);
  /* load 后重放 hash 定位并放行 IO：对抗浏览器 fragment 默认滚顶行为的竞态 */
  window.addEventListener("load", () => { applyHash(); ioArmed = true; });
  if (reduceMQ.matches){
    renderStatic();
    requestAnimationFrame(staticFrame);
  } else {
    requestAnimationFrame(t => { lastFrame = t; requestAnimationFrame(frame); });
  }
}
boot();
