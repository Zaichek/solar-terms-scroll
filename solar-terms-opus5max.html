<!DOCTYPE html>
<html lang="zh-CN" data-boot="1">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="时间的形状 · 二十四节气数字长卷：一个零依赖、程序化生成的单页交互式数字博物馆。">
<meta name="color-scheme" content="light dark">
<title>时间的形状 · 二十四节气数字长卷</title>

<style>
/* ==========================================================================
   模块 A：色板与主题变量（宣纸白 / 墨黑 / 朱砂红 / 黛蓝 及其衍生色阶）
   ========================================================================== */
:root{
  /* 基准四色 */
  --paper:#F5F1E8;      /* 宣纸白 */
  --ink:#1A1A1A;        /* 墨黑   */
  --cinnabar:#C0392B;   /* 朱砂红 */
  --indigo:#2C3E50;     /* 黛蓝   */
  /* 衍生色阶 */
  --paper-2:#EFE9DC;
  --paper-3:#E4DCC9;
  --ink-2:#2B2B2B;

  --bg:var(--paper);
  --fg:var(--ink);
  --muted:rgba(26,26,26,.64);
  --faint:rgba(26,26,26,.40);
  --hair:rgba(26,26,26,.16);
  --hair-2:rgba(26,26,26,.08);
  --panel:rgba(245,241,232,.74);
  --accent:var(--cinnabar);
  --cool:var(--indigo);
  --u:8px;                       /* 8pt 网格基准 */
  --serif:"Songti SC","STSong","Source Han Serif SC","Noto Serif SC","SimSun","Times New Roman",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",system-ui,-apple-system,sans-serif;
}
/* 无脚本时也遵循系统深色偏好 */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141414; --fg:#F5F1E8;
    --muted:rgba(245,241,232,.66); --faint:rgba(245,241,232,.38);
    --hair:rgba(245,241,232,.18); --hair-2:rgba(245,241,232,.09);
    --panel:rgba(20,20,20,.68);
    --accent:#D45A44; --cool:#7E9BB8;
  }
}
[data-theme="dark"]{
  --bg:#141414; --fg:#F5F1E8;
  --muted:rgba(245,241,232,.66); --faint:rgba(245,241,232,.38);
  --hair:rgba(245,241,232,.18); --hair-2:rgba(245,241,232,.09);
  --panel:rgba(20,20,20,.68);
  --accent:#D45A44; --cool:#7E9BB8;
}
[data-theme="light"]{
  --bg:var(--paper); --fg:var(--ink);
  --muted:rgba(26,26,26,.64); --faint:rgba(26,26,26,.40);
  --hair:rgba(26,26,26,.16); --hair-2:rgba(26,26,26,.08);
  --panel:rgba(245,241,232,.74);
  --accent:var(--cinnabar); --cool:var(--indigo);
}

/* ==========================================================================
   模块 B：基础重置与排版
   ========================================================================== */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
html{
  scrollbar-width:none;                       /* 隐藏原生滚动条，改用自绘进度指示 */
  -ms-overflow-style:none;
  scroll-behavior:auto;
}
html::-webkit-scrollbar{ width:0; height:0; display:none; }
body{
  background:var(--bg);
  color:var(--fg);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.7;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  transition:background-color .65s ease, color .65s ease;
}
h1,h2,h3,p,figure,blockquote{ margin:0; }
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
.sr-only,.sr-doc{
  position:absolute; width:1px; height:1px; margin:-1px; padding:0;
  overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0;
}
.skip{
  position:fixed; left:calc(var(--u)*2); top:-100px; z-index:99;
  background:var(--bg); color:var(--fg); border:1px solid var(--hair);
  padding:calc(var(--u)*1.5) calc(var(--u)*2); font-size:13px; letter-spacing:.1em;
  transition:top .25s ease;
}
.skip:focus{ top:calc(var(--u)*2); }

/* ==========================================================================
   模块 C：舞台（Canvas 生成式画面 + 宣纸肌理 + 巨型节气字）
   ========================================================================== */
#stage{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
#ink{ display:block; width:100%; height:100%; }
#grain{
  position:absolute; inset:0; mix-blend-mode:multiply; opacity:.5;
  background:
    repeating-linear-gradient(97deg, rgba(26,26,26,.020) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(7deg,  rgba(26,26,26,.016) 0 1px, transparent 1px 4px),
    radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(26,26,26,.14) 100%);
}
[data-theme="dark"] #grain{ mix-blend-mode:screen; opacity:.35;
  background:
    repeating-linear-gradient(97deg, rgba(245,241,232,.020) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(7deg,  rgba(245,241,232,.014) 0 1px, transparent 1px 4px),
    radial-gradient(120% 90% at 50% 45%, transparent 52%, rgba(0,0,0,.5) 100%);
}
#glyph{
  position:absolute; right:2vw; bottom:8vh; line-height:.78;
  font-family:var(--serif); font-size:min(42vw,46vh); color:var(--fg);
  opacity:.055; letter-spacing:-.04em; user-select:none;
  writing-mode:vertical-rl; text-orientation:upright;
  transition:opacity .8s ease;
}
#glyph span{ display:block; transition:transform .9s cubic-bezier(.22,1,.36,1), opacity .5s ease; }

/* ==========================================================================
   模块 D：顶部展标与控制按钮
   ========================================================================== */
#topbar{
  position:fixed; top:0; left:0; right:0; z-index:20;
  display:flex; align-items:flex-start; justify-content:space-between; gap:calc(var(--u)*2);
  padding:calc(var(--u)*3) calc(var(--u)*4);
}
.brand{ display:flex; gap:calc(var(--u)*2); align-items:flex-start; }
.seal{ width:40px; height:40px; flex:0 0 auto; }
.brand h1{
  font-family:var(--serif); font-weight:600; letter-spacing:.22em;
  font-size:clamp(17px,2vw,23px); line-height:1.4;
}
.brand .sub{
  font-size:clamp(10px,1vw,11.5px); letter-spacing:.18em; color:var(--muted);
  text-transform:uppercase; margin-top:2px;
}
.tools{ display:flex; gap:var(--u); }
.ctrl{
  width:40px; height:40px; display:grid; place-items:center;
  border:1px solid var(--hair); background:var(--panel);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  transition:border-color .3s ease, background-color .3s ease, transform .3s ease;
}
.ctrl:hover{ border-color:var(--accent); transform:translateY(-1px); }
.ctrl svg{ width:20px; height:20px; }
.ctrl[aria-pressed="true"]{ border-color:var(--accent); }
.ctrl .on{ display:none; } .ctrl[aria-pressed="true"] .on{ display:block; }
.ctrl[aria-pressed="true"] .off{ display:none; }

/* ==========================================================================
   模块 E：博物馆展签（固定信息面板）
   ========================================================================== */
#label{
  position:fixed; z-index:15; left:calc(var(--u)*4); top:50%; transform:translateY(-50%);
  width:min(40vw,440px); pointer-events:none;
}
#label .card{ pointer-events:auto; }
.lab-no{
  font-size:11px; letter-spacing:.34em; color:var(--accent); text-transform:uppercase;
  display:flex; align-items:center; gap:var(--u);
}
.lab-no::after{ content:""; flex:1; height:1px; background:var(--hair); }
.lab-name{
  font-family:var(--serif); font-weight:600; letter-spacing:.06em;
  font-size:clamp(52px,7.4vw,116px); line-height:.98; margin:calc(var(--u)*1) 0 0;
}
.lab-py{ font-size:12px; letter-spacing:.42em; color:var(--muted); text-transform:uppercase; margin-top:calc(var(--u)*1); }
.lab-meta{
  display:flex; flex-wrap:wrap; gap:var(--u) calc(var(--u)*2); margin-top:calc(var(--u)*2);
  font-size:12px; letter-spacing:.12em; color:var(--muted);
}
.lab-meta b{ font-weight:400; color:var(--fg); }
.hou{ margin-top:calc(var(--u)*2); border-top:1px solid var(--hair); padding-top:calc(var(--u)*2); }
.hou li{ display:flex; gap:var(--u); align-items:baseline; font-size:13px; line-height:1.9; list-style:none; }
.hou ol{ margin:0; padding:0; }
.hou .k{ font-family:var(--serif); font-size:11px; letter-spacing:.1em; color:var(--accent); flex:0 0 34px; }
.lab-desc{ margin-top:calc(var(--u)*2); font-size:13.5px; line-height:2.06; color:var(--muted); max-width:34em; }
.lab-poem{
  margin-top:calc(var(--u)*2.5); padding-left:calc(var(--u)*2);
  border-left:2px solid var(--accent); font-family:var(--serif);
  font-size:clamp(15px,1.4vw,18px); line-height:1.9; letter-spacing:.04em;
}
.lab-poem cite{ display:block; font-style:normal; font-size:11.5px; letter-spacing:.2em; color:var(--faint); margin-top:6px; font-family:var(--sans); }
.swap{ animation:swapIn .72s cubic-bezier(.22,1,.36,1) both; }
@keyframes swapIn{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }

/* ==========================================================================
   模块 F：右侧自绘滚动进度指示 / 节气刻度导航
   ========================================================================== */
#rail{
  position:fixed; right:calc(var(--u)*3); top:50%; transform:translateY(-50%);
  z-index:18; display:flex; flex-direction:column; gap:6px; align-items:flex-end;
}
#rail .tick{
  position:relative; display:flex; align-items:center; justify-content:flex-end; gap:var(--u);
  height:14px; padding:0;
}
#rail .bar{ display:block; width:16px; height:1px; background:var(--faint); transition:width .35s ease, background-color .35s ease, height .35s ease; }
#rail .tick[aria-current="true"] .bar{ width:38px; height:2px; background:var(--accent); }
#rail .tick:hover .bar{ width:28px; background:var(--fg); }
#rail .tip{
  font-family:var(--serif); font-size:12px; letter-spacing:.14em; opacity:0;
  transform:translateX(6px); transition:opacity .3s ease, transform .3s ease; white-space:nowrap;
}
#rail .tick:hover .tip,#rail .tick:focus-visible .tip,#rail .tick[aria-current="true"] .tip{ opacity:1; transform:none; }
#railProg{
  position:fixed; right:calc(var(--u)*3 + 7px); top:0; width:1px; z-index:17;
  background:linear-gradient(to bottom, transparent, var(--hair));
  pointer-events:none;
}

/* ==========================================================================
   模块 G：底部横向拖拽长卷（自实现惯性与回弹）
   ========================================================================== */
#strip{
  position:fixed; left:0; right:0; bottom:0; z-index:16; height:104px;
  border-top:1px solid var(--hair); background:var(--panel);
  backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(9px);
  overflow:hidden; touch-action:pan-y; cursor:grab; user-select:none;
}
#strip.dragging{ cursor:grabbing; }
#strip::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(90deg,var(--bg) 0,transparent 6%,transparent 94%,var(--bg) 100%); opacity:.65;
}
.strip-track{ display:flex; align-items:stretch; height:100%; will-change:transform; }
.chip{
  flex:0 0 auto; width:132px; height:100%; padding:calc(var(--u)*2) calc(var(--u)*2);
  border-right:1px solid var(--hair-2); text-align:left;
  display:flex; flex-direction:column; justify-content:space-between;
  transition:background-color .3s ease, color .3s ease;
}
.chip .ci{ font-size:10px; letter-spacing:.28em; color:var(--faint); }
.chip .cn{ font-family:var(--serif); font-size:22px; letter-spacing:.14em; line-height:1.2; }
.chip .cp{ font-size:9.5px; letter-spacing:.22em; color:var(--muted); text-transform:uppercase; }
.chip[aria-selected="true"]{ background:var(--accent); color:var(--paper); }
.chip[aria-selected="true"] .ci,.chip[aria-selected="true"] .cp{ color:rgba(245,241,232,.8); }
.chip:hover{ background:var(--hair-2); }
.chip[aria-selected="true"]:hover{ background:var(--accent); }

/* ==========================================================================
   模块 H：叙事长卷章节（屏幕上不可见，供无障碍/打印使用）
   ========================================================================== */
#scroll{ position:relative; z-index:5; }
.chapter{ height:100vh; height:100svh; min-height:520px; position:relative; }

/* ==========================================================================
   模块 I：提示条、说明抽屉、打印海报
   ========================================================================== */
#toast{
  position:fixed; left:50%; bottom:124px; transform:translate(-50%,12px); z-index:30;
  background:var(--fg); color:var(--bg); font-size:12px; letter-spacing:.08em;
  padding:calc(var(--u)*1.25) calc(var(--u)*2.5); opacity:0; pointer-events:none;
  transition:opacity .4s ease, transform .4s ease; max-width:min(90vw,520px); text-align:center;
}
#toast.show{ opacity:1; transform:translate(-50%,0); }
#sheet{
  position:fixed; z-index:40; right:calc(var(--u)*4); top:calc(var(--u)*11);
  width:min(92vw,380px); background:var(--panel); border:1px solid var(--hair);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  padding:calc(var(--u)*3); font-size:13px; line-height:2; color:var(--muted);
}
#sheet[hidden]{ display:none; }
#sheet h2{ font-family:var(--serif); font-size:16px; letter-spacing:.2em; color:var(--fg); margin-bottom:var(--u); }
#sheet kbd{
  font-family:var(--sans); font-size:11px; border:1px solid var(--hair); padding:1px 6px; color:var(--fg);
}
#sheet ul{ margin:0; padding-left:1.1em; }
#printPoster{ display:none; }

/* ==========================================================================
   模块 J：响应式（320px ~ 2560px）
   ========================================================================== */
@media (max-width:1024px){
  #label{ width:min(52vw,420px); }
  .lab-desc{ font-size:13px; }
}
@media (max-width:820px){
  #topbar{ padding:calc(var(--u)*2); }
  #label{
    left:calc(var(--u)*2); right:calc(var(--u)*2); width:auto; top:auto; bottom:120px;
    transform:none; max-height:56vh; overflow:auto; scrollbar-width:none;
  }
  #label::-webkit-scrollbar{ display:none; }
  .lab-name{ font-size:clamp(40px,13vw,68px); }
  .lab-desc{ max-width:none; font-size:12.5px; line-height:1.95; }
  #rail{ right:calc(var(--u)*1); gap:4px; }
  #rail .tip{ display:none; }
  #rail .bar{ width:10px; }
  #glyph{ font-size:min(58vw,40vh); opacity:.05; }
  #strip{ height:88px; }
  .chip{ width:110px; }
  .chip .cn{ font-size:19px; }
}
@media (max-width:420px){
  .brand h1{ font-size:15px; letter-spacing:.16em; }
  .brand .sub{ display:none; }
  .seal{ width:32px; height:32px; }
  .ctrl{ width:36px; height:36px; }
  #label{ bottom:104px; }
  .lab-name{ font-size:clamp(36px,15vw,54px); }
  .hou li{ font-size:12px; }
  #strip{ height:76px; }
  .chip{ width:96px; padding:var(--u) calc(var(--u)*1.5); }
  .chip .cn{ font-size:17px; }
  #toast{ bottom:96px; font-size:11px; }
}
@media (max-height:680px){
  #rail{ gap:3px; }
  #rail .tick{ height:9px; }
  #label{ max-height:62vh; overflow:auto; scrollbar-width:none; }
}
@media (min-width:1800px){
  body{ font-size:16px; }
  #label{ width:min(34vw,520px); }
  .lab-desc{ font-size:15px; }
  .chip{ width:158px; }
  #strip{ height:118px; }
}

/* ==========================================================================
   模块 K：动效降级（prefers-reduced-motion）
   ========================================================================== */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
}
html[data-motion="off"] .swap{ animation:none; }

/* ==========================================================================
   模块 L：打印样式 —— 长卷输出为一张海报
   ========================================================================== */
@media print{
  @page{ size:A3 portrait; margin:12mm; }
  #stage,#topbar,#rail,#railProg,#strip,#label,#toast,#sheet,.skip{ display:none !important; }
  html,body{ background:#fff !important; color:#111 !important; }
  #printPoster{ display:block; text-align:center; margin-bottom:8mm; border-bottom:1.2pt solid #111; padding-bottom:5mm; }
  #printPoster h2{ font-family:var(--serif); font-size:34pt; letter-spacing:.3em; margin:0; }
  #printPoster p{ font-size:9pt; letter-spacing:.28em; margin-top:3mm; color:#444; }
  #scroll{ column-count:3; column-gap:7mm; }
  .chapter{ height:auto !important; min-height:0 !important; break-inside:avoid; page-break-inside:avoid; margin-bottom:5mm; }
  .sr-doc{
    position:static !important; width:auto !important; height:auto !important; margin:0 !important;
    clip-path:none !important; overflow:visible !important; white-space:normal !important;
  }
  .sr-doc h2{ font-family:var(--serif); font-size:15pt; letter-spacing:.14em; }
  .sr-doc .p-py{ font-size:7pt; letter-spacing:.24em; color:#666; }
  .sr-doc p{ font-size:8.4pt; line-height:1.55; margin:1.2mm 0; }
  .sr-doc .p-poem{ font-family:var(--serif); font-size:9pt; border-left:1pt solid #C0392B; padding-left:2mm; }
}
</style>
</head>

<body>
<a class="skip" href="#scroll">跳到长卷正文</a>

<!-- 舞台：全部视觉由 Canvas 程序化生成 -->
<div id="stage" aria-hidden="true">
  <canvas id="ink"></canvas>
  <div id="grain"></div>
  <div id="glyph"><span id="glyphTxt">立春</span></div>
</div>

<!-- 顶部展标 -->
<header id="topbar">
  <div class="brand">
    <svg class="seal" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
      <rect x="1.5" y="1.5" width="37" height="37" fill="none" stroke="var(--accent)" stroke-width="2"/>
      <circle cx="20" cy="20" r="9.5" fill="none" stroke="var(--accent)" stroke-width="1.4"/>
      <path d="M20 6.5v27M6.5 20h27" stroke="var(--accent)" stroke-width="1" opacity=".55"/>
      <path d="M13 26c4-7 10-7 14 0" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="20" cy="16" r="2.4" fill="var(--accent)"/>
    </svg>
    <div>
      <h1>时间的形状</h1>
      <p class="sub">二十四节气数字长卷 / A Scroll of Seasons</p>
    </div>
  </div>
  <div class="tools" role="group" aria-label="展陈控制">
    <button id="btnTheme" class="ctrl" type="button" aria-pressed="false" aria-label="切换明暗主题">
      <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
        <circle cx="12" cy="12" r="4.6"/><path d="M12 2.4v2.6M12 19v2.6M2.4 12h2.6M19 12h2.6M5.2 5.2l1.9 1.9M16.9 16.9l1.9 1.9M18.8 5.2l-1.9 1.9M7.1 16.9l-1.9 1.9" stroke-linecap="round"/>
      </svg>
      <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
        <path d="M20 14.5A8.4 8.4 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" stroke-linejoin="round"/>
      </svg>
    </button>
    <button id="btnSound" class="ctrl" type="button" aria-pressed="false" aria-label="开启环境音景（默认静音）">
      <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
        <path d="M4 9.5h3.4L12 5.6v12.8L7.4 14.5H4z" stroke-linejoin="round"/><path d="M16.5 9l5 6M21.5 9l-5 6" stroke-linecap="round"/>
      </svg>
      <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
        <path d="M4 9.5h3.4L12 5.6v12.8L7.4 14.5H4z" stroke-linejoin="round"/><path d="M15.6 9.2a4 4 0 0 1 0 5.6M18.3 6.8a7.6 7.6 0 0 1 0 10.4" stroke-linecap="round"/>
      </svg>
    </button>
    <button id="btnMotion" class="ctrl" type="button" aria-pressed="true" aria-label="切换动效与静态构图">
      <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
        <path d="M3 15c3.4 0 3.4-6 6.8-6s3.4 6 6.8 6 3.4-6 4.4-6" stroke-linecap="round"/><circle cx="12" cy="12" r="9.2" opacity=".35"/>
      </svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
        <rect x="4.6" y="4.6" width="14.8" height="14.8"/><path d="M4.6 14h14.8" opacity=".5"/>
      </svg>
    </button>
    <button id="btnInfo" class="ctrl" type="button" aria-expanded="false" aria-controls="sheet" aria-label="关于本展与操作说明">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/><path d="M12 10.6v6.2" stroke-linecap="round"/><circle cx="12" cy="7.6" r=".9" fill="currentColor" stroke="none"/>
      </svg>
    </button>
  </div>
</header>

<!-- 纵向长卷：24 章节驱动滚动进度（正文供屏幕阅读器与打印使用） -->

/* ==========================================================================
   模块 1：通用工具与监听器登记（统一登记以便卸载回收，避免内存泄漏）
   ========================================================================== */
const TAU = Math.PI * 2;
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
function smooth(e0,e1,x){ const t=clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); }
function hash(i,s){ const x=Math.sin(i*127.1+s*311.7)*43758.5453; return x-Math.floor(x); }

const LISTENERS = [];
function on(el,ev,fn,opt){ el.addEventListener(ev,fn,opt); LISTENERS.push([el,ev,fn,opt]); return fn; }
function offAll(){ while(LISTENERS.length){ const [el,ev,fn,opt]=LISTENERS.pop(); el.removeEventListener(ev,fn,opt); } }

/* ==========================================================================
   模块 2：色板（仅宣纸白 / 墨黑 / 朱砂红 / 黛蓝及衍生阶）与主题平滑插值
   ========================================================================== */
const PALETTES = {
  light:{ bg:[245,241,232], fg:[26,26,26], paper:[245,241,232], ink:[26,26,26], cin:[192,57,43], ind:[44,62,80], soft:[222,214,196] },
  dark :{ bg:[20,20,20],    fg:[245,241,232], paper:[245,241,232], ink:[224,219,208], cin:[212,90,68], ind:[126,155,184], soft:[62,62,62] }
};
const PKEYS = Object.keys(PALETTES.light);
const curPal = {}, tgtPal = {};
PKEYS.forEach(k=>{ curPal[k]=PALETTES.light[k].slice(); tgtPal[k]=PALETTES.light[k].slice(); });
const P = {
  c(k,a){ const v=curPal[k]; return 'rgba('+(v[0]|0)+','+(v[1]|0)+','+(v[2]|0)+','+a+')'; }
};
function setPaletteTarget(name){ const p=PALETTES[name]||PALETTES.light; for(const k of PKEYS) tgtPal[k]=p[k]; }
function stepPalette(f){
  let moving=false;
  for(const k of PKEYS){ const c=curPal[k], t=tgtPal[k];
    for(let j=0;j<3;j++){ const d=t[j]-c[j]; if(Math.abs(d)>0.4) moving=true; c[j]+=d*f; } }
  return moving;
}

/* ==========================================================================
   模块 3：画布 / DPR / 离屏累积层 / 积雪高度图
   ========================================================================== */
const cvs = document.getElementById('ink');
const g   = cvs.getContext('2d', { alpha:false });
let W=window.innerWidth, H=window.innerHeight, DPR=1;
let acc = document.createElement('canvas');
let ac  = acc.getContext('2d');
const PILE_N = 168;
let pile = new Float32Array(PILE_N);
let needStatic = true, staticRedraw = 0, MOTION = true, accFade = 0;

function clearAccum(){ ac.save(); ac.setTransform(1,0,0,1,0,0); ac.clearRect(0,0,acc.width,acc.height); ac.restore(); }
function pileAt(x){ const i=clamp((x/W*PILE_N)|0,0,PILE_N-1); return pile[i]; }
function pileAdd(x,v){
  const i=clamp((x/W*PILE_N)|0,0,PILE_N-1), cap=H*0.24;
  pile[i]=Math.min(cap, pile[i]+v);
  if(i>0) pile[i-1]=Math.min(cap,pile[i-1]+v*0.45);
  if(i<PILE_N-1) pile[i+1]=Math.min(cap,pile[i+1]+v*0.45);
}
function pileDecay(f){ for(let i=0;i<PILE_N;i++) pile[i]*=f; }
function drawPile(ctx,alpha,key){
  let any=false; for(let i=0;i<PILE_N;i++){ if(pile[i]>0.6){ any=true; break; } }
  if(!any) return;
  ctx.beginPath(); ctx.moveTo(0,H);
  for(let i=0;i<PILE_N;i++){ const x=(i+0.5)/PILE_N*W; ctx.lineTo(x, H-pile[i]); }
  ctx.lineTo(W,H); ctx.closePath();
  ctx.fillStyle=P.c(key,alpha); ctx.fill();
  ctx.strokeStyle=P.c('ind',alpha*0.5); ctx.lineWidth=1; ctx.stroke();
}

function resizeCanvas(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = Math.max(320, window.innerWidth); H = Math.max(360, window.innerHeight);
  cvs.width = Math.round(W*DPR); cvs.height = Math.round(H*DPR);
  cvs.style.width = W+'px'; cvs.style.height = H+'px';
  g.setTransform(DPR,0,0,DPR,0,0);
  acc.width = Math.round(W*DPR); acc.height = Math.round(H*DPR);
  ac.setTransform(DPR,0,0,DPR,0,0);
  clearAccum(); pile.fill(0);
  g.fillStyle = P.c('bg',1); g.fillRect(0,0,W,H);
  needStatic = true;
}

/* ==========================================================================
   模块 4：粒子池（TypedArray，零逐帧分配）
   ========================================================================== */
let N=0, px=null, py=null, vx=null, vy=null, r1a=null, r2a=null, sza=null;
function allocParticles(n, preserve){
  const oldN=N, opx=px, opy=py, ovx=vx, ovy=vy;
  N=n;
  px=new Float32Array(n); py=new Float32Array(n); vx=new Float32Array(n); vy=new Float32Array(n);
  r1a=new Float32Array(n); r2a=new Float32Array(n); sza=new Float32Array(n);
  for(let i=0;i<n;i++){
    r1a[i]=hash(i,1.7); r2a[i]=hash(i,9.3); sza[i]=0.75+hash(i,7.7)*1.55;
    if(preserve && i<oldN){ px[i]=opx[i]; py[i]=opy[i]; vx[i]=ovx[i]; vy[i]=ovy[i]; }
    else { px[i]=hash(i,3.1)*W; py[i]=hash(i,5.9)*H; }
  }
}
function defaultCount(){
  const area=W*H;
  return clamp(Math.round(2000 + clamp((area-760000)/2400,0,1000)), 2000, 3000);
}

/* ==========================================================================
   模块 5：指针流场扰动
   ========================================================================== */
let mx=-9999, my=-9999, pvx=0, pvy=0, lastPX=0, lastPY=0, ripple=0;
function pointerMove(e){
  const x=e.clientX, y=e.clientY;
  pvx = clamp(x-lastPX,-46,46); pvy = clamp(y-lastPY,-46,46);
  lastPX=x; lastPY=y; mx=x; my=y;
  ripple = Math.min(1, ripple + (Math.abs(pvx)+Math.abs(pvy))*0.02);
}

/* ==========================================================================
   模块 6：场景注册表（24 个节气各一套「形 / 态 / 绘」）
   ========================================================================== */
const SC = [];
function scene(o){
  o.stiff = o.stiff==null?0.05:o.stiff;
  o.damp  = o.damp==null?0.86:o.damp;
  o.flow  = o.flow==null?0.05:o.flow;
  o.swirl = o.swirl==null?0.3:o.swirl;
  o.repel = o.repel==null?0.25:o.repel;
  o.sz    = o.sz==null?1:o.sz;
  o.mode  = o.mode||'dot';
  o.alpha = o.alpha||[0.6,0.42,0.8];
  o.wash  = o.wash||['ind',0.07,0.5,0.42];
  SC.push(o);
}
const oA=[0,0], oB=[0,0];

/* ==========================================================================
   模块 7：绘制 —— 底色晕染 / 粒子 / 指针涟漪
   ========================================================================== */
function washBg(ia,ib,m){
  drawWash(SC[ia].wash, 1-m); if(m>0.01) drawWash(SC[ib].wash, m);
}
function drawWash(w,a){
  if(a<=0.01) return;
  const r=Math.max(W,H)*0.78;
  const gr=g.createRadialGradient(W*w[2],H*w[3],r*0.04,W*w[2],H*w[3],r);
  gr.addColorStop(0, P.c(w[0], w[1]*a));
  gr.addColorStop(1, P.c(w[0], 0));
  g.fillStyle=gr; g.fillRect(0,0,W,H);
}
function stepParticles(A,B,m,anim){
  const useB = m>0.004;
  const stiff=lerp(A.stiff,B.stiff,m), damp=lerp(A.damp,B.damp,m);
  const repel=lerp(A.repel,B.repel,m), swirl=lerp(A.swirl,B.swirl,m);
  const flow = anim? lerp(A.flow,B.flow,m) : 0;
  const PR=180, PR2=PR*PR;
  const grow = anim && ((m<0.5?A:B).usePile);
  for(let i=0;i<N;i++){
    const q1=r1a[i], q2=r2a[i];
    A.form(i,N,q1,q2,W,H,T,oA);
    let tx=oA[0], ty=oA[1];
    if(useB){ B.form(i,N,q1,q2,W,H,T,oB); tx+= (oB[0]-tx)*m; ty+= (oB[1]-ty)*m; }
    if(!anim){ px[i]=tx; py[i]=ty; continue; }
    let x=px[i], y=py[i], ux=vx[i], uy=vy[i];
    ux += (tx-x)*stiff; uy += (ty-y)*stiff;
    ux += Math.sin(y*0.0128 + T*0.7 + q1*6.283)*flow;
    uy += Math.cos(x*0.0114 - T*0.55 + q2*6.283)*flow;
    const dx=x-mx, dy=y-my, d2=dx*dx+dy*dy;
    if(d2<PR2){
      const d=Math.sqrt(d2)+0.001, k=1-d/PR, ix=dx/d, iy=dy/d;
      ux += ix*k*(1.1+repel*7) + pvx*k*0.05 - iy*k*swirl*2.4;
      uy += iy*k*(1.1+repel*7) + pvy*k*0.05 + ix*k*swirl*2.4;
    }
    ux*=damp; uy*=damp;
    px[i]=x+ux; py[i]=y+uy; vx[i]=ux; vy[i]=uy;
    if(grow && i%3===0){ const sy=H-pileAt(x); if(y>sy && y<H+30) pileAdd(x,0.05); }
  }
}
function drawParticles(S){
  const cols=S.cols, alp=S.alpha, base=S.sz, mode=S.mode;
  const b0=(N*0.6)|0, b1=(N*0.88)|0;
  for(let b=0;b<3;b++){
    const s0 = b===0?0:(b===1?b0:b1), s1 = b===0?b0:(b===1?b1:N);
    const style=P.c(cols[b], alp[b]);
    g.fillStyle=style; g.strokeStyle=style; g.lineWidth=1;
    if(mode==='flake') g.beginPath();
    for(let i=s0;i<s1;i++){
      const x=px[i], y=py[i];
      if(x<-50||x>W+50||y<-50||y>H+50) continue;
      const s=sza[i]*base;
      if(mode==='streak') g.fillRect(x,y,(s*0.55)<1?1:s*0.55, s*5.4);
      else if(mode==='dash') g.fillRect(x,y,s*5.4,(s*0.55)<1?1:s*0.55);
      else if(mode==='flake'){
        if((i&7)===0){ const r=s*2.8;
          g.moveTo(x-r,y); g.lineTo(x+r,y);
          const hx=r*0.5, hy=r*0.866;
          g.moveTo(x-hx,y-hy); g.lineTo(x+hx,y+hy);
          g.moveTo(x-hx,y+hy); g.lineTo(x+hx,y-hy);
        } else g.fillRect(x,y,s,s);
      }
      else g.fillRect(x,y,s,s);
    }
    if(mode==='flake') g.stroke();
  }
}
function drawRipple(){
  if(ripple<=0.01 || mx<-999) return;
  g.save();
  g.strokeStyle=P.c('cin', 0.16*ripple); g.lineWidth=1;
  g.beginPath(); g.arc(mx,my, 26+ (1-ripple)*90, 0, TAU); g.stroke();
  g.strokeStyle=P.c('ind', 0.10*ripple);
  g.beginPath(); g.arc(mx,my, 54+ (1-ripple)*150, 0, TAU); g.stroke();
  g.restore();
  ripple*=0.94;
}

/* ==========================================================================
   模块 8：单帧合成（含形变过渡：相邻两场景的形位插值）
   ========================================================================== */
function drawFrame(ia,ib,m,anim){
  const A=SC[ia], B=SC[ib];
  if(anim){ g.fillStyle=P.c('bg',0.16); g.fillRect(0,0,W,H); }
  else { g.fillStyle=P.c('bg',1); g.fillRect(0,0,W,H); }
  washBg(ia,ib,m);

  /* 累积图层：雨渍 / 露痕 / 霜华 / 消寒图等逐帧沉积 */
  const hasStain = A.stain || B.stain;
  if(hasStain){
    if(anim){
      if(A.stain) A.stain(ac,W,H,T,1-m,P);
      if(m>0.01 && B.stain) B.stain(ac,W,H,T,m,P);
    } else {
      clearAccum();
      for(let k=0;k<44;k++){ const tt=T+k*0.21; if(A.stain) A.stain(ac,W,H,tt,1,P); }
    }
    accFade=70;
    g.save(); g.globalAlpha=0.92; g.drawImage(acc,0,0,W,H); g.restore();
  } else if(anim && accFade>0){
    /* 离开有沉积的场景时缓慢褪去；褪尽后不再合成，节省整屏绘制 */
    accFade--;
    ac.save(); ac.setTransform(1,0,0,1,0,0);
    ac.globalCompositeOperation='destination-out';
    ac.fillStyle='rgba(0,0,0,0.06)'; ac.fillRect(0,0,acc.width,acc.height);
    ac.globalCompositeOperation='source-over'; ac.restore();
    g.save(); g.globalAlpha=0.9; g.drawImage(acc,0,0,W,H); g.restore();
    if(accFade===0) clearAccum();
  }

  if(!(A.usePile || B.usePile)) pileDecay(0.965);
  else if(!anim){ for(let i=0;i<PILE_N;i++) pile[i]=H*0.055*(0.6+0.4*Math.sin(i*0.35)); }

  if(A.paint) A.paint(g,W,H,T,1-m,P);
  if(m>0.01 && B.paint) B.paint(g,W,H,T,m,P);

  stepParticles(A,B,m,anim);
  drawParticles(m<0.5?A:B);
  if(anim) drawRipple();
}

/* ==========================================================================
   模块 9：主循环 · 性能监控 · 自动降级
   ========================================================================== */
let rafId=0, T0=performance.now(), T=0, lastFrame=T0;
let lowFrames=0, lowNoticed=false, paused=false;
let scrollF=0, curIdx=-1, chapterEl=null, fpsAvg=60;

function frame(now){
  rafId = requestAnimationFrame(frame);
  let dt = now-lastFrame; lastFrame=now;
  if(paused || dt>500) { T0 += dt; return; }
  T = (now-T0)/1000;
  const moving = stepPalette(0.09);
  if(moving && !MOTION) staticRedraw = Math.max(staticRedraw,2);

  const ch = chapterHeight();   /* 缓存值，避免逐帧强制布局回流 */
  scrollF = clamp(window.scrollY / Math.max(1,ch), 0, TERMS.length-1);
  const ia = Math.min(TERMS.length-1, Math.floor(scrollF));
  const frac = scrollF - ia;
  const ib = Math.min(TERMS.length-1, ia+1);
  const m = smooth(0.26, 0.80, frac);
  const idx = frac>0.5 ? ib : ia;
  if(idx!==curIdx){ curIdx=idx; onTermChange(idx); }

  updateStripPhysics(dt);
  updateRailProgress();
  pvx*=0.88; pvy*=0.88;

  if(MOTION){ drawFrame(ia,ib,m,true); measurePerf(dt); }
  else if(needStatic || staticRedraw>0){ staticRedraw--; drawFrame(idx,idx,0,false); needStatic=false; }
}
function measurePerf(dt){
  fpsAvg = fpsAvg*0.92 + (1000/Math.max(dt,1))*0.08;
  if(dt>22.2) lowFrames++; else lowFrames=0;
  if(lowFrames>=60){
    lowFrames=0;
    if(N>820){
      const old=N, nn=Math.max(820, Math.round(N*0.62));
      allocParticles(nn, true);
      toast('检测到连续 60 帧低于 45fps，粒子规模已由 '+old+' 自动降至 '+nn+'，以保证长卷流畅。');
    } else if(!lowNoticed){
      lowNoticed=true;
      toast('设备渲染压力较大，建议切换为「静态构图」模式以获得最佳阅读体验。');
    }
  }
}
function startLoop(){ if(!rafId){ lastFrame=performance.now(); rafId=requestAnimationFrame(frame); } }
function stopLoop(){ if(rafId){ cancelAnimationFrame(rafId); rafId=0; } }

/* ==========================================================================
   模块 10：资源回收（切页 / 卸载时释放监听器、离屏画布与音频）
   ========================================================================== */
function cleanupAll(){
  stopLoop(); offAll(); stopAudio(true);
  acc.width=0; acc.height=0; acc=null; ac=null;
  px=py=vx=vy=r1a=r2a=sza=null; pile=null;
}

/* ==========================================================================
   模块 11：二十四节气场景表
   每个场景 = form（粒子目标形态） + paint（矢量叠绘） + stain（沉积层）
   相邻场景之间由主循环对 form 结果做位置插值，形成真正的形变过渡
   ========================================================================== */

/* ---- 一 · 立春：冻土开裂，一茎破土，双子叶张开 ---- */
scene({ key:'lichun', mode:'dot', cols:['ink','ind','cin'], alpha:[.55,.38,.86],
  wash:['ind',.06,.5,.66], stiff:.05, damp:.88, flow:.05, sz:1,
  form(i,n,q1,q2,W,H,T,o){
    const cx=W*.5, base=H*.88, u=i/n;
    if(u<.5){ const k=u/.5;
      o[0]=cx+Math.sin(k*2.3+T*.35)*W*.022*k+(q1-.5)*5;
      o[1]=base-k*H*.44;
    } else {
      const k=(u-.5)/.5, side=q1<.5?-1:1, a=k*Math.PI, d=a/Math.PI;
      const L=Math.min(W,H)*.25, ang=side>0? -.62+Math.sin(T*.5)*.06 : Math.PI+.62-Math.sin(T*.5)*.06;
      const w=Math.sin(a)*L*.26*(q2*2-1);
      o[0]=cx+Math.cos(ang)*d*L-Math.sin(ang)*w;
      o[1]=base-H*.42+Math.sin(ang)*d*L+Math.cos(ang)*w;
    }
  },
  paint(g,W,H,T,a,P){
    g.save(); g.lineWidth=1;
    g.strokeStyle=P.c('ink',.20*a); g.beginPath(); g.moveTo(0,H*.885); g.lineTo(W,H*.885); g.stroke();
    g.strokeStyle=P.c('ink',.12*a);
    for(let i=0;i<18;i++){ const x=(i+.5)/18*W;
      g.beginPath(); g.moveTo(x,H*.885); g.lineTo(x+(hash(i,3)-.5)*46, H*.885+hash(i,2)*34+6); g.stroke(); }
    g.fillStyle=P.c('cin',.55*a);
    g.beginPath(); g.arc(W*.5, H*.885-H*.45, 4.5, 0, TAU); g.fill();
    g.restore();
  }});

/* ---- 二 · 雨水：细雨斜落，溅开涟漪并浸润地面 ---- */
scene({ key:'yushui', mode:'streak', cols:['ind','ink','cin'], alpha:[.42,.30,.5],
  wash:['ind',.09,.5,.3], stiff:.14, damp:.72, flow:.02, sz:.85, repel:.5,

  },
  paint(g,W,H,T,a,P){

    for(let i=0;i<16;i++){
      const ph=(T*.85+i*.31)%1, x=hash(i,11)*W, r=ph*30;
      g.globalAlpha=(1-ph)*.75*a;
      g.beginPath(); g.ellipse(x,H*.9,r,r*.3,0,0,TAU); g.stroke();

    }
    ac.save(); ac.setTransform(1,0,0,1,0,0); ac.globalCompositeOperation='destination-out';
    ac.fillStyle='rgba(0,0,0,.006)'; ac.fillRect(0,0,ac.canvas.width,ac.canvas.height);

/* ---- 三 · 惊蛰：虫群苏醒，受指针惊扰四散 ---- */
scene({ key:'jingzhe', mode:'dot', cols:['ink','ind','cin'], alpha:[.6,.4,.85],
  wash:['cin',.05,.5,.5], stiff:.06, damp:.83, flow:.09, repel:1.15, swirl:.9, sz:.95,

/* ---- 四 · 春分：昼夜等分，圆环与太极曲线 ---- */
scene({ key:'chunfen', mode:'dot', cols:['ink','ind','cin'], alpha:[.5,.45,.8],

/* ---- 七 · 立夏：叶脉在光里撑开 ---- */
scene({ key:'lixia', mode:'dot', cols:['ink','ind','cin'], alpha:[.5,.42,.72],
  wash:['cin',.05,.62,.4], stiff:.055, damp:.88, flow:.04,

      g.beginPath(); g.moveTo(x,y); g.lineTo(x+16,y-16-hash(i,121)*14); g.stroke(); }
    g.strokeStyle=P.c('paper',.24*a);
    for(let i=0;i<10;i++){ const y=H*(.1+hash(i,131)*.8), x=((T*60+i*W*.12)%(W*1.2))-W*.1;
      g.beginPath(); g.moveTo(x,y); g.lineTo(x+40,y+3); g.stroke(); }
    drawPile(g,.16*a,'paper');
    g.restore();
  }});

/* ---- 二十一 · 大雪：六出成群，底部逐帧堆积 ---- */
scene({ key:'daxue', mode:'flake', cols:['paper','paper','ind'], alpha:[.55,.4,.42],
  wash:['ind',.1,.5,.3], stiff:.05, damp:.88, flow:.055, usePile:true, sz:1.05,
  form(i,n,q1,q2,W,H,T,o){
    const span=H+120, sp=46+q2*84;
    const y=((q1*span+T*sp)%span)-60;
    o[0]=((q2*W+Math.sin(y*.012+q1*9)*W*.075+T*14)%(W+120))-60;
    o[1]=y;
  },
  paint(g,W,H,T,a,P){
    g.save();
    drawPile(g,.5*a,'paper');
    g.strokeStyle=P.c('ink',.26*a); g.lineWidth=1.4;
    g.beginPath(); g.moveTo(W*.86,H); g.lineTo(W*.84,H*.5); g.stroke();
    g.lineWidth=1;
    for(let i=0;i<5;i++){ const y=H*(.55+i*.08);
      g.beginPath(); g.moveTo(W*.845,y); g.lineTo(W*.845+((i&1)?38:-38),y-24); g.stroke(); }
    g.restore();
  }});

/* ---- 二十二 · 冬至：夜最长，九九消寒图逐日染红 ---- */
scene({ key:'dongzhi', mode:'dot', cols:['ink','ind','cin'], alpha:[.42,.36,.85],
  wash:['ind',.12,.5,.5], stiff:.09, damp:.82, flow:.03, sz:.9,
  form(i,n,q1,q2,W,H,T,o){
    const S=Math.min(W,H)*.56, c=(q1*81)|0, gx=c%9, gy=(c/9)|0;
    const ox=W*.5-S/2+(gx+.5)*S/9, oy=H*.5-S/2+(gy+.5)*S/9;
    const pet=(q2*5)|0, ang=pet/5*TAU+T*.25+c;
    const pr=S/9*.24*(1+.08*Math.sin(T*2+c));
    o[0]=ox+Math.cos(ang)*pr; o[1]=oy+Math.sin(ang)*pr;
  },
  paint(g,W,H,T,a,P){
    const S=Math.min(W,H)*.56, filled=Math.floor((T*2.4)%88);
    g.save(); g.lineWidth=1;
    for(let c=0;c<81;c++){
      const gx=c%9, gy=(c/9)|0;
      const x=W*.5-S/2+(gx+.5)*S/9, y=H*.5-S/2+(gy+.5)*S/9, r=S/9*.3;
      g.strokeStyle=P.c('ink',.2*a); g.beginPath(); g.arc(x,y,r,0,TAU); g.stroke();
      if(c<filled){ g.fillStyle=P.c('cin',.5*a); g.beginPath(); g.arc(x,y,r*.66,0,TAU); g.fill(); }
    }
    const gr=g.createRadialGradient(W*.5,H*.5,2,W*.5,H*.5,S);
    gr.addColorStop(0,P.c('cin',.07*a)); gr.addColorStop(1,P.c('cin',0));
    g.fillStyle=gr; g.fillRect(0,0,W,H);
    g.restore();
  }});

/* ---- 二十三 · 小寒：风有棱角，腊梅冷香 ---- */
scene({ key:'xiaohan', mode:'dash', cols:['ind','ink','cin'], alpha:[.34,.3,.6],
  wash:['ind',.1,.5,.42], stiff:.05, damp:.89, flow:.05, sz:.95,
  form(i,n,q1,q2,W,H,T,o){
    const lane=(q1*24)|0;
    const k=(q2+T*(.1+(lane%5)*.032))%1;
    o[0]=k*W*1.25-W*.12;
    o[1]=H*(.05+lane*.039)+Math.sin(k*TAU+lane)*9;
  },
  paint(g,W,H,T,a,P){
    g.save(); g.lineWidth=1.5; g.strokeStyle=P.c('ink',.3*a);
    g.beginPath(); g.moveTo(W,H*.96); g.bezierCurveTo(W*.82,H*.9,W*.7,H*.78,W*.52,H*.72); g.stroke();
    g.lineWidth=1;
    for(let i=0;i<5;i++){ const t2=i/5, x=lerp(W,W*.52,t2), y=lerp(H*.96,H*.72,t2);
      g.beginPath(); g.moveTo(x,y); g.lineTo(x-10-hash(i,141)*22,y-18-hash(i,142)*20); g.stroke(); }
    g.fillStyle=P.c('cin',.5*a);
    for(let i=0;i<11;i++){ const t2=hash(i,151), x=lerp(W,W*.52,t2)-hash(i,152)*22, y=lerp(H*.96,H*.72,t2)-hash(i,153)*22;
      g.beginPath(); g.arc(x,y,3.4,0,TAU); g.fill(); }
    g.restore();
  }});

/* ---- 二十四 · 大寒：湖冻至心，静如铜镜，寒中藏春 ---- */
scene({ key:'dahan', mode:'dot', cols:['ind','paper','cin'], alpha:[.42,.34,.8],
  wash:['ind',.11,.5,.5], stiff:.13, damp:.78, flow:.015, sz:.95,
  form(i,n,q1,q2,W,H,T,o){
    const cx=W*.5, cy=H*.5, R=Math.min(W,H)*.33;
    if(q1<.66){ const ang=(i/n)*TAU*1.0, rr=R*(.97+.03*Math.sin(T*.5+ang*4));
      o[0]=cx+Math.cos(ang)*rr; o[1]=cy+Math.sin(ang)*rr*.94;
    } else { const cr=(q1*15)|0, ang=cr/15*TAU+.3, p=q2;
      o[0]=cx+Math.cos(ang)*p*R*.94+Math.sin(T*.6+cr)*1.2;
      o[1]=cy+Math.sin(ang)*p*R*.88+Math.cos(T*.6+cr)*1.2;
    }
  },
  paint(g,W,H,T,a,P){
    const cx=W*.5, cy=H*.5, R=Math.min(W,H)*.33;
    g.save(); g.lineWidth=1;
    g.fillStyle=P.c('ind',.07*a); g.beginPath(); g.ellipse(cx,cy,R,R*.94,0,0,TAU); g.fill();
    g.strokeStyle=P.c('paper',.3*a); g.beginPath(); g.ellipse(cx,cy,R,R*.94,0,0,TAU); g.stroke();
    g.strokeStyle=P.c('paper',.22*a);
    for(let i=0;i<7;i++){ const an=i/7*TAU+.4;
      g.beginPath(); g.moveTo(cx,cy);
      let x=cx,y=cy;
      for(let k=1;k<=3;k++){ x=cx+Math.cos(an+(hash(i*3+k,161)-.5)*.5)*R*(k/3); y=cy+Math.sin(an+(hash(i*3+k,162)-.5)*.5)*R*(k/3)*.94; g.lineTo(x,y); }
      g.stroke(); }
    g.fillStyle=P.c('cin',.6*a); g.beginPath(); g.arc(cx,cy,4.5+Math.sin(T*1.6)*1.2,0,TAU); g.fill();
    g.restore();
  }});

/* ==========================================================================
   模块 14：滚动导航（自实现缓动补间，替代原生 smooth）
   ========================================================================== */
let scrollTween=0, chH=0;
function chapterHeight(){
  if(!chH) chH = chapterEl ? chapterEl.offsetHeight : H;
  return chH || H;
}
function goTo(i,smoothly){
  i=clamp(i,0,TERMS.length-1);
  const y=Math.round(i*chapterHeight());
  if(!MOTION || !smoothly){ cancelTween(); window.scrollTo(0,y); return; }
  tweenScroll(y);
}
function tweenScroll(to){
  cancelTween();
  const from=window.scrollY, d=to-from, t0=performance.now();
  const dur=Math.min(1500, 420+Math.abs(d)/Math.max(1,H)*400);
  const step=(now)=>{
    const k=clamp((now-t0)/dur,0,1);
    const e=k<.5? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2;
    window.scrollTo(0, from+d*e);
    scrollTween = k<1 ? requestAnimationFrame(step) : 0;
  };
  scrollTween=requestAnimationFrame(step);
}
function cancelTween(){ if(scrollTween){ cancelAnimationFrame(scrollTween); scrollTween=0; } }
function updateRailProgress(){
  const p = scrollF/(TERMS.length-1);
  const h = Math.round(p*H);
  if(railProg._h!==h){ railProg._h=h; railProg.style.height=h+'px'; }
}

/* ==========================================================================
   模块 15：横向长廊 —— 自实现惯性衰减与边缘回弹（无物理库）
   ========================================================================== */
let stripPos=0, stripVel=0, stripMin=0, dragging=false, dragId=-1, dragMoved=0, lastX=0, lastTS=0, tweenTo=null;
function stripBounds(){ stripMin=Math.min(0, stripEl.clientWidth - trackEl.scrollWidth); }
function centerChip(i){
  const chip=CHIPS[i]; if(!chip) return;
  const target=clamp(-(chip.offsetLeft + chip.offsetWidth/2 - stripEl.clientWidth/2), stripMin, 0);
  if(dragging) return;
  if(!MOTION){ stripPos=target; tweenTo=null; trackEl.style.transform='translate3d('+stripPos+'px,0,0)'; }
  else tweenTo=target;
}
function updateStripPhysics(){
  if(!dragging){
    if(tweenTo!==null){
      stripPos += (tweenTo-stripPos)*0.14; stripVel=0;
      if(Math.abs(tweenTo-stripPos)<0.4){ stripPos=tweenTo; tweenTo=null; }
    } else if(stripVel!==0 || stripPos>0.4 || stripPos<stripMin-0.4){
      stripPos += stripVel;
      stripVel *= 0.938;                                   /* 惯性衰减 */
      if(stripPos>0){ stripPos += (0-stripPos)*0.16; stripVel*=0.5; }         /* 左边缘回弹 */
      else if(stripPos<stripMin){ stripPos += (stripMin-stripPos)*0.16; stripVel*=0.5; } /* 右边缘回弹 */
      if(Math.abs(stripVel)<0.03) stripVel=0;
    } else return;
  }
  trackEl.style.transform='translate3d('+stripPos.toFixed(2)+'px,0,0)';
}
function bindStrip(){
  on(stripEl,'pointerdown',(e)=>{
    if(e.button>0) return;
    dragging=true; dragId=e.pointerId; dragMoved=0; stripVel=0; tweenTo=null;
    lastX=e.clientX; lastTS=performance.now();
    stripEl.classList.add('dragging');
    try{ stripEl.setPointerCapture(e.pointerId); }catch(err){}
  });
  on(stripEl,'pointermove',(e)=>{
    if(!dragging||e.pointerId!==dragId) return;
    const now=performance.now(), dx=e.clientX-lastX, dt=Math.max(8, now-lastTS);
    lastX=e.clientX; lastTS=now; dragMoved+=Math.abs(dx);
    const over=(stripPos>0||stripPos<stripMin)?0.36:1;      /* 越界阻尼 */
    stripPos+=dx*over; stripVel=dx/dt*16;
  });
  const end=(e)=>{
    if(!dragging) return;
    dragging=false; stripEl.classList.remove('dragging');
    try{ stripEl.releasePointerCapture(e.pointerId); }catch(err){}
  };
  on(stripEl,'pointerup',end); on(stripEl,'pointercancel',end);
  /* 点击或键盘回车选中；拖拽位移超过阈值则不视为点击 */
  on(trackEl,'click',(e)=>{
    const chip=e.target.closest? e.target.closest('.chip') : null;
    if(!chip) return;
    if(dragMoved>=7){ dragMoved=0; return; }
    goTo(+chip.dataset.i,true);
  });
  on(stripEl,'wheel',(e)=>{
    if(Math.abs(e.deltaX)>Math.abs(e.deltaY)){ e.preventDefault(); stripPos-=e.deltaX; stripVel=0; tweenTo=null; }
  },{passive:false});
  on(stripEl,'keydown',(e)=>{
    if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ e.preventDefault(); goTo(curIdx+(e.key==='ArrowRight'?1:-1), true); }
  });
}

/* ==========================================================================
   模块 17：Web Audio 实时合成音景（无音频文件，默认静音，切换无爆音）
   ========================================================================== */
let AC=null, master=null, noiseSrc=null, bpf=null, noiseGain=null, lfoOsc=null;
const oscs=[], oscGains=[];
let audioOn=false, accentTimer=0;
function termAudio(i){
  if(i<0) i=0;
  const season=Math.min(3,(i/6)|0), k=i%6;
  const roots=[146.83,196.00,174.61,130.81];               /* 春D 夏G 秋F 冬C */
  const sets=[[1,1.5,2.25],[1,1.25,1.875],[1,1.335,2],[1,1.5,2.67]];
  return {
    root: roots[season]*(1+k*0.0135),
    ratios: sets[season],
    filt: [980,1600,1150,620][season]*(0.78+k*0.085),
    q: [1.1,0.85,1.3,1.7][season]+k*0.05,
    noise: [0.26,0.19,0.23,0.32][season]+((i===1||i===5||i===11)?0.14:0)  /* 雨水/谷雨/大暑加雨声 */
  };
}
function startAudio(){
  const Ctx=window.AudioContext||window.webkitAudioContext;
  if(!Ctx){ toast('当前浏览器不支持 Web Audio，音景不可用。'); return false; }
  if(!AC){
    AC=new Ctx();
    master=AC.createGain(); master.gain.value=0.0001; master.connect(AC.destination);
    const len=Math.floor(AC.sampleRate*3), buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
    let b0=0,b1=0,b2=0;
    for(let i=0;i<len;i++){ const wn=Math.random()*2-1;
      b0=0.99*b0+wn*0.05; b1=0.963*b1+wn*0.096; b2=0.80*b2+wn*0.2;
      d[i]=(b0+b1+b2)*0.32; }
    noiseSrc=AC.createBufferSource(); noiseSrc.buffer=buf; noiseSrc.loop=true;
    bpf=AC.createBiquadFilter(); bpf.type='bandpass'; bpf.frequency.value=900; bpf.Q.value=1;
    noiseGain=AC.createGain(); noiseGain.gain.value=0.0001;
    noiseSrc.connect(bpf); bpf.connect(noiseGain); noiseGain.connect(master); noiseSrc.start();
    const types=['sine','sine','triangle'];
    for(let k=0;k<3;k++){
      const o=AC.createOscillator(), gn=AC.createGain();
      o.type=types[k]; o.frequency.value=200; gn.gain.value=0.0001;
      o.connect(gn); gn.connect(master); o.start();
      oscs.push(o); oscGains.push(gn);
    }
    lfoOsc=AC.createOscillator(); lfoOsc.frequency.value=0.07;
    const lg=AC.createGain(); lg.gain.value=170;
    lfoOsc.connect(lg); lg.connect(bpf.frequency); lfoOsc.start();
  }
  if(AC.state==='suspended') AC.resume();
  audioOn=true;
  tuneAudio(curIdx,0.8);
  const t=AC.currentTime;
  master.gain.cancelScheduledValues(t);
  master.gain.setValueAtTime(Math.max(master.gain.value,0.0001), t);
  master.gain.linearRampToValueAtTime(0.15, t+1.1);        /* 缓升，避免爆音 */
  scheduleAccent();
  return true;
}
function stopAudio(hard){
  if(!AC) return;
  audioOn=false; clearTimeout(accentTimer);
  const t=AC.currentTime;
  master.gain.cancelScheduledValues(t);
  master.gain.setValueAtTime(Math.max(master.gain.value,0.0001), t);
  master.gain.linearRampToValueAtTime(0.0001, t+0.7);      /* 缓降，避免爆音 */
  if(hard){ setTimeout(()=>{ try{ AC.close(); }catch(err){} AC=null; }, 800); }
}
function tuneAudio(i,ramp){
  if(!AC||!audioOn) return;
  const c=termAudio(i), t=AC.currentTime, R=(ramp||1.2)*0.42;
  bpf.frequency.setTargetAtTime(c.filt,t,R);
  bpf.Q.setTargetAtTime(c.q,t,R);
  noiseGain.gain.setTargetAtTime(c.noise,t,R);
  const lv=[0.085,0.05,0.032];
  for(let k=0;k<3;k++){
    oscs[k].frequency.setTargetAtTime(c.root*c.ratios[k],t,R*1.2);
    oscGains[k].gain.setTargetAtTime(lv[k],t,R);
  }
}
function scheduleAccent(){
  clearTimeout(accentTimer);
  if(!audioOn||!AC) return;
  accentTimer=setTimeout(()=>{ pluck(); scheduleAccent(); }, 2600+Math.random()*5400);
}
function pluck(){
  if(!AC||!audioOn) return;
  const c=termAudio(curIdx), t=AC.currentTime;
  const o=AC.createOscillator(), gn=AC.createGain();
  o.type='sine';
  o.frequency.value=c.root*c.ratios[1+((Math.random()*2)|0)]*2;
  gn.gain.setValueAtTime(0.0001,t);
  gn.gain.exponentialRampToValueAtTime(0.055,t+0.03);
  gn.gain.exponentialRampToValueAtTime(0.0001,t+1.9);
  o.connect(gn); gn.connect(master);
  o.start(t); o.stop(t+2.0);
  o.onended=()=>{ try{ o.disconnect(); gn.disconnect(); }catch(err){} };  /* 及时断连回收 */
}

/* ==========================================================================
   模块 18：事件绑定（键盘 / hash / 指针 / 尺寸 / 可见性 / 卸载）
   ========================================================================== */
function bindGlobal(){
  on(window,'pointermove',pointerMove,{passive:true});
  on(window,'pointerdown',pointerMove,{passive:true});
  on(window,'wheel',cancelTween,{passive:true});
  on(window,'touchstart',cancelTween,{passive:true});

  on(window,'keydown',(e)=>{
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    const k=e.key;
    if(k==='ArrowRight'){ e.preventDefault(); goTo(curIdx+1,true); }
    else if(k==='ArrowLeft'){ e.preventDefault(); goTo(curIdx-1,true); }
    else if(k==='Home'){ e.preventDefault(); goTo(0,true); }
    else if(k==='End'){ e.preventDefault(); goTo(TERMS.length-1,true); }
    else if(k==='Escape' && !sheetEl.hidden){ toggleSheet(false); }
  });

  on(window,'hashchange',()=>{
    const key=decodeURIComponent(location.hash.slice(1));
    for(let i=0;i<TERMS.length;i++) if(TERMS[i].k===key && i!==curIdx){ goTo(i,true); break; }
  });

  let rt=0;
  on(window,'resize',()=>{
    clearTimeout(rt);
    rt=setTimeout(()=>{
      const ow=W, oh=H;
      resizeCanvas();
      chH=0;                                   /* 尺寸变化后失效缓存 */
      for(let i=0;i<N;i++){ px[i]*=W/ow; py[i]*=H/oh; }
      stripBounds(); centerChip(curIdx); staticRedraw=6;
    },160);
  });

  on(document,'visibilitychange',()=>{
    paused=document.hidden;
    if(!paused){ lastFrame=performance.now(); needStatic=true; }
  });
  on(window,'pagehide',(e)=>{ if(!e.persisted) cleanupAll(); });

  on(railEl,'click',(e)=>{
    const b=e.target.closest? e.target.closest('.tick') : null;
    if(b) goTo(+b.dataset.i,true);
  });
  on(btnTheme,'click',()=>applyTheme(theme==='dark'?'light':'dark'));
  on(btnMotion,'click',()=>{
    applyMotion(!MOTION);
    toast(MOTION? '已恢复动态长卷' : '已切换为静态构图（尊重减少动态偏好）');
  });
  on(btnSound,'click',()=>{
    if(audioOn){
      stopAudio(false);
      btnSound.setAttribute('aria-pressed','false');
      btnSound.setAttribute('aria-label','开启环境音景（当前静音）');
      toast('环境音景已静音');
    } else if(startAudio()){
      btnSound.setAttribute('aria-pressed','true');
      btnSound.setAttribute('aria-label','关闭环境音景');
      toast('环境音景已开启：Web Audio 实时合成，音色随节气流转');
    }
  });
  on(btnInfo,'click',()=>toggleSheet(sheetEl.hidden));
  if(mqDark.addEventListener) mqDark.addEventListener('change',(e)=>{ if(!store('sot-theme')) applyTheme(e.matches?'dark':'light'); });
  if(mqMotion.addEventListener) mqMotion.addEventListener('change',(e)=>applyMotion(!e.matches));
}
function toggleSheet(open){
  sheetEl.hidden=!open;
  btnInfo.setAttribute('aria-expanded', open?'true':'false');
}

/* ==========================================================================
   模块 19：启动
   ========================================================================== */
function init(){
  try{ if('scrollRestoration' in history) history.scrollRestoration='manual'; }catch(err){}
  buildDOM();
  applyTheme(theme);
  applyMotion(!mqMotion.matches);
  for(const k of PKEYS) curPal[k]=PALETTES[theme][k].slice();  /* 首帧即为目标色，避免闪色 */
  resizeCanvas();
  allocParticles(defaultCount(), false);
  stripBounds();
  bindStrip();
  bindGlobal();

  const key=decodeURIComponent(location.hash.slice(1));
  let start=0;
  for(let i=0;i<TERMS.length;i++) if(TERMS[i].k===key) start=i;
  window.scrollTo(0, Math.round(start*chapterHeight()));
  curIdx=-1;
  onTermChange(start);
  curIdx=start;
  startLoop();
  document.documentElement.removeAttribute('data-boot');
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init,{once:true});
else init();
</script>
</body>
</html>
